{{- /* 확정 디자인: design-system/eink-proposal/tokens.json 및 mermaid.config.json. */ -}}
<link rel="preload" href="{{ "fonts/PretendardVariable.woff2" | relURL }}" as="font" type="font/woff2" crossorigin />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;600;700&display=swap" />
{{ range slice "moai-ds-tokens.css" "moai-ds-base.css" "moai-ds.css" "moai-ds-docs.css" "moai-ds-mascot.css" "moai-ds-v2.css" "moai-learning.css" "moai-kindle-tokens.css" "moai-kindle.css" }}
<link rel="stylesheet" href="{{ . | relURL }}?v={{ readFile (printf "static/%s" .) | sha256 }}" />
{{ end }}
<script>
(async function(){try{const faces=await document.fonts.load('16px "Pretendard Variable"','프로젝트 자료 ABC');document.documentElement.dataset.fontsLoaded=faces.length?'true':'false';}catch(error){document.documentElement.dataset.fontsLoaded='false';console.error('[문서 글꼴]',error);}})();
</script>
<link rel="icon" type="image/png" href="{{ "logos/moai-logo-3.png" | relURL }}" />
<link rel="canonical" href="{{ .Permalink }}" />
