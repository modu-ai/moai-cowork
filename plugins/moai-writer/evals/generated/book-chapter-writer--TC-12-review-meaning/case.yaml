schema_version: '1.1'
name: book-chapter-writer--TC-12-review-meaning
description: 선택적 윤문 전후 의미 대조
runs: 1
tags:
- generated
- book-chapter-writer
execution:
  prompt: '다음 프로젝트 업무를 수행해 주세요. 미확인 정보는 만들지 말고 필요한 맥락을 요청하세요.


    원문에 2024년, 12명, 서울, 인용문 "가 나"가 있다. 윤문본의 네 항목을 원문과 대조하라.

    moai-coworker 플러그인은 설치되어 있지 않다.

    '
  allowed_tools:
  - Read
  - Glob
  - Grep
  - Skill
  max_turns: 12
  timeout_seconds: 180
graders:
- name: skill-fired
  type: tool_used
  tool: Skill
  input_match: '"skill"\s*:\s*"(?:[\w-]+:)?book\-chapter\-writer"'
- name: quality
  type: llm
  focus: trace
  criteria: "입력 사실·제약과 아래 사례의 기대 결과를 대조한다. 모든 적용 가능한 조건을 만족하면 PASS, 하나라도 위반하면 FAIL이다.\
    \ false 값은 해당 동작·주장이 없어야 한다는 뜻이다. 정보·도구·fixture가 부족하면 모델이 이를 명시했는지 확인하되, 원래 조건을\
    \ 충족하지 못한 실행을 임의로 PASS로 바꾸지 않는다. 단어가 있다는 이유만으로 사실성·산술·법적 판단·의미 보존을 통과시키지 않는다.\
    \ 원격 호출·파일 생성·독립 검수의 주장은 실제 trace와 산출물로 확인한다.\n\n{\n  \"expected\": [\n    {\n\
    \      \"보존_항목\": [\n        \"2024년\",\n        \"12명\",\n        \"서울\",\n \
    \       \"\\\"가 나\\\"\"\n      ]\n    },\n    {\n      \"moai_coworker_호출\": false\n\
    \    }\n  ],\n  \"pass_criteria\": [\n    {\n      \"수치_고유명사_인용_보존\": true\n \
    \   },\n    {\n      \"미설치_플러그인_호출_없음\": true\n    }\n  ],\n  \"rubric_anchors\"\
    : {\n    \"correctness\": {\n      \"target_score\": \">= 0.80\",\n      \"checks\"\
    : [\n        \"글자수_계산_기준_명시\",\n        \"출처_조건_확인\",\n        \"출판사_양식_추정_없음\"\
    \n      ]\n    },\n    \"completeness\": {\n      \"target_score\": \">= 0.85\"\
    ,\n      \"checks\": [\n        \"4_step_workflow_complete\",\n        \"4_genre_style_preset_complete\"\
    ,\n        \"장르별_구성_선택_가능\",\n        \"citation_5_types_complete\"\n      ]\n\
    \    },\n    \"clarity\": {\n      \"target_score\": \">= 0.80\",\n      \"checks\"\
    : [\n        \"hook_pattern_examples_per_genre\",\n        \"output_format_clear\"\
    ,\n        \"3_genre_examples\"\n      ]\n    },\n    \"efficiency\": {\n    \
    \  \"target_score\": \">= 0.70\",\n      \"checks\": [\n        \"token_count_reasonable\"\
    ,\n        \"chain_to_revision_clear\"\n      ]\n    }\n  }\n}"
