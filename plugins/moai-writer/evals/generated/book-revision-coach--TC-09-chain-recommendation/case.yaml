schema_version: '1.1'
name: book-revision-coach--TC-09-chain-recommendation
description: 사용 가능한 검수만 연결하고 외부 전송을 차단
runs: 1
tags:
- generated
- book-revision-coach
execution:
  prompt: '다음 프로젝트 업무를 수행해 주세요. 미확인 정보는 만들지 말고 필요한 맥락을 요청하세요.


    퇴고 완료. 다음 단계는?

    '
  allowed_tools:
  - Read
  - Glob
  - Grep
  - Skill
  max_turns: 12
  timeout_seconds: 180
graders:
- name: skill-fired
  type: tool_used
  tool: Skill
  input_match: '"skill"\s*:\s*"(?:[\w-]+:)?book\-revision\-coach"'
- name: quality
  type: llm
  focus: trace
  criteria: "입력 사실·제약과 아래 사례의 기대 결과를 대조한다. 모든 적용 가능한 조건을 만족하면 PASS, 하나라도 위반하면 FAIL이다.\
    \ false 값은 해당 동작·주장이 없어야 한다는 뜻이다. 정보·도구·fixture가 부족하면 모델이 이를 명시했는지 확인하되, 원래 조건을\
    \ 충족하지 못한 실행을 임의로 PASS로 바꾸지 않는다. 단어가 있다는 이유만으로 사실성·산술·법적 판단·의미 보존을 통과시키지 않는다.\
    \ 원격 호출·파일 생성·독립 검수의 주장은 실제 trace와 산출물로 확인한다.\n\n{\n  \"expected\": [\n    {\n\
    \      \"public_spell_check\": \"명시적 공개 가능·사용자 허용·실제 브라우저 결과가 있을 때만\"\n    },\n\
    \    {\n      \"ai_slop_reviewer\": \"별도 설치·노출된 경우\"\n    },\n    {\n      \"\
    korean_humanize\": \"노출된 경우 문장 수정의 마지막 단계\"\n    },\n    {\n      \"final_check\"\
    : \"원문·최종본의 사실 앵커 대조와 투고 요건 확인\"\n    }\n  ],\n  \"pass_criteria\": [\n    {\n\
    \      \"unavailable_steps_recorded\": true\n    },\n    {\n      \"no_unverified_submission_ready_claim\"\
    : true\n    }\n  ],\n  \"rubric_anchors\": {\n    \"correctness\": {\n      \"\
    target_score\": \">= 0.80\",\n      \"checks\": [\n        \"kookrip_grammar_rule_referenced\"\
    ,\n        \"external_korean_표기법_accurate\",\n        \"copyright_law_referenced\"\
    \n      ]\n    },\n    \"completeness\": {\n      \"target_score\": \">= 0.85\"\
    ,\n      \"checks\": [\n        \"7_step_workflow_complete\",\n        \"4_genre_style_consistency_check\"\
    ,\n        \"revision_priority_p1_p2_p3\",\n        \"optional_finishing_and_submission_checks_clear\"\
    \n      ]\n    },\n    \"clarity\": {\n      \"target_score\": \">= 0.80\",\n\
    \      \"checks\": [\n        \"per_step_check_table_clear\",\n        \"report_template_complete\"\
    ,\n        \"editor_perspective_explained\"\n      ]\n    },\n    \"efficiency\"\
    : {\n      \"target_score\": \">= 0.70\",\n      \"checks\": [\n        \"token_count_reasonable\"\
    ,\n        \"check_priority_p1_p2_p3_concise\"\n      ]\n    }\n  }\n}"
