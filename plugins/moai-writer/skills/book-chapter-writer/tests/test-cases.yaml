version: 2.9.0
skill: book-chapter-writer

test_cases:
  - id: TC-01-structure
    name: 독자와 장르에 맞는 꼭지 구성
    input: |
      "30일 챌린지 시작하기" 꼭지 본문 작성. 4매.
    expected:
      - elements: [도입, 전개, 마무리]
      - optional_elements: [전환, 다음연결]
    pass_criteria:
      - 구성_강제_비율_없음: true

  - id: TC-02-genre-style-practical
    name: 실용서 문체 적용
    input: |
      "30일 챌린지" 부업서 꼭지.
    expected:
      - style:
        - 어미: "저자 문체에 따라 일관되게 조정"
        - 시각자료: "필요한 경우에만 배치"
        - 어조: "친근·격려"
    pass_criteria:
      - practical_style_applied: true

  - id: TC-03-genre-style-tech
    name: 기술서 문체 (코드 포함)
    input: |
      "Next.js App Router" 꼭지. 8매.
    expected:
      - style:
        - 어미: "저자 문체에 맞게 조정"
        - 시각자료: "설명에 필요한 것만 배치"
        - code_blocks: "설명에 필요한 경우만"
        - 코드_언어_지정: true
    pass_criteria:
      - tech_style_with_code: true

  - id: TC-04-genre-style-essay
    name: 인문·에세이 문체 (서사·은유)
    input: |
      "새벽 5시, 카페에서 만난 나" 에세이 1장 본문. 5매.
    expected:
      - style:
        - 문체: "서사·은유·문체 일관성"
        - 어미: "작가 자유"
        - 시각자료: "적음"
        - 어조: "사색적·고백적"
    pass_criteria:
      - narrative_style_applied: true

  - id: TC-05-genre-style-fiction
    name: 소설 문체 (시점·인물 일관성)
    input: |
      장편 소설 1장 본문 작성.
    expected:
      - style:
        - 시점_일관성: true
        - 인물_말투_일관성: true
        - 묘사_중심: true
    pass_criteria:
      - fiction_style_applied: true

  - id: TC-06-200ja-원고지-count
    name: 200자 원고지 분량 카운트
    input: |
      본문이 "가 나 다 라"이고 투고처는 공백 포함 글자 수를 200으로 나눈 매수를 요구한다.
      이 본문만 대상으로 글자 수와 매수를 표시하라.
    expected:
      - 분량_표시: "공백 포함 7자, 원고지 0.035매"
      - 변환_공식: "투고처가 공백 포함 200자 기준을 지정한 경우 측정한 글자 수 ÷ 200"
      - 계산_기준: "본문만, 공백 포함"
    pass_criteria:
      - 실제_문자수_일치: true
      - 표시_매수_산술_일치: true

  - id: TC-07-citation-handling
    name: 인용·각주 처리
    input: |
      출처와 이용 허락 여부를 확인할 수 있는 통계 데이터·인터뷰를 포함한 본문 작성.
    expected:
      - 출처_표시: "실제로 사용한 자료에 맞게"
      - 인용_조건: "목적·분량·이용 허락 여부를 개별 확인"
    pass_criteria:
      - used_citations_referenced: true

  - id: TC-08-verbatim-quote-rejection
    name: 허락 없는 외부 문장 전재 방지
    input: |
      vault에서 본 카피라이터 예시 문장 그대로 사용.
    expected:
      - reject_verbatim_without_basis: true
      - reframe: 개념만_추출_자체_재작성_또는_적법한_인용_조건_확인
    pass_criteria:
      - 무단_전재_없음: true

  - id: TC-09-chain-post-review
    name: 검수 단계와 외부 서비스 조건
    input: |
      본문 초고 완성 후 다음 단계는?
    expected:
      - chain:
        - book-revision-coach
        - korean-humanize (필요한 경우)
        - ai-slop-reviewer (설치된 경우)
      - 외부_맞춤법_서비스: "문서 공개 가능 여부와 사용자 의사 확인"
    pass_criteria:
      - 원문_사실_대조: true
      - 미설치_플러그인_호출_없음: true

  - id: TC-10-publisher-unknown
    name: 투고처 양식 미확인
    input: |
      공식 제출 안내를 찾지 못한 출판사에 보낼 원고다. 선호 어미와 원고지 계산 기준을 알려줘.
    expected:
      - 선호_어미: 미확인
      - 원고지_기준: 미확인
      - 다음_단계: "공식 안내를 확인하거나 출판사에 문의"
    pass_criteria:
      - 근거_없는_출판사_관행_없음: true

  - id: TC-11-licensed-quotation
    name: 허락된 직접 인용
    input: |
      저작권자가 서면으로 허락한 짧은 문장을 출처와 함께 인용하라.
    expected:
      - 허락된_인용: "원문을 구분하여 표시"
      - 출처_표시: true
    pass_criteria:
      - 적법한_인용_일률적_거부_없음: true

  - id: TC-12-review-meaning
    name: 선택적 윤문 전후 의미 대조
    input: |
      원문에 2024년, 12명, 서울, 인용문 "가 나"가 있다. 윤문본의 네 항목을 원문과 대조하라.
      moai-coworker 플러그인은 설치되어 있지 않다.
    expected:
      - 보존_항목: [2024년, 12명, 서울, '"가 나"']
      - moai_coworker_호출: false
    pass_criteria:
      - 수치_고유명사_인용_보존: true
      - 미설치_플러그인_호출_없음: true

rubric_anchors:
  correctness:
    target_score: ">= 0.80"
    checks:
      - 글자수_계산_기준_명시
      - 출처_조건_확인
      - 출판사_양식_추정_없음
  completeness:
    target_score: ">= 0.85"
    checks:
      - 4_step_workflow_complete
      - 4_genre_style_preset_complete
      - 장르별_구성_선택_가능
      - citation_5_types_complete
  clarity:
    target_score: ">= 0.80"
    checks:
      - hook_pattern_examples_per_genre
      - output_format_clear
      - 3_genre_examples
  efficiency:
    target_score: ">= 0.70"
    checks:
      - token_count_reasonable
      - chain_to_revision_clear
