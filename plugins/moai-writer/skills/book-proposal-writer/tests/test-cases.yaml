version: 2.9.0
skill: book-proposal-writer

test_cases:
  - id: TC-01-3-package
    name: 실제 준비된 자료와 미첨부 자료 구분
    input: |
      컨셉서와 목차만 있다. 샘플 원고와 저자 이력은 없다. 출판 제안서 초안을 작성하라.
    expected:
      - available: [컨셉서, 목차]
      - missing: [샘플원고, 저자이력]
    pass_criteria:
      - unprovided_attachments_not_claimed: true

  - id: TC-02-5-sections
    name: 제출 조건에 맞춘 구성
    input: |
      투고처의 제출 항목은 아직 확인하지 못했다. 출판기획서 초안을 작성하라.
    expected:
      - submission_requirements: 미확인
      - sections: "자료가 있는 항목만 초안으로 구성"
    pass_criteria:
      - no_unverified_submission_ready_claim: true

  - id: TC-03-marketing-5-categories
    name: 실행 가능한 홍보 활동만 표시
    input: |
      저자는 블로그를 운영한다. 강연·언론 출연·북토크는 확정되지 않았다.
    expected:
      - confirmed_channel: 블로그
      - unconfirmed_activities: [강연, 언론출연, 북토크]
    pass_criteria:
      - invented_metrics_or_schedule_absent: true

  - id: TC-04-publisher-format-tech
    name: 한빛미디어 공식 양식 미확인
    input: |
      한빛미디어 투고용 기술서 제안서. 현재 공식 제출 안내는 제공되지 않았다.
    expected:
      - publisher: 한빛미디어
      - format: "현재 공식 안내를 직접 확인한 값 또는 미확인"
      - route: "현재 공식 안내를 직접 확인한 값 또는 미확인"
    pass_criteria:
      - publisher_rule_not_invented: true

  - id: TC-05-publisher-format-literary
    name: 문학 투고와 신인상 경로 분리
    input: |
      민음사에 에세이집을 보내려 한다. 현재 접수 경로를 확인하지 못했다.
    expected:
      - publisher: 민음사
      - format: "현재 공식 안내를 직접 확인한 값 또는 미확인"
      - submission_route: "현재 공식 안내를 직접 확인한 값 또는 미확인"
    pass_criteria:
      - award_and_general_submission_not_conflated: true

  - id: TC-06-rejection-signal-detection
    name: 제안서 자료의 빈틈 표시
    input: |
      독자 인터뷰가 없고 샘플 원고가 첨부되지 않았다.
    expected:
      - gaps: [독자자료_가설, 샘플원고_미첨부]
    pass_criteria:
      - no_claim_of_rejection_probability: true
      - reader_hypothesis_not_promoted_to_fact: true

  - id: TC-07-sample-chapter-quality
    name: 샘플 원고 실제 파일 확인
    input: |
      샘플 원고의 제목만 전달받았다. 파일은 없다.
    expected:
      - attachment_status: 미첨부
    pass_criteria:
      - no_unobserved_quality_pass: true

  - id: TC-08-stereotype-publisher-naming
    name: 출판사명 정확성 (오타·잘못된 이름 검출)
    input: |
      "민음서" "한빛 미디어" "문학동내" 같은 오타 검출.
    expected:
      - correct_names: [민음사, 한빛미디어, 문학동네]
    pass_criteria:
      - typo_correction_applied: true

  - id: TC-09-unsourced-market
    name: 출처 없는 시장 수치 제거
    input: |
      제안서 초안에 "이 장르 시장은 2조 원이고 매년 20% 성장한다"고 쓰여 있다.
      이 수치의 원자료·조사 연도·시장 정의는 제공되지 않았다. 검토하라.
    expected:
      - market_size: 미확인
      - growth_rate: 미확인
      - action: "근거 자료를 확인할 때까지 확정 수치 제거"
    pass_criteria:
      - unsourced_market_numbers_not_published: true

  - id: TC-10-official-submission-fixture
    name: 제공된 공식 안내와 제안서 조건 대조
    input: |
      가상의 출판사 공식 제출 안내 발췌: "현재 PDF 원고만 접수, 한 번에 한 작품".
      이 안내가 실제 공식 페이지에 있는지는 아직 확인하지 못했다. 제출 조건을 정리하라.
    expected:
      - official_page_status: 미확인
      - draft_conditions: "PDF 원고, 한 번에 한 작품 — 제공된 발췌에 근거한 초안"
    pass_criteria:
      - supplied_excerpt_not_claimed_live: true

  - id: TC-11-reader-hypothesis-handoff
    name: 독자 가설이 제안서에서도 가설로 유지됨
    input: |
      book-target-reader 카드: "가설 — 30대 독자가 출근길에 전자책을 읽을 수 있다.
      독자 인터뷰와 구매 자료 없음." 이 카드로 제안서를 작성하라.
    expected:
      - reader_behavior_status: 가설
      - verified_readers_claim: false
    pass_criteria:
      - hypothesis_label_preserved: true

rubric_anchors:
  correctness:
    target_score: ">= 0.80"
    checks:
      - korean_publisher_names_accurate
      - market_data_only_when_sourced
      - publisher_submission_route_verified_or_unknown
  completeness:
    target_score: ">= 0.85"
    checks:
      - 4_step_workflow_complete
      - 4_genre_preset_complete
      - required_sections_follow_current_submission_rules
      - missing_materials_visible
  clarity:
    target_score: ">= 0.80"
    checks:
      - tables_clear
      - 3_genre_examples
      - marketing_commitments_evidenced
  efficiency:
    target_score: ">= 0.70"
    checks:
      - token_count_reasonable
      - publisher_match_table_compact
