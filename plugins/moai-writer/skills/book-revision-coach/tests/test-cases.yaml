version: 2.9.0
skill: book-revision-coach

test_cases:
  - id: TC-01-7-step-checklist
    name: 7 단계 점검 차례 진행
    input: |
      book-chapter-writer 초고 2장 퇴고.
    expected:
      - steps: [어법맞춤법, 문체일관성, 논리흐름, 인용각주, 분량정리, 시각자료, 일관성최종]
      - sequential_execution: true
    pass_criteria:
      - all_7_steps_executed: true
      - 단계별_보고서_present: true

  - id: TC-02-genre-style-consistency
    name: 4 장르 문체 일관성 검증
    input: |
      실용서 본문에 갑자기 소설 묘사 등장.
    expected:
      - violation_detected: true
      - reframe: 실용서_프리셋_복귀_권장
    pass_criteria:
      - style_violation_caught: true

  - id: TC-03-chapter-flow-check
    name: 저자 의도에 따른 꼭지 흐름 점검
    input: |
      전환과 다음 연결 없이 여운으로 끝나는 에세이 꼭지를 퇴고하라.
    expected:
      - flow_checked: [도입, 전개, 마무리]
      - optional_elements: [전환, 다음연결]
      - author_intent_considered: true
    pass_criteria:
      - missing_optional_elements_not_auto_failed: true

  - id: TC-04-citation-completeness
    name: 인용·각주 정합성
    input: |
      통계·인터뷰·인터넷 자료 인용 점검. 원고와 원출처·이용 허락 자료는 아직 제공되지 않았다.
    expected:
      - check_items: [출처명시, 양식정확, 각주순서, 저작권]
      - missing_sources_marked_unverified: true
    pass_criteria:
      - no_unobserved_citation_pass: true

  - id: TC-05-volume-balance
    name: 목표 분량과 실제 분량 비교
    input: |
      투고처 기준으로 측정한 2꼭지 분량은 7매이고 목표는 4매다.
    expected:
      - difference_reported: "3매 초과"
      - recommendation: "저자와 분할·축약 여부 협의"
    pass_criteria:
      - measured_basis_preserved: true
      - automatic_split_absent: true

  - id: TC-06-visual-asset-integrity
    name: 시각 자료 정합성
    input: |
      도표 2-2 본문 표시는 있으나 별첨 파일 없음.
    expected:
      - missing_attachment_detected: true
      - dpi_check: 300_이상
    pass_criteria:
      - asset_completeness_verified: true

  - id: TC-07-terminology-consistency
    name: 용어·표기 일관성
    input: |
      "데이타" / "데이터" / "Next.js" / "next.js" 혼용 검출.
    expected:
      - corrections:
        - 데이타: 데이터
        - next.js: Next.js
    pass_criteria:
      - terminology_unified: true

  - id: TC-08-publisher-style-compliance
    name: 출판사 양식 확인 전 고정 문체를 추정하지 않음
    input: |
      출판사 투고 본문에 "~다" / "~합니다"가 혼용됐다. 대상 출판사의 현재 양식은 제공되지 않았다.
    expected:
      - mixed_endings_flagged: true
      - publisher_preference: 미확인
      - current_submission_guidelines_requested: true
    pass_criteria:
      - unsupported_publisher_rule_absent: true

  - id: TC-09-chain-recommendation
    name: 사용 가능한 검수만 연결하고 외부 전송을 차단
    input: |
      퇴고 완료. 다음 단계는?
    expected:
      - public_spell_check: 명시적 공개 가능·사용자 허용·실제 브라우저 결과가 있을 때만
      - ai_slop_reviewer: 별도 설치·노출된 경우
      - korean_humanize: 노출된 경우 문장 수정의 마지막 단계
      - final_check: 원문·최종본의 사실 앵커 대조와 투고 요건 확인
    pass_criteria:
      - unavailable_steps_recorded: true
      - no_unverified_submission_ready_claim: true

rubric_anchors:
  correctness:
    target_score: ">= 0.80"
    checks:
      - kookrip_grammar_rule_referenced
      - external_korean_표기법_accurate
      - copyright_law_referenced
  completeness:
    target_score: ">= 0.85"
    checks:
      - 7_step_workflow_complete
      - 4_genre_style_consistency_check
      - revision_priority_p1_p2_p3
      - optional_finishing_and_submission_checks_clear
  clarity:
    target_score: ">= 0.80"
    checks:
      - per_step_check_table_clear
      - report_template_complete
      - editor_perspective_explained
  efficiency:
    target_score: ">= 0.70"
    checks:
      - token_count_reasonable
      - check_priority_p1_p2_p3_concise
