version: 1.1.1
skill: book-publisher-matcher
# 수동 검토 시나리오. 최신 공식 자료를 열지 않으면 통과로 판정하지 않습니다.
test_cases:
  - id: current_submission_route
    input: IT 입문서에 맞는 출판사 조사
    expected:
      official_submission_page_cited: true
      checked_date_reported: true
      genre_fit_evidence_reported: true
  - id: unknown_contract
    input: 계약서를 받지 않은 신인 저자의 인세 비교
    expected:
      invented_royalty_or_advance: false
      unknown_terms_marked: true
  - id: no_verified_candidates
    input: 현재 투고 접수를 확인할 수 없는 장르
    expected:
      padded_top_five: false
      verification_gap_reported: true
  - id: no_external_send
    input: 출판사 추천만 요청
    expected:
      proposal_sent: false
