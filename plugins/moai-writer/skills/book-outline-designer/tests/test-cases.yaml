version: 2.9.0
skill: book-outline-designer

# meta-skill-tester 형식. 실제 실행 전 판정은 NOT-RUN이다.
test_cases:
  - id: TC-01-flexible-levels
    name: 책에 필요한 목차 수준만 사용
    prompt: |
      짧은 에세이집의 목차를 장 단위로 만들어 줘. 부와 꼭지는 원하지 않아.
      장 제목은 아침, 점심, 밤이야.
    assertions:
      - type: contains
        value: "아침"
      - type: contains
        value: "밤"
      - type: not_contains
        value: "1부."
    expected:
      - required_levels: [장]
      - forced_parts_or_sections: false

  - id: TC-02-count-basis
    name: 원고지 기준 없이 장르 매수를 확정하지 않음
    prompt: |
      기술서 12장 목차를 설계해 줘. 원고지 계산 기준과 투고처 안내는 없어.
    assertions:
      - type: contains
        value: "미확인"
      - type: not_contains
        value: "기술서 표준 400~800매"
    expected:
      - genre_standard_pages: 없음
      - publisher_count_basis: 미확인

  - id: TC-03-synopsis
    name: 실제 자료만 시놉시스에 반영
    prompt: |
      1장 제목은 "첫 기록"이야. 저자가 제공한 내용은 기록의 이유와 방법뿐이야.
      인터뷰나 통계는 없어. 이 장의 시놉시스를 써 줘.
    assertions:
      - type: contains
        value: "기록"
      - type: not_contains
        value: "인터뷰에 따르면"
    expected:
      - invented_interview_or_statistic: false
      - mandatory_five_elements: false

  - id: TC-04-reader-reaction
    name: 조사 없는 독자 반응 점수 금지
    prompt: |
      목차를 검토해 줘. 독자 인터뷰나 완독률 조사는 하지 않았어.
      1부 끝의 신뢰도와 흥미를 퍼센트로 평가해 줘.
    assertions:
      - type: contains
        value: "조사"
      - type: not_contains
        value: "신뢰도 70% 유지"
    expected:
      - invented_reader_percentage: false

  - id: TC-05-publisher-format
    name: 투고처 양식은 현재 공식 안내로 확인
    prompt: |
      한빛미디어에 보낼 목차야. 현재 제출 안내는 아직 확인하지 못했어.
      한빛미디어가 반드시 4부 구성을 요구하는지 알려 줘.
    assertions:
      - type: contains
        value: "공식"
      - type: not_contains
        value: "4부 필수"
    expected:
      - fixed_four_part_requirement: 미확인

  - id: TC-06-concept-handoff
    name: 독자 가설을 목차에서도 가설로 유지
    prompt: |
      컨셉서에는 "독자가 출근길에 읽을 것"이라고 가설만 적혀 있어.
      독자 조사는 없다. 이 내용을 바탕으로 목차를 만들어 줘.
    assertions:
      - type: contains
        value: "가설"
      - type: not_contains
        value: "독자는 출근길에 읽는다"
    expected:
      - reader_behavior_status: 가설
