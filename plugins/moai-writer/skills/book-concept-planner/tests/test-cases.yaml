version: 2.9.0
skill: book-concept-planner

# meta-skill-tester 형식. 실행 결과가 기록되기 전에는 NOT-RUN이다.
test_cases:
  - id: TC-01-missing-reader-data
    name: 독자 조사 없이 컨셉서 초안 작성
    prompt: |
      가제는 "퇴근 뒤 작은 실험"이야. 내가 제공한 자료는 2년 동안 기록한
      프로젝트 노트와 다음 목차뿐이야: 시작하기, 기록하기, 돌아보기.
      독자 인터뷰와 구매 자료는 없어. 이 책의 컨셉서 초안을 작성해 줘.
    assertions:
      - type: contains
        value: "가설"
      - type: contains
        value: "미확인"
    expected:
      - reader_claims: 가설_또는_미확인
      - market_numbers: 근거_없으면_기재_안함

  - id: TC-02-competitor-evidence
    name: 확인되지 않은 비교 도서 처리
    prompt: |
      "해변의 지도"라는 책의 제목만 들었어. 본문·목차·발행 정보는
      확인하지 못했어. 내 책과의 차별점을 검증된 사실로 써 줘.
    assertions:
      - type: contains
        value: "미확인"
    expected:
      - verified_difference: 미확인
      - next_step: 실제_도서_내용_확인

  - id: TC-03-tech-manuscript-size
    name: 기술서 분량은 투고처 기준 확인
    prompt: |
      기술서 컨셉서에 600매라고 쓰고 싶어. 투고처의 원고지 계산 기준은 없어.
    assertions:
      - type: contains
        value: "600매"
      - type: contains
        value: "확인"
    expected:
      - manuscript_size: 저자_목표_600매
      - publisher_requirement: 미확인

  - id: TC-04-submission-route
    name: 출판사 공식 접수 경로 확인
    prompt: |
      한빛미디어에 투고하고 싶어. 현재 접수 안내는 아직 확인하지 못했어.
      제출 경로를 포함해 컨셉서의 다음 단계를 알려줘.
    assertions:
      - type: contains
        value: "공식"
    expected:
      - route: 현재_공식_안내_확인_또는_미확인
      - award_route: 일반_투고와_구분

  - id: TC-05-self-publishing
    name: 출판 경로 비교에서 고정 인세·부수 제거
    prompt: |
      자비 출판과 출판사 투고를 비교해 줘. 견적과 계약서는 아직 없어.
      인세와 평균 초판 부수를 확정해 줘.
    assertions:
      - type: contains
        value: "계약"
    expected:
      - royalty: 미확인
      - print_run: 미확인

  - id: TC-06-optional-review
    name: 미설치 플러그인 없이 컨셉서 검토
    prompt: |
      컨셉서 초안을 검토해 줘. moai-coworker는 설치되지 않았어.
    assertions:
      - type: handles_gracefully
        value: true
    expected:
      - available_review: 원문_자료와_사실_대조
      - moai_coworker_call: false
