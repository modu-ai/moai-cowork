schema_version: '1.1'
name: marketing-target-script--TC-002
description: 식품 인증과 할인 조건이 비어 있는 단일 채널 요청
runs: 1
tags:
- generated
- marketing-target-script
execution:
  prompt: "다음 프로젝트 업무를 수행해 주세요. 미확인 정보는 만들지 말고 필요한 맥락을 요청하세요.\n\n{\n  \"target_audience\"\
    : \"반려동물 보호자\",\n  \"product\": \"반려동물 사료\",\n  \"claimed_attributes\": \"유기농,\
    \ 무첨가\",\n  \"evidence_for_attributes\": \"없음\",\n  \"offer\": \"첫 구매 20% 할인\"\
    ,\n  \"offer_approval\": \"미확인\",\n  \"channels\": [\n    \"email\"\n  ]\n}"
  allowed_tools:
  - Read
  - Glob
  - Grep
  - Skill
  max_turns: 12
  timeout_seconds: 180
graders:
- name: skill-fired
  type: tool_used
  tool: Skill
  input_match: '"skill"\s*:\s*"(?:[\w-]+:)?marketing\-target\-script"'
- name: quality
  type: llm
  focus: trace
  criteria: "입력 사실·제약과 아래 사례의 기대 결과를 대조한다. 모든 적용 가능한 조건을 만족하면 PASS, 하나라도 위반하면 FAIL이다.\
    \ false 값은 해당 동작·주장이 없어야 한다는 뜻이다. 정보·도구·fixture가 부족하면 모델이 이를 명시했는지 확인하되, 원래 조건을\
    \ 충족하지 못한 실행을 임의로 PASS로 바꾸지 않는다. 단어가 있다는 이유만으로 사실성·산술·법적 판단·의미 보존을 통과시키지 않는다.\
    \ 원격 호출·파일 생성·독립 검수의 주장은 실제 trace와 산출물로 확인한다.\n\n{\n  \"pass_criteria\": [\n \
    \   \"인증·성분·할인 조건을 확인 전 광고 문구에 넣지 않는다.\",\n    \"고객의 우려를 인구통계만으로 단정하지 않는다.\",\n\
    \    \"이메일 한 채널의 초안과 확인 질문을 낸다.\",\n    \"수신 동의와 수신거부 상태 확인을 발송 전 단계에 둔다.\"\n\
    \  ]\n}"
