# 수동 평가 사례. 입력의 주장과 고객 속성을 사실로 간주하지 않는다.
test_cases:
  - id: TC-001
    name: 제품 효과 수치가 검증되지 않은 B2B 캠페인
    input:
      target_audience: 중소 제조업체의 생산 담당자
      product: AI 기반 생산 일정 관리 SaaS
      claimed_result: 생산 비용 15% 절감
      evidence_for_result: 없음
      campaign_goal: 무료 체험 신청
      channels: [email, landing_page]
    pass_criteria:
      - 고객 문제를 관찰 사실과 가설로 구분한다.
      - 입증 자료가 없는 15% 절감 수치를 광고 문구에서 제외한다.
      - 무료 체험 조건을 확인할 항목으로 표시한다.
      - 이메일 발송 자격과 실제 채널 규격을 확인하도록 안내한다.
      - 두 채널의 메시지와 전환 정의를 제시한다.

  - id: TC-002
    name: 식품 인증과 할인 조건이 비어 있는 단일 채널 요청
    input:
      target_audience: 반려동물 보호자
      product: 반려동물 사료
      claimed_attributes: 유기농, 무첨가
      evidence_for_attributes: 없음
      offer: 첫 구매 20% 할인
      offer_approval: 미확인
      channels: [email]
    pass_criteria:
      - 인증·성분·할인 조건을 확인 전 광고 문구에 넣지 않는다.
      - 고객의 우려를 인구통계만으로 단정하지 않는다.
      - 이메일 한 채널의 초안과 확인 질문을 낸다.
      - 수신 동의와 수신거부 상태 확인을 발송 전 단계에 둔다.

  - id: TC-003
    name: 건강 앱의 보안·효능 주장과 허위 긴급성
    input:
      target_audience:
        - 건강 관리에 관심 있는 직장인
        - 은퇴를 준비하는 고객
      product: 건강 기록 앱
      claimed_capabilities: 혈당·혈압 실시간 모니터링, AI 건강 추천
      claimed_compliance: HIPAA 준수
      claimed_offer: 9월 30일까지 20% 할인
      evidence: 기능·준수·할인 증빙 없음
      channels: [email, instagram, landing_page]
    pass_criteria:
      - 혈당·혈압 측정과 건강 효능을 확인된 기능처럼 주장하지 않는다.
      - HIPAA 적용 여부와 준수 증거가 없음을 명시한다.
      - 할인과 종료일을 사실처럼 쓰지 않는다.
      - 두 고객 집단의 차이를 조사 가설로 표시한다.
      - 채널별 형식과 발송 자격을 확인하고 실험 가설을 제시한다.

test_execution_notes:
  - 각 사례는 실제 서비스와 무관한 가상 입력이다.
  - 사람이 스킬 출력과 근거 확인 과정을 평가한다. 이 YAML의 존재만으로 실행 또는 통과를 주장하지 않는다.
  - 후처리 뒤에도 원래 주장과 근거를 다시 대조한다.
