schema_version: '1.1'
name: consult-brief--TC-001
description: 정상 입력으로 완전한 컨설팅 브리프 생성
runs: 1
tags:
- generated
- consult-brief
execution:
  prompt: "다음 프로젝트 업무를 수행해 주세요. 미확인 정보는 만들지 말고 필요한 맥락을 요청하세요.\n\n{\n  \"industry\"\
    : \"핀테크 (뱅킹 앱)\",\n  \"problem_definition\": \"최근 1년 동안 신규 가입자는 증가했지만 월간 활성 사용자(MAU)는\
    \ 정체.\\n특히 20대 사용자의 이탈률이 높음(45%). 리텐션 전략 필요.\\n\",\n  \"project_scope\": [\n \
    \   \"고객 코호트 분석\",\n    \"이탈 원인 규명\",\n    \"리텐션 전략 수립\",\n    \"실행 로드맵 작성\"\n\
    \  ],\n  \"budget\": \"3억 원\",\n  \"timeline\": \"4개월 (2026년 Q3)\"\n}"
  allowed_tools:
  - Read
  - Glob
  - Grep
  - Skill
  max_turns: 12
  timeout_seconds: 180
graders:
- name: skill-fired
  type: tool_used
  tool: Skill
  input_match: '"skill"\s*:\s*"(?:[\w-]+:)?consult\-brief"'
- name: quality
  type: llm
  focus: trace
  criteria: "입력 사실·제약과 아래 사례의 기대 결과를 대조한다. 모든 적용 가능한 조건을 만족하면 PASS, 하나라도 위반하면 FAIL이다.\
    \ false 값은 해당 동작·주장이 없어야 한다는 뜻이다. 정보·도구·fixture가 부족하면 모델이 이를 명시했는지 확인하되, 원래 조건을\
    \ 충족하지 못한 실행을 임의로 PASS로 바꾸지 않는다. 단어가 있다는 이유만으로 사실성·산술·법적 판단·의미 보존을 통과시키지 않는다.\
    \ 원격 호출·파일 생성·독립 검수의 주장은 실제 trace와 산출물로 확인한다.\n\n{\n  \"expected_output\": {\n\
    \    \"contains_sections\": [\n      \"Executive Summary\",\n      \"현황 분석\",\n\
    \      \"문제 정의\",\n      \"분석 프레임워크\",\n      \"권고사항\",\n      \"실행 계획\"\n   \
    \ ],\n    \"contains_keywords\": [\n      \"리텐션\",\n      \"코호트 분석\",\n      \"\
    이탈률\",\n      \"MAU\",\n      \"고객 생애 가치\"\n    ],\n    \"frameworks_used\": [\n\
    \      \"AARRR\",\n      \"Cohort Analysis\"\n    ],\n    \"has_recommendations_priority\"\
    : true,\n    \"has_measurement_plan\": true\n  }\n}"
