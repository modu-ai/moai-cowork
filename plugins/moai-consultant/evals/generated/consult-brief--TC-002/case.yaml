schema_version: '1.1'
name: consult-brief--TC-002
description: 최소 입력으로 기본 브리프 생성
runs: 1
tags:
- generated
- consult-brief
execution:
  prompt: "다음 프로젝트 업무를 수행해 주세요. 미확인 정보는 만들지 말고 필요한 맥락을 요청하세요.\n\n{\n  \"industry\"\
    : \"식음료 (프랜차이즈 카페)\",\n  \"problem_definition\": \"매출이 3개월 연속 하락 중. 원인 파악과 대책\
    \ 필요.\",\n  \"project_scope\": [],\n  \"budget\": \"미정\",\n  \"timeline\": \"\
    미정\"\n}"
  allowed_tools:
  - Read
  - Glob
  - Grep
  - Skill
  max_turns: 12
  timeout_seconds: 180
graders:
- name: skill-fired
  type: tool_used
  tool: Skill
  input_match: '"skill"\s*:\s*"(?:[\w-]+:)?consult\-brief"'
- name: quality
  type: llm
  focus: trace
  criteria: "입력 사실·제약과 아래 사례의 기대 결과를 대조한다. 모든 적용 가능한 조건을 만족하면 PASS, 하나라도 위반하면 FAIL이다.\
    \ false 값은 해당 동작·주장이 없어야 한다는 뜻이다. 정보·도구·fixture가 부족하면 모델이 이를 명시했는지 확인하되, 원래 조건을\
    \ 충족하지 못한 실행을 임의로 PASS로 바꾸지 않는다. 단어가 있다는 이유만으로 사실성·산술·법적 판단·의미 보존을 통과시키지 않는다.\
    \ 원격 호출·파일 생성·독립 검수의 주장은 실제 trace와 산출물로 확인한다.\n\n{\n  \"expected_output\": {\n\
    \    \"contains_sections\": [\n      \"Executive Summary\",\n      \"현황 분석\",\n\
    \      \"문제 정의\",\n      \"권고사항\"\n    ],\n    \"contains_keywords\": [\n    \
    \  \"매출 하락\",\n      \"원인 분석\"\n    ],\n    \"frameworks_used\": [],\n    \"has_recommendations_priority\"\
    : true,\n    \"budget_guidance_present\": true,\n    \"timeline_guidance_present\"\
    : true\n  }\n}"
