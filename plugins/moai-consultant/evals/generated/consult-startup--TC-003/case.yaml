schema_version: '1.1'
name: consult-startup--TC-003
description: '복잡한 입력값(Deep Tech, 연구 성과 기반, 대형 초기 자본, 다차원 시장)을

  처리하여 정교한 계획서가 생성되는지 검증합니다.

  '
runs: 1
tags:
- generated
- consult-startup
execution:
  prompt: "다음 프로젝트 업무를 수행해 주세요. 미확인 정보는 만들지 말고 필요한 맥락을 요청하세요.\n\n{\n  \"startup_name\"\
    : \"퀀텀바이오\",\n  \"idea\": \"양자 컴퓨팅 기반 신약 개발 플랫폼\",\n  \"target_market\": [\n \
    \   {\n      \"primary\": \"제약사 신약 개발 부서\"\n    },\n    {\n      \"secondary\"\
    : \"바이오 벤처\"\n    },\n    {\n      \"tertiary\": \"연구소\"\n    }\n  ],\n  \"team_info\"\
    : [\n    {\n      \"CEO\": \"제약사 R&D 15년, 박사\"\n    },\n    {\n      \"CTO\":\
    \ \"양자 컴퓨팅 12년, 박사\"\n    },\n    {\n      \"CSO\": \"분자 생물학 10년, 박사\"\n    },\n\
    \    {\n      \"CBO\": \"바이오 투자 8년\"\n    }\n  ],\n  \"initial_capital\": \"20억원\
    \ (팀 자출 5억 + 시리즈 A 15억)\",\n  \"special_considerations\": [\n    \"기술 TRL 6단계\
    \ (연구실 검증 완료)\",\n    \"특허 3건 보유\",\n    \"제약사 2사와 PoC 진행 중\",\n    \"규제 승인 필요\
    \ (FDA)\"\n  ]\n}"
  allowed_tools:
  - Read
  - Glob
  - Grep
  - Skill
  max_turns: 12
  timeout_seconds: 180
graders:
- name: skill-fired
  type: tool_used
  tool: Skill
  input_match: '"skill"\s*:\s*"(?:[\w-]+:)?consult\-startup"'
- name: quality
  type: llm
  focus: trace
  criteria: "입력 사실·제약과 아래 사례의 기대 결과를 대조한다. 모든 적용 가능한 조건을 만족하면 PASS, 하나라도 위반하면 FAIL이다.\
    \ false 값은 해당 동작·주장이 없어야 한다는 뜻이다. 정보·도구·fixture가 부족하면 모델이 이를 명시했는지 확인하되, 원래 조건을\
    \ 충족하지 못한 실행을 임의로 PASS로 바꾸지 않는다. 단어가 있다는 이유만으로 사실성·산술·법적 판단·의미 보존을 통과시키지 않는다.\
    \ 원격 호출·파일 생성·독립 검수의 주장은 실제 trace와 산출물로 확인한다.\n\n{\n  \"expected_outputs\": [\n\
    \    {\n      \"아이디어 검증 섹션 (Deep Tech 특성\": \"높은 기술 진입 장벽, 장기 개발 주기)\"\n    },\n\
    \    {\n      \"시장 분석 섹션 (다차원 시장\": \"제약사, 바이오 벤처, 연구소)\"\n    },\n    \"비즈니스\
    \ 모델 캔버스 섹션 (B2B 엔터프라이즈 모델, 라이선싱 + SaaS 하이브리드)\",\n    \"피치덱 구조 섹션 (15슬라이드, 기술\
    \ 우위 강조, 특허, PoC 성과 포함)\",\n    \"재무 모델 섹션 (확인된 입력값과 검증이 필요한 투자 가정 구분)\",\n  \
    \  \"실행 로드맵 섹션 (규제 승인 로드맵, 제약사 파트너십, 글로벌 확장)\",\n    \"Deep Tech 특화 리스크 분석 (기술\
    \ 리스크, 규제 리스크, 자금 조달 리스크)\"\n  ],\n  \"pass_criteria\": [\n    \"Deep Tech 특성(높은\
    \ 기술 진입 장벽, 장기 개발 주기)이 반영됨\",\n    \"다차원 시장(제약사, 바이오 벤처, 연구소)이 각각 분석됨\",\n   \
    \ \"특허 3건과 PoC 진행 사실은 입력으로 제공된 주장임을 표시하고 증빙 확인 필요성을 명시\",\n    \"규제 승인 필요 여부와\
    \ 적용 관할·경로를 공식 자료로 확인하기 전에는 확정하지 않음\",\n    \"투자 라운드나 매출 전망을 입력 없이 가정하지 않음\"\n\
    \  ]\n}"
