[project]
name = "moai-mcp-openai"
version = "0.1.0"
description = "OpenAI GPT Image 2.5 이미지 생성 MCP"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "modu-ai" }]
dependencies = [
    "mcp>=1.2.0,<2.0",
    "httpx>=0.27.0",
]

[project.scripts]
moai-mcp-openai = "moai_mcp_openai.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/moai_mcp_core", "src/moai_mcp_openai"]

[dependency-groups]
dev = ["pytest>=8.0.0", "respx>=0.21.0"]
