# media-midjourney-v8-prompt — 현재 공식 V8 계약을 확인하는 테스트 케이스

tests:
  - name: product-shot-hd
    description: 제품샷 프리셋과 사용자가 요청한 HD
    prompt: "Midjourney 프롬프트, 매트 블랙 머그에 \"MONDAY\" 글자, 1:1, --hd"
    expected_output:
      format: markdown
      contains:
        - "Midjourney V8.2"
        - "--ar 1:1"
        - "--hd"
        - '"MONDAY"'
        - "GPT Image 2.5"
        - "Gemini"
      assertion:
        - Midjourney 프롬프트에는 --q Quality 파라미터를 넣지 않음
        - 현재 공식 GPU 시간과 계정 사용량을 확인하도록 안내하고 임의의 비용 배수를 계산하지 않음
        - ChatGPT 기본 이미지 도구의 내부 API 모델을 지정했다고 주장하지 않음

  - name: legacy-omni-reference
    description: 사용자가 구형 Omni Reference 옵션을 입력
    prompt: "미드저니 V8.2 프롬프트, --oref https://example.com/char.jpg --cw 50, 같은 캐릭터를 눈 내리는 숲에"
    expected_output:
      format: markdown
      contains:
        - "Edit Model"
        - "--edit"
      assertion:
        - V8 출력 프롬프트에 --oref 또는 --cw를 그대로 넣지 않음
        - 웹 Attach to prompt와 Discord --edit 경로를 구분
        - 참조 이미지에서 지킬 캐릭터 특징을 확인하거나 명시

  - name: style-reference
    description: Style Reference 코드를 지정
    prompt: "MJ 프롬프트 --sref 1234567890 --sw 200 시네마틱 풍경"
    expected_output:
      format: markdown
      contains:
        - "--sref 1234567890"
        - "--sw 200"
      assertion:
        - --sv 7을 V8 기본값이라고 단정하지 않음
        - 근거 없는 Style Reference 비용 배수를 계산하지 않음

  - name: unsupported-quality
    description: 사용자가 V8에서 지원하지 않는 --q 4를 입력
    prompt: "미드저니 V8.2 인물 사진 프롬프트, --hd --q 4, 9:16"
    expected_output:
      format: markdown
      contains:
        - "--hd"
        - "--ar 9:16"
      assertion:
        - --q 4가 V8.2에서 지원되지 않는다고 설명
        - 출력할 Midjourney 프롬프트에서는 --q 4를 제거
        - --hd 비용을 4배 또는 --q와 16배로 계산하지 않음

  - name: deprecated-character-reference
    description: 사용자가 오래된 --cref를 입력
    prompt: "MJ V8 프롬프트, --cref https://example.com/face.jpg 인물 일관성"
    expected_output:
      format: markdown
      contains:
        - "Edit Model"
      assertion:
        - --cref를 --oref로 자동 교체하지 않음
        - 현재 V8의 Edit Model 참조 이미지 경로를 설명

  - name: ambiguous-input
    description: 모호한 요청에서는 앱에서 가능한 질문 경로로 용도를 확인
    prompt: "미드저니 프롬프트 만들어줘"
    expected_output:
      assertion:
        - 구조화 질문 도구가 있으면 사용하고 없으면 일반 대화로 용도를 확인
        - 답변 없이 프리셋과 이미지 생성 경로를 임의로 확정하지 않음

rubric_targets:
  correctness: 0.80
  completeness: 0.75
  clarity: 0.75
  efficiency: 0.70
  weighted_pass_threshold: 0.70

regression:
  baseline_version: "1.1.1"
  changed_files:
    - SKILL.md
    - references/cost-traps.md
    - references/parameter-cheatsheet.md
    - references/prompt-blocks.md
    - references/style-references.md
    - tests/test-cases.yaml
  expected_diff: "현재 V8.2 기본값과 Edit Model·GPU 시간·앱 공통 질문 경로로 갱신"
