# media-gemini-3-image-prompt — 테스트 케이스

tests:
  - name: happy-path-product-shot
    description: 제품샷 프리셋 + 1:1 → Gemini 5-component 메인 + GPT·MJ 보조
    prompt: "Gemini 이미지 프롬프트 만들어줘. 매트 블랙 머그 'MONDAY' 글자 들어간 제품샷, 1:1"
    expected_output:
      format: markdown
      contains:
        - "### 1) Gemini 3 Pro Image"
        - "### 2) GPT Image 2.5"
        - "### 3) Midjourney V8.2"
        - '"MONDAY"'
        - "aspect_ratio"
        - "image_size"             # 현재 Gemini API 출력 크기 필드
        - "SynthID"                # 워터마크 안내
      not_contains:
        - "metadata:"
        - "TODO"
        - "<placeholder>"
      assertion:
        - Gemini 5-component 마침표 구분 (component당 영문 문장)
        - 카메라 기종은 필요한 경우에만 외형 단서로 쓰고 실제 촬영 장비를 사용했다고 주장하지 않음
        - SynthID 워터마크 한국어 해설 포함

  - name: happy-path-portrait-21-9
    description: 인물 프리셋 + 21:9 → 세 모델의 화면비 설정을 구분
    prompt: "Gemini 3 Pro Image 시네마틱 인물 프롬프트, 21:9 울트라와이드"
    expected_output:
      format: markdown
      contains:
        - "21:9"
        - "Gemini"
        - "aspect_ratio=21:9"
        - "1792x768"
        - "--ar 21:9"
      not_contains:
        - "metadata:"
        - "aspect_ratio=1:1"
        - "size=1024x1024"
      assertion:
        - Gemini에는 21:9 화면비를 유지
        - GPT Image 2.5 API에는 유효한 1792x768 예시를, Midjourney에는 --ar 21:9를 적용하고 ChatGPT 기본 이미지 도구에서 크기 파라미터를 직접 지정한다고 주장하지 않음

  - name: search-grounding-infographic
    description: 인포그래픽 → Search Grounding 활성화 권장
    prompt: "나노바나나 프롬프트로 2026년 한국 SNS 사용자 수 비교 인포그래픽"
    expected_output:
      format: markdown
      contains:
        - "Search Grounding"
        - "공식"                    # 확인 가능한 출처 요구
        - "verbatim"
        - "출처"
      not_contains:
        - "metadata:"
      assertion:
        - 현재 경로가 Google Search Grounding을 지원할 때만 활성화 안내
        - Gemini 3 Pro Image를 공통 mode=Thinking API 값으로 표시하지 않음
        - 실제 수치와 출처를 별도 검증하도록 안내

  - name: reference-images-character
    description: 캐릭터 일관성 → 14 reference image 슬롯 전략 안내
    prompt: "Gemini 프롬프트로 브랜드 캐릭터 마스코트를 다른 장면에 등장시키기"
    expected_output:
      format: markdown
      contains:
        - "reference"
        - "Image 1"                  # reference 라벨링
        - "preserve"                 # 일관성 키워드
      assertion:
        - 총 14개와 Pro의 객체 6개·캐릭터 5개·스타일 3개 유형별 한도 안내
        - '"Image N" 라벨링 패턴 출력'

  - name: edge-case-ambiguous-input
    description: 모호한 입력 → 현재 앱의 질문 경로로 프리셋 선택
    prompt: "Gemini 이미지 프롬프트 만들어줘"
    expected_output:
      assertion:
        - 현재 노출된 질문 도구로 프리셋을 묻고, 도구가 없으면 필요한 선택을 blocker로 반환
        - 비동기 질문 도구의 즉시 반환을 사용자 답변으로 간주하지 않음

rubric_targets:
  correctness: 0.80
  completeness: 0.75
  clarity: 0.75
  efficiency: 0.70
  weighted_pass_threshold: 0.70

regression:
  baseline_version: "1.1.6"
  changed_files:
    - SKILL.md
    - references/prompt-blocks.md
    - references/parameter-cheatsheet.md
    - references/reference-images.md
    - references/search-grounding.md
    - tests/test-cases.yaml
  expected_diff: "앱 공통 프리셋 경로, Gemini API 파라미터, 참조 이미지 유형별 한도와 질문 채널 정합"
