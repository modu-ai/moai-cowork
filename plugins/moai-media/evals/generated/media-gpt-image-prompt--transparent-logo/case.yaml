schema_version: '1.1'
name: media-gpt-image-prompt--transparent-logo
description: 투명 로고 → background=transparent + png + 알파 검수
runs: 1
tags:
- generated
- media-gpt-image-prompt
execution:
  prompt: '다음 프로젝트 업무를 수행해 주세요. 미확인 정보는 만들지 말고 필요한 맥락을 요청하세요.


    빵집 로고 GPT 이미지 프롬프트, 배경 투명하게'
  allowed_tools:
  - Read
  - Glob
  - Grep
  - Skill
  max_turns: 12
  timeout_seconds: 180
graders:
- name: skill-fired
  type: tool_used
  tool: Skill
  input_match: '"skill"\s*:\s*"(?:[\w-]+:)?media\-gpt\-image\-prompt"'
- name: quality
  type: llm
  focus: trace
  criteria: "입력 사실·제약과 아래 사례의 기대 결과를 대조한다. 모든 적용 가능한 조건을 만족하면 PASS, 하나라도 위반하면 FAIL이다.\
    \ false 값은 해당 동작·주장이 없어야 한다는 뜻이다. 정보·도구·fixture가 부족하면 모델이 이를 명시했는지 확인하되, 원래 조건을\
    \ 충족하지 못한 실행을 임의로 PASS로 바꾸지 않는다. 단어가 있다는 이유만으로 사실성·산술·법적 판단·의미 보존을 통과시키지 않는다.\
    \ 원격 호출·파일 생성·독립 검수의 주장은 실제 trace와 산출물로 확인한다.\n\n{\n  \"expected_output\": {\n\
    \    \"format\": \"markdown\",\n    \"contains\": [\n      \"background=transparent\"\
    ,\n      \"png\",\n      \"non-infringing\"\n    ],\n    \"not_contains\": [\n\
    \      \"투명 배경 미지원\"\n    ],\n    \"assertion\": [\n      \"결과 검수에 알파 채널 확인 항목\
    \ 포함\"\n    ]\n  }\n}"
