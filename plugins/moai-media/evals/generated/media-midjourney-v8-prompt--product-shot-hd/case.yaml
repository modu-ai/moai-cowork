schema_version: '1.1'
name: media-midjourney-v8-prompt--product-shot-hd
description: 제품샷 프리셋과 사용자가 요청한 HD
runs: 1
tags:
- generated
- media-midjourney-v8-prompt
execution:
  prompt: '다음 프로젝트 업무를 수행해 주세요. 미확인 정보는 만들지 말고 필요한 맥락을 요청하세요.


    Midjourney 프롬프트, 매트 블랙 머그에 "MONDAY" 글자, 1:1, --hd'
  allowed_tools:
  - Read
  - Glob
  - Grep
  - Skill
  max_turns: 12
  timeout_seconds: 180
graders:
- name: skill-fired
  type: tool_used
  tool: Skill
  input_match: '"skill"\s*:\s*"(?:[\w-]+:)?media\-midjourney\-v8\-prompt"'
- name: quality
  type: llm
  focus: trace
  criteria: "입력 사실·제약과 아래 사례의 기대 결과를 대조한다. 모든 적용 가능한 조건을 만족하면 PASS, 하나라도 위반하면 FAIL이다.\
    \ false 값은 해당 동작·주장이 없어야 한다는 뜻이다. 정보·도구·fixture가 부족하면 모델이 이를 명시했는지 확인하되, 원래 조건을\
    \ 충족하지 못한 실행을 임의로 PASS로 바꾸지 않는다. 단어가 있다는 이유만으로 사실성·산술·법적 판단·의미 보존을 통과시키지 않는다.\
    \ 원격 호출·파일 생성·독립 검수의 주장은 실제 trace와 산출물로 확인한다.\n\n{\n  \"expected_output\": {\n\
    \    \"format\": \"markdown\",\n    \"contains\": [\n      \"Midjourney V8.2\"\
    ,\n      \"--ar 1:1\",\n      \"--hd\",\n      \"\\\"MONDAY\\\"\",\n      \"GPT\
    \ Image 2.5\",\n      \"Gemini\"\n    ],\n    \"assertion\": [\n      \"Midjourney\
    \ 프롬프트에는 --q Quality 파라미터를 넣지 않음\",\n      \"현재 공식 GPU 시간과 계정 사용량을 확인하도록 안내하고\
    \ 임의의 비용 배수를 계산하지 않음\",\n      \"ChatGPT 기본 이미지 도구의 내부 API 모델을 지정했다고 주장하지 않음\"\
    \n    ]\n  }\n}"
