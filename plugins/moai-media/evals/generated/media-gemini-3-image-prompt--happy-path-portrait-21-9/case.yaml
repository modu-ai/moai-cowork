schema_version: '1.1'
name: media-gemini-3-image-prompt--happy-path-portrait-21-9
description: 인물 프리셋 + 21:9 → 세 모델의 화면비 설정을 구분
runs: 1
tags:
- generated
- media-gemini-3-image-prompt
execution:
  prompt: '다음 프로젝트 업무를 수행해 주세요. 미확인 정보는 만들지 말고 필요한 맥락을 요청하세요.


    Gemini 3 Pro Image 시네마틱 인물 프롬프트, 21:9 울트라와이드'
  allowed_tools:
  - Read
  - Glob
  - Grep
  - Skill
  max_turns: 12
  timeout_seconds: 180
graders:
- name: skill-fired
  type: tool_used
  tool: Skill
  input_match: '"skill"\s*:\s*"(?:[\w-]+:)?media\-gemini\-3\-image\-prompt"'
- name: quality
  type: llm
  focus: trace
  criteria: "입력 사실·제약과 아래 사례의 기대 결과를 대조한다. 모든 적용 가능한 조건을 만족하면 PASS, 하나라도 위반하면 FAIL이다.\
    \ false 값은 해당 동작·주장이 없어야 한다는 뜻이다. 정보·도구·fixture가 부족하면 모델이 이를 명시했는지 확인하되, 원래 조건을\
    \ 충족하지 못한 실행을 임의로 PASS로 바꾸지 않는다. 단어가 있다는 이유만으로 사실성·산술·법적 판단·의미 보존을 통과시키지 않는다.\
    \ 원격 호출·파일 생성·독립 검수의 주장은 실제 trace와 산출물로 확인한다.\n\n{\n  \"expected_output\": {\n\
    \    \"format\": \"markdown\",\n    \"contains\": [\n      \"21:9\",\n      \"\
    Gemini\",\n      \"aspect_ratio=21:9\",\n      \"1792x768\",\n      \"--ar 21:9\"\
    \n    ],\n    \"not_contains\": [\n      \"metadata:\",\n      \"aspect_ratio=1:1\"\
    ,\n      \"size=1024x1024\"\n    ],\n    \"assertion\": [\n      \"Gemini에는 21:9\
    \ 화면비를 유지\",\n      \"GPT Image 2.5 API에는 유효한 1792x768 예시를, Midjourney에는 --ar\
    \ 21:9를 적용하고 ChatGPT 기본 이미지 도구에서 크기 파라미터를 직접 지정한다고 주장하지 않음\"\n    ]\n  }\n}"
