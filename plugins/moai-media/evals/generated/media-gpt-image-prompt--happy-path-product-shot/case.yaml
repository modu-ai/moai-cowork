schema_version: '1.1'
name: media-gpt-image-prompt--happy-path-product-shot
description: 제품샷 프리셋 한 줄 입력 → 3개 모델 프롬프트 정상 출력
runs: 1
tags:
- generated
- media-gpt-image-prompt
execution:
  prompt: '다음 프로젝트 업무를 수행해 주세요. 미확인 정보는 만들지 말고 필요한 맥락을 요청하세요.


    GPT 이미지 프롬프트 만들어줘. 매트 블랙 머그 ''MONDAY'' 글자 들어간 제품샷, 1:1'
  allowed_tools:
  - Read
  - Glob
  - Grep
  - Skill
  max_turns: 12
  timeout_seconds: 180
graders:
- name: skill-fired
  type: tool_used
  tool: Skill
  input_match: '"skill"\s*:\s*"(?:[\w-]+:)?media\-gpt\-image\-prompt"'
- name: quality
  type: llm
  focus: trace
  criteria: "입력 사실·제약과 아래 사례의 기대 결과를 대조한다. 모든 적용 가능한 조건을 만족하면 PASS, 하나라도 위반하면 FAIL이다.\
    \ false 값은 해당 동작·주장이 없어야 한다는 뜻이다. 정보·도구·fixture가 부족하면 모델이 이를 명시했는지 확인하되, 원래 조건을\
    \ 충족하지 못한 실행을 임의로 PASS로 바꾸지 않는다. 단어가 있다는 이유만으로 사실성·산술·법적 판단·의미 보존을 통과시키지 않는다.\
    \ 원격 호출·파일 생성·독립 검수의 주장은 실제 trace와 산출물로 확인한다.\n\n{\n  \"expected_output\": {\n\
    \    \"format\": \"markdown\",\n    \"contains\": [\n      \"### 1) GPT Image\
    \ 2.5\",\n      \"### 2) Gemini 3 Pro Image\",\n      \"### 3) Midjourney V8.2\"\
    ,\n      \"\\\"MONDAY\\\"\",\n      \"--ar 1:1\",\n      \"gpt-image-2.5-flare\"\
    ,\n      \"quality\",\n      \"aspect_ratio\"\n    ],\n    \"not_contains\": [\n\
    \      \"metadata:\",\n      \"TODO\",\n      \"<placeholder>\"\n    ],\n    \"\
    assertion\": [\n      \"3개 모델 모두 코드블록 출력\",\n      \"GPT 프롬프트가 공식 원칙 준수 (첫 문장에\
    \ 산출물·용도, 텍스트 따옴표+exactly once, 제외 조건)\",\n      \"Gemini 프롬프트가 5-component 마침표\
    \ 구분\",\n      \"MJ 프롬프트가 키워드 콤마 + --파라미터\",\n      \"ChatGPT Images 도구의 내부 모델을\
    \ Flare로 지정하거나 확인했다고 주장하지 않음\"\n    ]\n  }\n}"
