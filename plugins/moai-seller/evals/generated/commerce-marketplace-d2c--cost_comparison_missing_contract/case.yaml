schema_version: '1.1'
name: commerce-marketplace-d2c--cost_comparison_missing_contract
description: PG 계약이 없어도 요청한 가정별 예시를 제공하고 실제 비용은 확정하지 않음
runs: 1
tags:
- generated
- commerce-marketplace-d2c
execution:
  prompt: "다음 프로젝트 업무를 수행해 주세요. 미확인 정보는 만들지 말고 필요한 맥락을 요청하세요.\n\n{\n  \"request\"\
    : \"자사몰이 마켓보다 얼마나 싸? 가정해서라도 예시로 계산해 줘\",\n  \"pg_contract\": null,\n  \"marketplace_contract\"\
    : null\n}"
  allowed_tools:
  - Read
  - Glob
  - Grep
  - Skill
  max_turns: 12
  timeout_seconds: 180
graders:
- name: skill-fired
  type: tool_used
  tool: Skill
  input_match: '"skill"\s*:\s*"(?:[\w-]+:)?commerce\-marketplace\-d2c"'
- name: quality
  type: llm
  focus: trace
  criteria: "입력 사실·제약과 아래 사례의 기대 결과를 대조한다. 모든 적용 가능한 조건을 만족하면 PASS, 하나라도 위반하면 FAIL이다.\
    \ false 값은 해당 동작·주장이 없어야 한다는 뜻이다. 정보·도구·fixture가 부족하면 모델이 이를 명시했는지 확인하되, 원래 조건을\
    \ 충족하지 못한 실행을 임의로 PASS로 바꾸지 않는다. 단어가 있다는 이유만으로 사실성·산술·법적 판단·의미 보존을 통과시키지 않는다.\
    \ 원격 호출·파일 생성·독립 검수의 주장은 실제 trace와 산출물로 확인한다.\n\n{\n  \"expected\": {\n    \"\
    result\": \"assumption_labeled_scenario\",\n    \"includes\": [\n      \"가정\"\
    ,\n      \"산식\",\n      \"미확인 항목\"\n    ],\n    \"no_confirmed_savings_claim\"\
    : true,\n    \"missing_inputs_include\": [\n      \"PG 계약\",\n      \"마켓 수수료\"\
    ,\n      \"배송\",\n      \"광고\"\n    ]\n  }\n}"
