schema_version: '1.1'
name: commerce-detail-page-planner--one_message_only
description: 원 메시지 단독 요청
runs: 1
tags:
- generated
- commerce-detail-page-planner
execution:
  prompt: '다음 프로젝트 업무를 수행해 주세요. 미확인 정보는 만들지 말고 필요한 맥락을 요청하세요.


    수면 안대의 핵심 메시지 한 문장만 잡아줘. 제품 자료는 아직 없어.'
  allowed_tools:
  - Read
  - Glob
  - Grep
  - Skill
  max_turns: 12
  timeout_seconds: 180
graders:
- name: skill-fired
  type: tool_used
  tool: Skill
  input_match: '"skill"\s*:\s*"(?:[\w-]+:)?commerce\-detail\-page\-planner"'
- name: quality
  type: llm
  focus: trace
  criteria: "입력 사실·제약과 아래 사례의 기대 결과를 대조한다. 모든 적용 가능한 조건을 만족하면 PASS, 하나라도 위반하면 FAIL이다.\
    \ false 값은 해당 동작·주장이 없어야 한다는 뜻이다. 정보·도구·fixture가 부족하면 모델이 이를 명시했는지 확인하되, 원래 조건을\
    \ 충족하지 못한 실행을 임의로 PASS로 바꾸지 않는다. 단어가 있다는 이유만으로 사실성·산술·법적 판단·의미 보존을 통과시키지 않는다.\
    \ 원격 호출·파일 생성·독립 검수의 주장은 실제 trace와 산출물로 확인한다.\n\n{\n  \"expected\": [\n    {\n\
    \      \"one_message_only\": true\n    },\n    {\n      \"unverified_benefits_omitted\"\
    : true\n    }\n  ]\n}"
