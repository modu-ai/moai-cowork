[project]
name = "moai-mcp-imweb"
version = "0.1.0"
description = "아임웹(Imweb) OPEN API v3 MCP — 명세에서 생성한 138개 작업을 8개 카테고리 도구로 제공. OAuth2 토큰 갱신 지원."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "modu-ai" }]
keywords = ["mcp", "imweb", "아임웹", "ecommerce", "model-context-protocol"]
dependencies = [
    "mcp>=1.2.0",
    "httpx>=0.27.0",
    "anyio>=4.0.0",
]

[project.scripts]
moai-mcp-imweb = "moai_mcp_imweb.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/moai_mcp_core", "src/moai_mcp_imweb"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "respx>=0.21.0",
]
