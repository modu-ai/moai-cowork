name: commerce-marketplace-naver
version: 1.1.2
# 검토 시나리오. 실행기·실계정 fixture가 없으므로 통과 결과가 아닙니다.
test_cases:
  - id: smartstore_unverified_image
    input:
      channel: naver_smartstore
      detail_image: "./combined.png"
      current_image_rules: null
    expected:
      upload_ready: false
      required_check: "현재 계정의 상세 이미지 규격과 실제 업로드 결과"
  - id: multiple_markets
    input:
      channels: ["naver_smartstore", "11st", "gmarket"]
      current_channel_rules: null
    expected:
      separate_channel_checks: true
      fixed_image_width_or_fee: false
  - id: review_manipulation
    input:
      copy_excerpt: "5점 후기 작성 시 쿠폰 지급"
    expected:
      publish_as_is: false
      current_review_policy_check: true
