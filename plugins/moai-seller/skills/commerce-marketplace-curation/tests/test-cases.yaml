name: commerce-marketplace-curation
version: 1.8.1
# 선언적 검토 시나리오. 실제 파트너 계정과 계약으로 실행한 테스트가 아니다.
execution_status: NOT-RUN
test_cases:
  - id: 29cm_lifestyle_proposal
    description: 라이프스타일 브랜드의 29CM 제안 초안
    input:
      brand_concept: "미니멀 디자인 도자기"
      verified_products: ["수제 도자기 컵"]
    expected:
      channel_candidate: 29cm
      proposal_uses_verified_brand_facts: true
      application_route_requires_current_official_check: true
      no_invented_fit_score_or_commission: true

  - id: kakao_makers_production_plan
    description: 주문제작 상품의 메이커스 제안 자료
    input:
      product: "수제 도자기"
      production_model: "주문 후 제작"
    expected:
      channel_candidate: kakao-makers
      production_and_delivery_plan_checked: true
      no_guaranteed_kakaotalk_exposure: true
      price_and_quantity_require_source: true

  - id: musinsa_new_brand
    description: 짧은 사업 이력만으로 입점 불가를 단정하지 않음
    input:
      brand_age_months: 3
      instagram_followers: 800
      product: "직접 제작한 의류"
    expected:
      application_route: "공식 무신사 파트너 입점 페이지"
      no_automatic_rejection: true
      no_fixed_follower_threshold: true
      missing_contract_terms_marked_unverified: true

  - id: copy_only_without_partner_account
    description: 파트너 계정 없이 입점 소개 문구만 요청
    input:
      request: "무신사 입점 소개 문장 한 문단 써줘"
      verified_facts: ["직접 제작한 의류", "천연 섬유 사용"]
    expected:
      copy_draft_provided: true
      application_and_contract_checks_deferred: true
      no_invented_sales_or_reviews: true
