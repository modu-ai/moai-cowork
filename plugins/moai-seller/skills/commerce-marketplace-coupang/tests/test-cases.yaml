name: commerce-marketplace-coupang
version: 1.1.2
# 검토 시나리오. 실행기·실계정 fixture가 없으므로 통과 결과가 아닙니다.
test_cases:
  - id: unverified_image_upload
    input:
      channel: coupang
      detail_image: "./combined.png"
      current_image_rules: null
    expected:
      upload_ready: false
      fixed_image_limit: false
      required_check: "현재 계정의 상세설명 이미지 제한과 실제 미리보기"
  - id: delivery_type_without_contract
    input:
      delivery_type: rocket_growth
      contract: null
    expected:
      fixed_fee_or_delivery_promise: false
      missing_contract_reported: true
  - id: unsupported_health_claim
    input:
      category: food
      copy_excerpt: "모든 질병을 예방합니다"
    expected:
      publish_as_is: false
      current_rule_and_product_evidence_check: true
