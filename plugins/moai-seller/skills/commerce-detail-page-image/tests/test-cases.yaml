name: commerce-detail-page-image
version: 1.1.5
# 합성 사례는 판매 자료가 아닌 단색 fixture로 크기·순서만 검증합니다.
test_cases:
  - id: all_sections
    input:
      request: "fixtures/sections의 13장을 표준 섹션 높이에 맞춰 순서대로 합성하고 PNG 크기를 검사해 줘. 판매용 업로드는 하지 마."
      sections_dir: fixtures/sections
      fixture_kind: synthetic-layout-only
    eval_context:
      scaffold_script: scaffold.sh
      allowed_tools: [Read, Glob, Grep, Skill, Bash, Write]
    expected:
      sections_count: 13
      combined_size: 1080x12720
      failed_sections: []
  - id: partial_failure
    input:
      missing_sections: [07_proof, 11_compare]
    expected:
      failed_sections: [07_proof, 11_compare]
      completed_status: false
      placeholders_are_draft_only: true
  - id: channel_export
    input:
      channel: naver-smartstore
      current_channel_image_rules: null
    expected:
      original_size: 1080x12720
      upload_ready: false
      missing_inputs_reported: ["현재 채널 이미지 규격"]
      upload_result: "NOT-RUN"
