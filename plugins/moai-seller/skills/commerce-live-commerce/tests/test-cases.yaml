name: commerce-live-commerce
version: 1.1.2
test_cases:
  - id: naver_verified_offer
    description: 실제 상품·혜택 자료가 있는 네이버 방송 대본
    input:
      channel: naver-shoppinglive
      duration_min: 60
      products:
        - name: "상품 A"
          price_krw: 10000
          coupon_krw: 1000
          coupon_target: "상품 A 구매자"
          coupon_end: "2026-10-31"
          stock: null
          shipping: null
      evidence_type: "가상 테스트용 판매자 자료"
    expected:
      includes: ["상품 시연", "질문 응대", "구매·배송 안내"]
      price_krw: 10000
      coupon_krw: 1000
      coupon_target: "상품 A 구매자"
      coupon_end: "2026-10-31"
      must_not_invent: ["재고 수량", "배송 예정일", "상품 B의 가격"]
      unverified_fees_or_kpis: false

  - id: grip_direct_broadcast
    description: 그립 직접 방송과 그리퍼 협업을 현재 조건으로 비교
    input:
      channel: grip
      requested_options: ["판매자 직접 방송", "그리퍼 협업"]
      contract: null
    expected:
      includes: ["두 방식의 운영 조건", "현재 계정과 계약 확인 항목"]
      fixed_commission_rate: false
      influencer_required: false

  - id: missing_live_setup
    description: 실제 송출 준비 요청에 권한과 장비 자료가 없을 때 중단
    input:
      request: "쿠팡라이브 송출 준비 완료 여부를 확인해줘"
      channel: coupang
      live_permission: null
      equipment: null
    expected:
      blocker: "누락된 권한·장비 자료와 확인 경로"
      ready_to_stream: false

  - id: simple_opening_without_setup
    description: 오프닝 문구 요청은 송출 권한·장비 자료 없이 작성
    input:
      request: "상품 A 라이브 오프닝 문구의 뼈대를 써줘"
      product_name: "상품 A"
      live_permission: null
      equipment: null
    expected:
      includes: ["상품 A", "오프닝 문구"]
      must_not_invent: ["구체적인 가격", "구체적인 혜택"]
      blocker: false
      ready_to_stream: false

  - id: no_invented_countdown
    description: 제한된 혜택이 없으면 품절·마감 압박을 만들지 않음
    input:
      channel: kakao-shoppinglive
      offer_time_limit: null
      stock_limit: null
    expected:
      countdown_required: false
      invented_scarcity: false
