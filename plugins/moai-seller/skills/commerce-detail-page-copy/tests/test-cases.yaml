name: commerce-detail-page-copy
version: 1.1.1
# 검토 시나리오. 자동 실행 가능한 테스트나 실제 검수 결과가 아닙니다.
test_cases:
  - id: supported_electronics
    input:
      product_name: X200 무선이어폰
      category: electronics
      verified_specs: [30시간 배터리, ANC, IPX5]
    expected:
      uses_only_verified_specs: true
      fabricated_reviews_or_statistics: false
      fabricated_discount_or_deadline: false
  - id: missing_evidence
    input:
      product_name: 수제 도자기 머그
    expected:
      unsupported_claims_omitted: true
      missing_inputs_reported: true
  - id: medical_claim
    input:
      product_name: 비타민D 영양제
      unverified_claim: 모든 질병 예방
    expected:
      unverified_claim_published: false
      current_rule_check_needed: true
