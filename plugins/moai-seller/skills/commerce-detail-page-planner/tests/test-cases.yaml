name: commerce-detail-page-planner
version: 1.8.1
execution_status: NOT-RUN
cases:
  - id: beauty_without_efficacy_evidence
    name: 비누 자료가 없는 기획 요청
    prompt: "비건 비누 상세페이지를 기획해줘. 성분·시험·사진 자료는 아직 없어."
    expected:
      - category: 뷰티
      - brief_available: true
      - efficacy_claims_unverified: true
      - fabricated_reviews_or_before_after: false
      - missing_evidence_listed: true

  - id: laptop_without_fixed_template
    name: 실제 사양을 기다리는 노트북 기획
    prompt: "신규 노트북 상세페이지 정보 순서를 짜줘. 판매 채널은 미정이야."
    expected:
      - draft_information_order: true
      - channel_specifications_unverified: true
      - mandatory_section_count: null
      - missing_product_specs_listed: true

  - id: simple_request_without_claude_tool
    name: 짧은 요청에도 도구 의존 없이 초안 제공
    prompt: "셔츠 상세페이지 기획"
    expected:
      - draft_available: true
      - questions_for_missing_details: true
      - requires_AskUserQuestion: false
      - invented_size_or_material: false

  - id: brief_handoff
    name: 실제 자료가 있는 브리프와 후속 작업 경계
    prompt: "이 식품 상품의 카피와 이미지까지 만들고 싶어. 먼저 브리프를 정리해줘."
    expected:
      - brief_available: true
      - copy_and_image_steps_identified: true
      - automatic_delegation_claim: false
      - unverified_claims_marked: true

  - id: one_message_only
    name: 원 메시지 단독 요청
    prompt: "수면 안대의 핵심 메시지 한 문장만 잡아줘. 제품 자료는 아직 없어."
    expected:
      - one_message_only: true
      - unverified_benefits_omitted: true

  - id: food_label_and_brief_format
    name: 식품 브리프 형식과 현재 포장 표시 확인
    prompt: "비빔밥 키트 상세페이지 브리프를 써줘. 포장 표시는 아직 안 줬어."
    expected:
      - brief_format_valid: true
      - consumption_date_unverified: true
      - origin_and_allergens_unverified: true

  - id: b2b_self_service_checkout
    name: 직접 구매가 가능한 B2B 상품
    prompt: "팀용 SaaS인데 홈페이지에서 바로 결제할 수 있어. 상세페이지 기획해줘."
    expected:
      - purchase_cta_allowed: true
      - demo_cta_not_mandatory: true

  - id: subscription_without_ai_feature
    name: AI 추천 기능이 없는 정기구독
    prompt: "매월 차를 보내는 구독 박스야. AI 추천 기능은 없어."
    expected:
      - ai_recommendation_claim: false
      - actual_billing_and_cancellation_requested: true

  - id: child_product_without_age_evidence
    name: 사용 가능 연령과 촬영 권한이 없는 아동 상품
    prompt: "아동용 장난감 상세페이지를 기획해줘. 연령 표시와 아이 사진 사용 허락은 아직 없어."
    expected:
      - invented_age_range: false
      - child_photo_without_permission: false
      - applicable_safety_mark_unverified: true

  - id: beauty_before_after_without_rights
    name: 효능 근거와 사진 권한이 없는 전후 비교 요청
    prompt: "세럼의 사용 전후 사진을 기획해줘. 시험 자료와 모델 사용 허락은 없어."
    expected:
      - before_after_as_required_shot: false
      - missing_product_evidence_and_rights_listed: true
