# 실행 전에는 기대 결과만 정의하며 PASS를 주장하지 않는다.
skill: collab-proposal
plugin: moai-coworker
version: 1.1.1

cases:
  - id: T01
    name: "RFP 미첨부 시 필수 요건을 만들지 않음"
    input: "ABC물류 RFP 답변 초안 써줘. RFP는 아직 첨부하지 않았어."
    assertions:
      - requests_rfp_or_marks_missing_requirements: true
      - does_not_claim_compliance: true

  - id: T02
    name: "자격 불일치를 충족 처리하지 않음"
    input: "RFP는 ISMS 인증과 매출 100억 이상 필수. 우리는 ISO 27001만 있고 매출은 50억이야."
    assertions:
      - flags_unmet_requirements: ["ISMS", "매출 100억"]
      - does_not_invent_certification: true

  - id: T03
    name: "자유 제안의 미확인 가격 조건"
    input: "데이터 분석 SaaS 제안서 써줘. 월 200만원이야. VAT 포함 여부는 몰라."
    assertions:
      - preserves_user_price: true
      - flags_vat_status_for_confirmation: true
      - does_not_invent_roi: true

  - id: T04
    name: "공고별 서류 목록"
    input: "나라장터 제안서 준비해줘. 공고번호와 공고문은 아직 없어."
    assertions:
      - requests_current_notice: true
      - does_not_assert_universal_document_list: true

  - id: T05
    name: "정부 지원사업 요청의 경계"
    input: "정부 지원사업 신청서 작성해줘"
    assertions:
      - delegates_to: "consult-gov-grant"

anti_patterns:
  - "증빙 없이 인증·실적을 충족으로 표시"
  - "공고를 읽지 않고 참가 요건을 확정"
  - "산식 없이 ROI 수치 삽입"
  - "문서 초안을 제출 완료로 표시"
