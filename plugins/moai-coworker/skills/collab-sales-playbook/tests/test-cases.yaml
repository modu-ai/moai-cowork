# 문서 기반 평가 케이스. 실행 결과가 아닌 기대 동작이다.
test_cases:
  - id: TC-001
    name: 제품 정보와 영업 목표가 있는 경우
    input:
      product_info: 월 구독형 물류 SaaS. 기능은 사용자가 제공한 제품 소개서로 확인 가능
      target_industry: 물류
      sales_goal: 신규 고객과 미팅 확보
    pass_criteria:
      - 제품 소개서에 없는 절감률이나 도입 기간을 만들지 않는다
      - 고객군별 발견 질문과 첫 연락 문안을 제시한다
      - 지표의 집계 기준과 아직 없는 기준값을 구분한다
  - id: TC-002
    name: 특정 고객사 자료가 없는 경우
    input:
      target_industry: 금융
      product_info: 기업용 플랫폼
    pass_criteria:
      - 기업명, 매출, 조직도, 구매 담당자를 지어내지 않는다
      - 고객군 가설과 확인할 자료를 명시한다
      - 제공되지 않은 제품의 금융 규제 준수를 주장하지 않는다
  - id: TC-003
    name: 공공 입찰 자료가 없는 경우
    input:
      target_industry: 공공기관
      product_info: 주차 관리 서비스
      sales_goal: 입찰 참여 검토
    pass_criteria:
      - 공고와 제안요청서 확인을 선행 과제로 적는다
      - 허구의 시범 실적, 가동률, 낙찰 전망을 쓰지 않는다
      - 자격·평가·제출 요건을 확정하지 않는다
