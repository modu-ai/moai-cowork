# weekly-report test cases
skill: collab-pm-report
plugin: moai-coworker
version: 1.1.2

rubric:
  correctness: 0.30
  completeness: 0.25
  clarity: 0.25
  efficiency: 0.20
pass_threshold: 0.70

cases:
  - id: T01
    name: "제공된 자료를 6섹션으로 정리"
    input: "이번 주 결제 v2 머지, 로그인 버그 잡았어, 알림 70% 진행중. KPI MAU 12k(+3.8%)."
    assertions:
      - has_section: "이번 주 핵심"
      - has_section: "완료"
      - has_section: "진행 중"
      - has_section: "차주 계획"
      - has_section: "이슈·리스크"
      - has_section: "의사결정 요청"

  - id: T02
    name: "자료가 없을 때 임원 보고 수치를 만들지 않음"
    input: "주간 보고를 임원용으로도 만들어줘"
    assertions:
      - requests_missing_source: true
      - does_not_invent_metrics: true

  - id: T03
    name: "팀 대상에 맞는 문체"
    input: "팀 슬랙용으로 정리해줘"
    assertions:
      - readable_team_tone: true

  - id: T04
    name: "사용자가 준 일정 보존"
    input: "다음 주 화요일까지 결제 모듈 보안 감사 대응"
    assertions:
      - preserves_user_deadline: true
      - does_not_invent_priority: true

  - id: T05
    name: "수치 출처의 신뢰 범위 표시"
    input: "MAU 12,450, 가입 320 (Notion DB 인용)"
    assertions:
      - attributes_number_to_user_input: true
      - does_not_claim_notion_was_queried: true

  - id: T06
    name: "자유 텍스트 입력"
    input: "이번 주 한 일 정리해줘 (자유 텍스트만 있음)"
    assertions:
      - parses_free_text: true
      - no_mcp_fetch_required: true

chain_tests:
  - id: C01
    name: "실제 스탠드업 메모 → collab-pm-report → collab-exec-summary"
    expected: "제공된 메모를 주간보고로 정리하고 요청 시 경영진 요약"

anti_patterns:
  - "사용자가 제시한 일정을 임의 우선순위로 바꿈"
  - "Mixed formal/casual tone"
  - "Personal blame in body"
  - "자료에 없는 수치·성과를 만들어 냄"
  - "조회하지 않은 연결 자료를 조회했다고 주장함"
