# collab-exec-summary test cases
skill: collab-exec-summary
plugin: moai-coworker
version: 1.1.2

rubric:
  correctness: 0.30
  completeness: 0.25
  clarity: 0.25
  efficiency: 0.20
pass_threshold: 0.70

cases:
  - id: T01
    name: "입력 자료가 없을 때 요약 사실을 만들지 않음"
    input: "분기 변동분석 보고서 30페이지를 임원 1pager로. 보고서는 아직 첨부하지 않았어."
    assertions:
      - requests_missing_source: true
      - does_not_invent_financial_metrics: true

  - id: T02
    name: "제공된 사실만 사용"
    input: "보고서 요약: 2026년 2분기 매출 124억원, 전기 120억원. 원인은 아직 조사 중."
    assertions:
      - preserves_period_and_units: true
      - labels_unverified_cause: true

  - id: T03
    name: "선택지가 없으면 권고 보류"
    input: "보안 감사 대응 옵션을 정리해줘. 예산과 감사 범위는 아직 몰라."
    assertions:
      - states_missing_decision_inputs: true
      - does_not_invent_budget_or_deadline: true

  - id: T04
    name: "재무 입력 부재 시 기준을 꾸미지 않음"
    input: "재무 1pager 만들어줘"
    assertions:
      - requests_financial_source: true
      - does_not_assume_k_ifrs_application: true

  - id: T05
    name: "정량 수치의 출처 범위 구분"
    input: "분기 매출 124억"
    assertions:
      - attributes_number_to_user_input: true
      - does_not_invent_comparison_period: true

  - id: T06
    name: "사용자가 제시한 일정은 보존"
    input: "1개월 내 보안 감사 완료가 목표야. 현실성은 아직 검토하지 않았어."
    assertions:
      - preserves_user_target_as_target: true
      - does_not_claim_feasibility: true

  - id: T07
    name: "격식체 톤 ('~로 판단됩니다', '~를 권고드립니다')"
    input: "임원 보고서"
    assertions:
      - formal_tone_consistent: true
      - no_casual_endings: true

chain_tests:
  - id: C01
    name: "finance-variance-analysis → collab-exec-summary → doc-pptx"
    expected: "실제 재무 분석이 있을 때 요약하고 요청 시 슬라이드 제작"
  - id: C02
    name: "collab-pm-report → collab-exec-summary"
    expected: "실제 프로젝트 보고가 있을 때 경영진 요약"

anti_patterns:
  - "자료 없이 수치와 원인을 만들어 냄"
  - "조건 없는 권고를 확정함"
  - "파일·공유를 실행하지 않고 완료했다고 말함"
  - "Casual tone in executive output"
