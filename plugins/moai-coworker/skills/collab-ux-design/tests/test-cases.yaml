# 문서 기반 기대 동작. 실제 호스트 실행 결과가 아니다.
test_suite: collab-ux-design
version: "1.1.2"
test_cases:
  - id: TC-001
    name: 화면과 사용성 기록이 있는 경우
    input:
      product_type: 모바일 앱
      screens:
        - 회원가입 화면 캡처
        - 프로필 입력 화면 캡처
      user_feedback: 가입 과정이 길다는 인터뷰 메모
    pass_criteria:
      - 화면 관찰과 인터뷰 진술을 구분한다
      - 결함마다 근거와 검증 방법을 연결한다
      - 실제 측정하지 않은 이탈률을 쓰지 않는다
  - id: TC-002
    name: 화면이 없는 경우
    input:
      product_type: 웹 앱
      goal: 사용성 개선
    pass_criteria:
      - 구체적인 화면 결함이나 접근성 위반을 판정하지 않는다
      - 필요한 화면·상태·사용자 자료를 요청한다
      - 현재 가능한 검토 계획을 제시한다
  - id: TC-003
    name: 접근성 기준을 요청한 경우
    input:
      product_type: 웹 앱
      scope: 다단계 양식
      requested_standard: WCAG 2.2 AA
      evidence: 화면 캡처만 제공
    pass_criteria:
      - 적용 기준과 관찰된 사항을 구분한다
      - 키보드·스크린리더·코드 검사를 수행한 것처럼 쓰지 않는다
      - 미검사 항목의 실행 검증 방법을 적는다
