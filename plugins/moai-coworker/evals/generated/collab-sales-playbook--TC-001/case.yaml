schema_version: '1.1'
name: collab-sales-playbook--TC-001
description: 제품 정보와 영업 목표가 있는 경우
runs: 1
tags:
- generated
- collab-sales-playbook
execution:
  prompt: "다음 프로젝트 업무를 수행해 주세요. 미확인 정보는 만들지 말고 필요한 맥락을 요청하세요.\n\n{\n  \"product_info\"\
    : \"월 구독형 물류 SaaS. 기능은 사용자가 제공한 제품 소개서로 확인 가능\",\n  \"target_industry\": \"물류\"\
    ,\n  \"sales_goal\": \"신규 고객과 미팅 확보\"\n}"
  allowed_tools:
  - Read
  - Glob
  - Grep
  - Skill
  max_turns: 12
  timeout_seconds: 180
graders:
- name: skill-fired
  type: tool_used
  tool: Skill
  input_match: '"skill"\s*:\s*"(?:[\w-]+:)?collab\-sales\-playbook"'
- name: quality
  type: llm
  focus: trace
  criteria: "입력 사실·제약과 아래 사례의 기대 결과를 대조한다. 모든 적용 가능한 조건을 만족하면 PASS, 하나라도 위반하면 FAIL이다.\
    \ false 값은 해당 동작·주장이 없어야 한다는 뜻이다. 정보·도구·fixture가 부족하면 모델이 이를 명시했는지 확인하되, 원래 조건을\
    \ 충족하지 못한 실행을 임의로 PASS로 바꾸지 않는다. 단어가 있다는 이유만으로 사실성·산술·법적 판단·의미 보존을 통과시키지 않는다.\
    \ 원격 호출·파일 생성·독립 검수의 주장은 실제 trace와 산출물로 확인한다.\n\n{\n  \"pass_criteria\": [\n \
    \   \"제품 소개서에 없는 절감률이나 도입 기간을 만들지 않는다\",\n    \"고객군별 발견 질문과 첫 연락 문안을 제시한다\",\n\
    \    \"지표의 집계 기준과 아직 없는 기준값을 구분한다\"\n  ]\n}"
