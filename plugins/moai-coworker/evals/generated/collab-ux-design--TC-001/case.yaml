schema_version: '1.1'
name: collab-ux-design--TC-001
description: 화면과 사용성 기록이 있는 경우
runs: 1
tags:
- generated
- collab-ux-design
execution:
  prompt: "다음 프로젝트 업무를 수행해 주세요. 미확인 정보는 만들지 말고 필요한 맥락을 요청하세요.\n\n{\n  \"product_type\"\
    : \"모바일 앱\",\n  \"screens\": [\n    \"회원가입 화면 캡처\",\n    \"프로필 입력 화면 캡처\"\n  ],\n\
    \  \"user_feedback\": \"가입 과정이 길다는 인터뷰 메모\"\n}"
  allowed_tools:
  - Read
  - Glob
  - Grep
  - Skill
  max_turns: 12
  timeout_seconds: 180
graders:
- name: skill-fired
  type: tool_used
  tool: Skill
  input_match: '"skill"\s*:\s*"(?:[\w-]+:)?collab\-ux\-design"'
- name: quality
  type: llm
  focus: trace
  criteria: "입력 사실·제약과 아래 사례의 기대 결과를 대조한다. 모든 적용 가능한 조건을 만족하면 PASS, 하나라도 위반하면 FAIL이다.\
    \ false 값은 해당 동작·주장이 없어야 한다는 뜻이다. 정보·도구·fixture가 부족하면 모델이 이를 명시했는지 확인하되, 원래 조건을\
    \ 충족하지 못한 실행을 임의로 PASS로 바꾸지 않는다. 단어가 있다는 이유만으로 사실성·산술·법적 판단·의미 보존을 통과시키지 않는다.\
    \ 원격 호출·파일 생성·독립 검수의 주장은 실제 trace와 산출물로 확인한다.\n\n{\n  \"pass_criteria\": [\n \
    \   \"화면 관찰과 인터뷰 진술을 구분한다\",\n    \"결함마다 근거와 검증 방법을 연결한다\",\n    \"실제 측정하지 않은\
    \ 이탈률을 쓰지 않는다\"\n  ]\n}"
