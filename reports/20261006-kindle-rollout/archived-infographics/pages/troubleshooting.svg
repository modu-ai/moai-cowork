<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 903" width="800" height="903" role="img" aria-labelledby="title desc"><title id="title">멈춘 단계를 찾고 그 부분부터 확인</title><desc id="desc">준비·노출: 앱 환경과 설치·활성화·현재 스킬 목록을 확인합니다. / 자료·연결: 파일 읽기와 실제 계정·인증·조회 결과를 확인합니다. / 작성·인계: 앞 결과와 필요한 입력, 미정 조건을 확인합니다. / 검토·반복: 원문 차이와 예약 등록·첫 실행 결과를 확인합니다.</desc><rect width="800" height="903" fill="#ffffff"/><g font-family="Apple SD Gothic Neo, Malgun Gothic, Noto Sans KR, sans-serif"><text x="48" y="43" font-size="18" fill="#516e60" font-weight="600">MoAI-Cowork · 한국어 개념 설명</text><text x="48" y="102" font-size="38" fill="#173d2b" font-weight="800">멈춘 단계를 찾고 그 부분부터 확인</text><text x="48" y="153" font-size="23" fill="#536f61" font-weight="500">비슷해 보여도 서로 다른 네 가지</text><rect x="48" y="183" width="336" height="230" rx="20" fill="#edf5f0" stroke="#d6e2d9"/><rect x="68" y="203" width="42" height="36" rx="10" fill="#285942" stroke="none"/><text x="76" y="228" font-size="22" fill="white" font-weight="700">01</text><text x="70" y="277" font-size="28" fill="#285942" font-weight="700">준비·노출</text><text x="70" y="328" font-size="26" fill="#253d33" font-weight="400">앱 환경과</text><text x="70" y="365" font-size="26" fill="#253d33" font-weight="400">설치·활성화·현재 스킬</text><text x="70" y="402" font-size="26" fill="#253d33" font-weight="400">목록을 확인합니다.</text><rect x="416" y="183" width="336" height="230" rx="20" fill="#ecf3fc" stroke="#d6e2d9"/><rect x="436" y="203" width="42" height="36" rx="10" fill="#245a86" stroke="none"/><text x="444" y="228" font-size="22" fill="white" font-weight="700">02</text><text x="438" y="277" font-size="28" fill="#245a86" font-weight="700">자료·연결</text><text x="438" y="328" font-size="26" fill="#253d33" font-weight="400">파일 읽기와 실제</text><text x="438" y="365" font-size="26" fill="#253d33" font-weight="400">계정·인증·조회 결과를</text><text x="438" y="402" font-size="26" fill="#253d33" font-weight="400">확인합니다.</text><rect x="48" y="433" width="336" height="230" rx="20" fill="#fff5e7" stroke="#d6e2d9"/><rect x="68" y="453" width="42" height="36" rx="10" fill="#8a540a" stroke="none"/><text x="76" y="478" font-size="22" fill="white" font-weight="700">03</text><text x="70" y="527" font-size="28" fill="#8a540a" font-weight="700">작성·인계</text><text x="70" y="578" font-size="26" fill="#253d33" font-weight="400">앞 결과와 필요한 입력,</text><text x="70" y="615" font-size="26" fill="#253d33" font-weight="400">미정 조건을</text><text x="70" y="652" font-size="26" fill="#253d33" font-weight="400">확인합니다.</text><rect x="416" y="433" width="336" height="230" rx="20" fill="#f3effa" stroke="#d6e2d9"/><rect x="436" y="453" width="42" height="36" rx="10" fill="#654395" stroke="none"/><text x="444" y="478" font-size="22" fill="white" font-weight="700">04</text><text x="438" y="527" font-size="28" fill="#654395" font-weight="700">검토·반복</text><text x="438" y="578" font-size="26" fill="#253d33" font-weight="400">원문 차이와 예약</text><text x="438" y="615" font-size="26" fill="#253d33" font-weight="400">등록·첫 실행 결과를</text><text x="438" y="652" font-size="26" fill="#253d33" font-weight="400">확인합니다.</text><rect x="48" y="683" width="704" height="150" rx="16" fill="#fff8ec" stroke="#ead7b7"/><text x="70" y="721" font-size="23" fill="#80520e" font-weight="700">기억할 기준</text><text x="70" y="763" font-size="25" fill="#67491c" font-weight="400">관측한 오류를 기록합니다. 실행하지 못한 단계는</text><text x="70" y="799" font-size="25" fill="#67491c" font-weight="400">완료로 표시하지 않습니다.</text><text x="48" y="871" font-size="19" fill="#536f61" font-weight="400">본문을 요약한 개념도 · 실제 앱 화면이나 실행 결과가 아닙니다.</text></g></svg>
