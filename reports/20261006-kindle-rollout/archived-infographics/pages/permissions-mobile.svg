<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1475" width="800" height="1475" role="img" aria-labelledby="title desc"><title id="title">원본에서 결과까지 접근을 확인</title><desc id="desc">원본 자료 지정: 업로드한 파일이나 허용한 폴더, 읽을 파일 이름을 정합니다. / 읽은 내용 확인: 행 수·제목·기간을 원본과 비교하고 못 읽은 자료는 남깁니다. / 결과 별도 저장: 원본을 보존하고 결과의 이름과 저장 위치를 지정합니다. / 파일 열고 상태 확인: 실제 파일 열기와 외부 게시·발송 상태를 각각 확인합니다.</desc><rect width="800" height="1475" fill="#ffffff"/><g font-family="Apple SD Gothic Neo, Malgun Gothic, Noto Sans KR, sans-serif"><text x="48" y="43" font-size="18" fill="#516e60" font-weight="600">MoAI-Cowork · 한국어 개념 설명</text><text x="48" y="102" font-size="38" fill="#173d2b" font-weight="800">원본에서 결과까지 접근을 확인</text><text x="48" y="153" font-size="23" fill="#536f61" font-weight="500">업무 순서  ① → ② → ③ → ④</text><rect x="48" y="183" width="704" height="244" rx="20" fill="#edf5f0" stroke="#d6e2d9"/><rect x="68" y="203" width="42" height="36" rx="10" fill="#285942" stroke="none"/><text x="76" y="228" font-size="22" fill="white" font-weight="700">01</text><text x="70" y="277" font-size="36" fill="#285942" font-weight="700">원본 자료 지정</text><text x="70" y="337" font-size="36" fill="#253d33" font-weight="400">업로드한 파일이나 허용한 폴더,</text><text x="70" y="385" font-size="36" fill="#253d33" font-weight="400">읽을 파일 이름을 정합니다.</text><rect x="48" y="447" width="704" height="244" rx="20" fill="#ecf3fc" stroke="#d6e2d9"/><rect x="68" y="467" width="42" height="36" rx="10" fill="#245a86" stroke="none"/><text x="76" y="492" font-size="22" fill="white" font-weight="700">02</text><text x="70" y="541" font-size="36" fill="#245a86" font-weight="700">읽은 내용 확인</text><text x="70" y="601" font-size="36" fill="#253d33" font-weight="400">행 수·제목·기간을 원본과 비교하고</text><text x="70" y="649" font-size="36" fill="#253d33" font-weight="400">못 읽은 자료는 남깁니다.</text><rect x="48" y="711" width="704" height="244" rx="20" fill="#fff5e7" stroke="#d6e2d9"/><rect x="68" y="731" width="42" height="36" rx="10" fill="#8a540a" stroke="none"/><text x="76" y="756" font-size="22" fill="white" font-weight="700">03</text><text x="70" y="805" font-size="36" fill="#8a540a" font-weight="700">결과 별도 저장</text><text x="70" y="865" font-size="36" fill="#253d33" font-weight="400">원본을 보존하고 결과의 이름과 저장</text><text x="70" y="913" font-size="36" fill="#253d33" font-weight="400">위치를 지정합니다.</text><rect x="48" y="975" width="704" height="244" rx="20" fill="#f3effa" stroke="#d6e2d9"/><rect x="68" y="995" width="42" height="36" rx="10" fill="#654395" stroke="none"/><text x="76" y="1020" font-size="22" fill="white" font-weight="700">04</text><text x="70" y="1069" font-size="36" fill="#654395" font-weight="700">파일 열고 상태 확인</text><text x="70" y="1129" font-size="36" fill="#253d33" font-weight="400">실제 파일 열기와 외부 게시·발송</text><text x="70" y="1177" font-size="36" fill="#253d33" font-weight="400">상태를 각각 확인합니다.</text><rect x="48" y="1239" width="704" height="166" rx="16" fill="#fff8ec" stroke="#ead7b7"/><text x="70" y="1277" font-size="23" fill="#80520e" font-weight="700">기억할 기준</text><text x="70" y="1319" font-size="32" fill="#67491c" font-weight="400">폴더가 보임, 파일을 읽음, 결과를</text><text x="70" y="1363" font-size="32" fill="#67491c" font-weight="400">저장함은 같은 뜻이 아닙니다.</text><text x="48" y="1443" font-size="19" fill="#536f61" font-weight="400">본문을 요약한 개념도 · 실제 앱 화면이나 실행 결과가 아닙니다.</text></g></svg>
