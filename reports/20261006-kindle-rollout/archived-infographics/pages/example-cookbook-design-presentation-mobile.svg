<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 2105" width="800" height="2105" role="img" aria-labelledby="title desc"><title id="title">프레젠테이션 디자인 원칙 한눈에 보기</title><desc id="desc">준비할 자료: 발표 내용·청중·양식 / 작업의 핵심: 슬라이드마다 주장 하나와 근거를 배치하고 흐름을 확인합니다. / 검토 기준: 한 장의 메시지·글자 가독성·차트 단위를 확인합니다. / 만들 결과: 발표 구성과 시안</desc><rect width="800" height="2105" fill="#ffffff"/><g font-family="Apple SD Gothic Neo, Malgun Gothic, Noto Sans KR, sans-serif"><text x="48" y="43" font-size="18" fill="#516e60" font-weight="600">MoAI-Cowork · 한국어 개념 설명</text><text x="48" y="102" font-size="38" fill="#173d2b" font-weight="800">프레젠테이션 디자인 원칙 한눈에</text><text x="48" y="152" font-size="38" fill="#173d2b" font-weight="800">보기</text><text x="48" y="203" font-size="23" fill="#536f61" font-weight="500">업무 순서  ① → ② → ③ → ④</text><rect x="48" y="233" width="704" height="196" rx="20" fill="#edf5f0" stroke="#d6e2d9"/><rect x="68" y="253" width="42" height="36" rx="10" fill="#285942" stroke="none"/><text x="76" y="278" font-size="22" fill="white" font-weight="700">01</text><text x="70" y="327" font-size="36" fill="#285942" font-weight="700">준비할 자료</text><text x="70" y="387" font-size="36" fill="#253d33" font-weight="400">발표 내용·청중·양식</text><rect x="48" y="449" width="704" height="244" rx="20" fill="#ecf3fc" stroke="#d6e2d9"/><rect x="68" y="469" width="42" height="36" rx="10" fill="#245a86" stroke="none"/><text x="76" y="494" font-size="22" fill="white" font-weight="700">02</text><text x="70" y="543" font-size="36" fill="#245a86" font-weight="700">작업의 핵심</text><text x="70" y="603" font-size="36" fill="#253d33" font-weight="400">슬라이드마다 주장 하나와 근거를</text><text x="70" y="651" font-size="36" fill="#253d33" font-weight="400">배치하고 흐름을 확인합니다.</text><rect x="48" y="713" width="704" height="244" rx="20" fill="#fff5e7" stroke="#d6e2d9"/><rect x="68" y="733" width="42" height="36" rx="10" fill="#8a540a" stroke="none"/><text x="76" y="758" font-size="22" fill="white" font-weight="700">03</text><text x="70" y="807" font-size="36" fill="#8a540a" font-weight="700">검토 기준</text><text x="70" y="867" font-size="36" fill="#253d33" font-weight="400">한 장의 메시지·글자 가독성·차트</text><text x="70" y="915" font-size="36" fill="#253d33" font-weight="400">단위를 확인합니다.</text><rect x="48" y="977" width="704" height="196" rx="20" fill="#f3effa" stroke="#d6e2d9"/><rect x="68" y="997" width="42" height="36" rx="10" fill="#654395" stroke="none"/><text x="76" y="1022" font-size="22" fill="white" font-weight="700">04</text><text x="70" y="1071" font-size="36" fill="#654395" font-weight="700">만들 결과</text><text x="70" y="1131" font-size="36" fill="#253d33" font-weight="400">발표 구성과 시안</text><text x="48" y="1224" font-size="29" fill="#173d2b" font-weight="700">가상 예제로 읽어 보기</text><rect x="48" y="1245" width="704" height="272" rx="16" fill="#f8faf8" stroke="#d6e2d9"/><text x="70" y="1287" font-size="23" fill="#285942" font-weight="700">제공 자료</text><text x="70" y="1331" font-size="36" fill="#253d33" font-weight="400">가상 발표: 문의 6건을 배송 3·반품</text><text x="70" y="1379" font-size="36" fill="#253d33" font-weight="400">2·결제 1로 정리한 개선 제안.</text><text x="70" y="1427" font-size="36" fill="#253d33" font-weight="400">청중은 고객지원 팀장. 브랜드 색과</text><text x="70" y="1475" font-size="36" fill="#253d33" font-weight="400">화면 크기는 미정.</text><rect x="48" y="1533" width="704" height="320" rx="16" fill="#f8faf8" stroke="#d6e2d9"/><text x="70" y="1575" font-size="23" fill="#285942" font-weight="700">예상 결과</text><text x="70" y="1619" font-size="36" fill="#253d33" font-weight="400">문제, 분류 근거, FAQ 초안, 확인</text><text x="70" y="1667" font-size="36" fill="#253d33" font-weight="400">필요 사항, 다음 행동 순서로</text><text x="70" y="1715" font-size="36" fill="#253d33" font-weight="400">구성합니다. 차트에 문의 수와</text><text x="70" y="1763" font-size="36" fill="#253d33" font-weight="400">단위를 쓰며 글자는 발표 화면에서</text><text x="70" y="1811" font-size="36" fill="#253d33" font-weight="400">확인합니다.</text><rect x="48" y="1869" width="704" height="166" rx="16" fill="#fff8ec" stroke="#ead7b7"/><text x="70" y="1907" font-size="23" fill="#80520e" font-weight="700">주의할 혼동</text><text x="70" y="1949" font-size="32" fill="#67491c" font-weight="400">한 장에 모든 문장을 넣거나 문의 건수를</text><text x="70" y="1993" font-size="32" fill="#67491c" font-weight="400">비율인 것처럼 표시합니다.</text><text x="48" y="2073" font-size="19" fill="#536f61" font-weight="400">본문을 요약한 개념도 · 실제 앱 화면이나 실행 결과가 아닙니다.</text></g></svg>
