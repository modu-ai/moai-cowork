<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 940" width="800" height="940" role="img" aria-labelledby="title desc"><title id="title">완료 보고보다 결과물을 확인하세요</title><desc id="desc">사실과 출처: 원문을 나란히 보고 출처가 주장을 뒷받침하는지 확인합니다. / 숫자와 상태: 기간·단위·합계와 초안·완료·미정 상태를 비교합니다. / 파일과 서식: 다운로드한 파일을 열어 글꼴·표·페이지·수식을 확인합니다. / 실제 실행: 조회·저장·게시·발송은 각각의 실제 결과를 확인합니다.</desc><rect width="800" height="940" fill="#ffffff"/><g font-family="Apple SD Gothic Neo, Malgun Gothic, Noto Sans KR, sans-serif"><text x="48" y="43" font-size="18" fill="#516e60" font-weight="600">MoAI-Cowork · 한국어 개념 설명</text><text x="48" y="102" font-size="38" fill="#173d2b" font-weight="800">완료 보고보다 결과물을 확인하세요</text><text x="48" y="153" font-size="23" fill="#536f61" font-weight="500">비슷해 보여도 서로 다른 네 가지</text><rect x="48" y="183" width="336" height="267" rx="20" fill="#edf5f0" stroke="#d6e2d9"/><rect x="68" y="203" width="42" height="36" rx="10" fill="#285942" stroke="none"/><text x="76" y="228" font-size="22" fill="white" font-weight="700">01</text><text x="70" y="277" font-size="28" fill="#285942" font-weight="700">사실과 출처</text><text x="70" y="328" font-size="26" fill="#253d33" font-weight="400">원문을 나란히 보고</text><text x="70" y="365" font-size="26" fill="#253d33" font-weight="400">출처가 주장을</text><text x="70" y="402" font-size="26" fill="#253d33" font-weight="400">뒷받침하는지</text><text x="70" y="439" font-size="26" fill="#253d33" font-weight="400">확인합니다.</text><rect x="416" y="183" width="336" height="267" rx="20" fill="#ecf3fc" stroke="#d6e2d9"/><rect x="436" y="203" width="42" height="36" rx="10" fill="#245a86" stroke="none"/><text x="444" y="228" font-size="22" fill="white" font-weight="700">02</text><text x="438" y="277" font-size="28" fill="#245a86" font-weight="700">숫자와 상태</text><text x="438" y="328" font-size="26" fill="#253d33" font-weight="400">기간·단위·합계와</text><text x="438" y="365" font-size="26" fill="#253d33" font-weight="400">초안·완료·미정 상태를</text><text x="438" y="402" font-size="26" fill="#253d33" font-weight="400">비교합니다.</text><rect x="48" y="470" width="336" height="230" rx="20" fill="#fff5e7" stroke="#d6e2d9"/><rect x="68" y="490" width="42" height="36" rx="10" fill="#8a540a" stroke="none"/><text x="76" y="515" font-size="22" fill="white" font-weight="700">03</text><text x="70" y="564" font-size="28" fill="#8a540a" font-weight="700">파일과 서식</text><text x="70" y="615" font-size="26" fill="#253d33" font-weight="400">다운로드한 파일을 열어</text><text x="70" y="652" font-size="26" fill="#253d33" font-weight="400">글꼴·표·페이지·수식을</text><text x="70" y="689" font-size="26" fill="#253d33" font-weight="400">확인합니다.</text><rect x="416" y="470" width="336" height="230" rx="20" fill="#f3effa" stroke="#d6e2d9"/><rect x="436" y="490" width="42" height="36" rx="10" fill="#654395" stroke="none"/><text x="444" y="515" font-size="22" fill="white" font-weight="700">04</text><text x="438" y="564" font-size="28" fill="#654395" font-weight="700">실제 실행</text><text x="438" y="615" font-size="26" fill="#253d33" font-weight="400">조회·저장·게시·발송은</text><text x="438" y="652" font-size="26" fill="#253d33" font-weight="400">각각의 실제 결과를</text><text x="438" y="689" font-size="26" fill="#253d33" font-weight="400">확인합니다.</text><rect x="48" y="720" width="704" height="150" rx="16" fill="#fff8ec" stroke="#ead7b7"/><text x="70" y="758" font-size="23" fill="#80520e" font-weight="700">기억할 기준</text><text x="70" y="800" font-size="25" fill="#67491c" font-weight="400">수정할 위치와 근거를 지정합니다. 자기 점검과</text><text x="70" y="836" font-size="25" fill="#67491c" font-weight="400">별도 검토자 실행도 구분하세요.</text><text x="48" y="908" font-size="19" fill="#536f61" font-weight="400">본문을 요약한 개념도 · 실제 앱 화면이나 실행 결과가 아닙니다.</text></g></svg>
