<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 2105" width="800" height="2105" role="img" aria-labelledby="title desc"><title id="title">한 달치 SNS 콘텐츠 캘린더 만들기 한눈에 보기</title><desc id="desc">준비할 자료: 브랜드·대상·채널·게시 주제 / 작업의 핵심: 주제 묶음과 채널을 정하고 달력과 초안을 작성합니다. / 검토 기준: 중복 주제·브랜드 기준·소재 권리·게시 상태를 확인합니다. / 만들 결과: SNS 콘텐츠 달력과 초안</desc><rect width="800" height="2105" fill="#ffffff"/><g font-family="Apple SD Gothic Neo, Malgun Gothic, Noto Sans KR, sans-serif"><text x="48" y="43" font-size="18" fill="#516e60" font-weight="600">MoAI-Cowork · 한국어 개념 설명</text><text x="48" y="102" font-size="38" fill="#173d2b" font-weight="800">한 달치 SNS 콘텐츠 캘린더 만들기</text><text x="48" y="152" font-size="38" fill="#173d2b" font-weight="800">한눈에 보기</text><text x="48" y="203" font-size="23" fill="#536f61" font-weight="500">업무 순서  ① → ② → ③ → ④</text><rect x="48" y="233" width="704" height="196" rx="20" fill="#edf5f0" stroke="#d6e2d9"/><rect x="68" y="253" width="42" height="36" rx="10" fill="#285942" stroke="none"/><text x="76" y="278" font-size="22" fill="white" font-weight="700">01</text><text x="70" y="327" font-size="36" fill="#285942" font-weight="700">준비할 자료</text><text x="70" y="387" font-size="36" fill="#253d33" font-weight="400">브랜드·대상·채널·게시 주제</text><rect x="48" y="449" width="704" height="244" rx="20" fill="#ecf3fc" stroke="#d6e2d9"/><rect x="68" y="469" width="42" height="36" rx="10" fill="#245a86" stroke="none"/><text x="76" y="494" font-size="22" fill="white" font-weight="700">02</text><text x="70" y="543" font-size="36" fill="#245a86" font-weight="700">작업의 핵심</text><text x="70" y="603" font-size="36" fill="#253d33" font-weight="400">주제 묶음과 채널을 정하고 달력과</text><text x="70" y="651" font-size="36" fill="#253d33" font-weight="400">초안을 작성합니다.</text><rect x="48" y="713" width="704" height="244" rx="20" fill="#fff5e7" stroke="#d6e2d9"/><rect x="68" y="733" width="42" height="36" rx="10" fill="#8a540a" stroke="none"/><text x="76" y="758" font-size="22" fill="white" font-weight="700">03</text><text x="70" y="807" font-size="36" fill="#8a540a" font-weight="700">검토 기준</text><text x="70" y="867" font-size="36" fill="#253d33" font-weight="400">중복 주제·브랜드 기준·소재</text><text x="70" y="915" font-size="36" fill="#253d33" font-weight="400">권리·게시 상태를 확인합니다.</text><rect x="48" y="977" width="704" height="196" rx="20" fill="#f3effa" stroke="#d6e2d9"/><rect x="68" y="997" width="42" height="36" rx="10" fill="#654395" stroke="none"/><text x="76" y="1022" font-size="22" fill="white" font-weight="700">04</text><text x="70" y="1071" font-size="36" fill="#654395" font-weight="700">만들 결과</text><text x="70" y="1131" font-size="36" fill="#253d33" font-weight="400">SNS 콘텐츠 달력과 초안</text><text x="48" y="1224" font-size="29" fill="#173d2b" font-weight="700">가상 예제로 읽어 보기</text><rect x="48" y="1245" width="704" height="320" rx="16" fill="#f8faf8" stroke="#d6e2d9"/><text x="70" y="1287" font-size="23" fill="#285942" font-weight="700">제공 자료</text><text x="70" y="1331" font-size="36" fill="#253d33" font-weight="400">가상 무선 스탠드: USB-C 충전,</text><text x="70" y="1379" font-size="36" fill="#253d33" font-weight="400">밝기 3단계, 높이 28cm. 사용</text><text x="70" y="1427" font-size="36" fill="#253d33" font-weight="400">시간·판매가·인증 여부는 자료에</text><text x="70" y="1475" font-size="36" fill="#253d33" font-weight="400">없음. 대상은 책상 공간을</text><text x="70" y="1523" font-size="36" fill="#253d33" font-weight="400">정리하려는 사용자.</text><rect x="48" y="1581" width="704" height="272" rx="16" fill="#f8faf8" stroke="#d6e2d9"/><text x="70" y="1623" font-size="23" fill="#285942" font-weight="700">예상 결과</text><text x="70" y="1667" font-size="36" fill="#253d33" font-weight="400">USB-C 충전과 밝기 조절이라는</text><text x="70" y="1715" font-size="36" fill="#253d33" font-weight="400">확인된 특징으로 초안을 씁니다.</text><text x="70" y="1763" font-size="36" fill="#253d33" font-weight="400">가격과 사용 시간은 확인 필요</text><text x="70" y="1811" font-size="36" fill="#253d33" font-weight="400">목록으로 분리합니다.</text><rect x="48" y="1869" width="704" height="166" rx="16" fill="#fff8ec" stroke="#ead7b7"/><text x="70" y="1907" font-size="23" fill="#80520e" font-weight="700">주의할 혼동</text><text x="70" y="1949" font-size="32" fill="#67491c" font-weight="400">하루 종일 사용, 업계 최저가 같은 근거</text><text x="70" y="1993" font-size="32" fill="#67491c" font-weight="400">없는 표현을 넣습니다.</text><text x="48" y="2073" font-size="19" fill="#536f61" font-weight="400">본문을 요약한 개념도 · 실제 앱 화면이나 실행 결과가 아닙니다.</text></g></svg>
