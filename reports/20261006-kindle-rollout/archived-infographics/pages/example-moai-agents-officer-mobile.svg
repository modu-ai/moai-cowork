<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 2332" width="800" height="2332" role="img" aria-labelledby="title desc"><title id="title">사무관 한눈에 보기</title><desc id="desc">준비할 자료: 내용 초안·양식·파일 형식 / 작업의 핵심: 이 초안을 지정한 문서 형식으로 작성합니다. 파일을 저장하고 열 수 있는지도 확인해 줘. / 검토 기준: 제공 자료와 결과를 비교하고 미정 항목을 구분합니다. / 만들 결과: 검토 가능한 문서 파일</desc><rect width="800" height="2332" fill="#ffffff"/><g font-family="Apple SD Gothic Neo, Malgun Gothic, Noto Sans KR, sans-serif"><text x="48" y="43" font-size="18" fill="#516e60" font-weight="600">MoAI-Cowork · 한국어 개념 설명</text><text x="48" y="102" font-size="38" fill="#173d2b" font-weight="800">사무관 한눈에 보기</text><text x="48" y="153" font-size="23" fill="#536f61" font-weight="500">업무 순서  ① → ② → ③ → ④</text><rect x="48" y="183" width="704" height="196" rx="20" fill="#edf5f0" stroke="#d6e2d9"/><rect x="68" y="203" width="42" height="36" rx="10" fill="#285942" stroke="none"/><text x="76" y="228" font-size="22" fill="white" font-weight="700">01</text><text x="70" y="277" font-size="36" fill="#285942" font-weight="700">준비할 자료</text><text x="70" y="337" font-size="36" fill="#253d33" font-weight="400">내용 초안·양식·파일 형식</text><rect x="48" y="399" width="704" height="292" rx="20" fill="#ecf3fc" stroke="#d6e2d9"/><rect x="68" y="419" width="42" height="36" rx="10" fill="#245a86" stroke="none"/><text x="76" y="444" font-size="22" fill="white" font-weight="700">02</text><text x="70" y="493" font-size="36" fill="#245a86" font-weight="700">작업의 핵심</text><text x="70" y="553" font-size="36" fill="#253d33" font-weight="400">이 초안을 지정한 문서 형식으로</text><text x="70" y="601" font-size="36" fill="#253d33" font-weight="400">작성합니다. 파일을 저장하고 열 수</text><text x="70" y="649" font-size="36" fill="#253d33" font-weight="400">있는지도 확인해 줘.</text><rect x="48" y="711" width="704" height="244" rx="20" fill="#fff5e7" stroke="#d6e2d9"/><rect x="68" y="731" width="42" height="36" rx="10" fill="#8a540a" stroke="none"/><text x="76" y="756" font-size="22" fill="white" font-weight="700">03</text><text x="70" y="805" font-size="36" fill="#8a540a" font-weight="700">검토 기준</text><text x="70" y="865" font-size="36" fill="#253d33" font-weight="400">제공 자료와 결과를 비교하고 미정</text><text x="70" y="913" font-size="36" fill="#253d33" font-weight="400">항목을 구분합니다.</text><rect x="48" y="975" width="704" height="196" rx="20" fill="#f3effa" stroke="#d6e2d9"/><rect x="68" y="995" width="42" height="36" rx="10" fill="#654395" stroke="none"/><text x="76" y="1020" font-size="22" fill="white" font-weight="700">04</text><text x="70" y="1069" font-size="36" fill="#654395" font-weight="700">만들 결과</text><text x="70" y="1129" font-size="36" fill="#253d33" font-weight="400">검토 가능한 문서 파일</text><text x="48" y="1223" font-size="29" fill="#173d2b" font-weight="700">세 항목을 더한 가상 지출 합계</text><text x="70" y="1282" font-size="31" fill="#245a86" font-weight="700">12,000 + 8,000 + 5,000</text><rect x="48" y="1312" width="704" height="84" rx="16" fill="#edf5f0" stroke="#d6e2d9"/><text x="70" y="1367" font-size="35" fill="#285942" font-weight="800">= 25,000원</text><text x="48" y="1455" font-size="29" fill="#173d2b" font-weight="700">가상 예제로 읽어 보기</text><rect x="48" y="1476" width="704" height="224" rx="16" fill="#f8faf8" stroke="#d6e2d9"/><text x="70" y="1518" font-size="23" fill="#285942" font-weight="700">제공 자료</text><text x="70" y="1562" font-size="36" fill="#253d33" font-weight="400">가상 지출표: 교재 12,000원, 인쇄</text><text x="70" y="1610" font-size="36" fill="#253d33" font-weight="400">8,000원, 소모품 5,000원. 날짜와</text><text x="70" y="1658" font-size="36" fill="#253d33" font-weight="400">결제자는 미정.</text><rect x="48" y="1716" width="704" height="320" rx="16" fill="#f8faf8" stroke="#d6e2d9"/><text x="70" y="1758" font-size="23" fill="#285942" font-weight="700">예상 결과</text><text x="70" y="1802" font-size="36" fill="#253d33" font-weight="400">세 항목 합계는 25,000원입니다.</text><text x="70" y="1850" font-size="36" fill="#253d33" font-weight="400">금액 열은 숫자로 처리하고 날짜와</text><text x="70" y="1898" font-size="36" fill="#253d33" font-weight="400">결제자는 미정으로 남깁니다. 파일을</text><text x="70" y="1946" font-size="36" fill="#253d33" font-weight="400">만들면 직접 열어 표와 합계를</text><text x="70" y="1994" font-size="36" fill="#253d33" font-weight="400">확인합니다.</text><rect x="48" y="2052" width="704" height="210" rx="16" fill="#fff8ec" stroke="#ead7b7"/><text x="70" y="2090" font-size="23" fill="#80520e" font-weight="700">주의할 혼동</text><text x="70" y="2132" font-size="32" fill="#67491c" font-weight="400">원화 기호가 붙은 값을 문자로만</text><text x="70" y="2176" font-size="32" fill="#67491c" font-weight="400">저장하거나 빈 날짜를 오늘 날짜로</text><text x="70" y="2220" font-size="32" fill="#67491c" font-weight="400">채웁니다.</text><text x="48" y="2300" font-size="19" fill="#536f61" font-weight="400">본문을 요약한 개념도 · 실제 앱 화면이나 실행 결과가 아닙니다.</text></g></svg>
