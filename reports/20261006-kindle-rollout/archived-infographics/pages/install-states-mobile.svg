<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1475" width="800" height="1475" role="img" aria-labelledby="title desc"><title id="title">설치부터 실행까지, 증거가 다릅니다</title><desc id="desc">카탈로그에 있음: 패키지의 공개된 구성만 확인한 상태입니다. / 설치되어 있음: 내 앱의 설치 상태를 확인한 것입니다. / 현재 작업에 노출: 스킬·도구가 이 작업에서 보이는지 확인합니다. / 작은 예제 실행: 실제 결과를 받고 원문과 비교해야 실행을 확인할 수 있습니다.</desc><rect width="800" height="1475" fill="#ffffff"/><g font-family="Apple SD Gothic Neo, Malgun Gothic, Noto Sans KR, sans-serif"><text x="48" y="43" font-size="18" fill="#516e60" font-weight="600">MoAI-Cowork · 한국어 개념 설명</text><text x="48" y="102" font-size="38" fill="#173d2b" font-weight="800">설치부터 실행까지, 증거가 다릅니다</text><text x="48" y="153" font-size="23" fill="#536f61" font-weight="500">비슷해 보여도 서로 다른 네 가지</text><rect x="48" y="183" width="704" height="244" rx="20" fill="#edf5f0" stroke="#d6e2d9"/><rect x="68" y="203" width="42" height="36" rx="10" fill="#285942" stroke="none"/><text x="76" y="228" font-size="22" fill="white" font-weight="700">01</text><text x="70" y="277" font-size="36" fill="#285942" font-weight="700">카탈로그에 있음</text><text x="70" y="337" font-size="36" fill="#253d33" font-weight="400">패키지의 공개된 구성만 확인한</text><text x="70" y="385" font-size="36" fill="#253d33" font-weight="400">상태입니다.</text><rect x="48" y="447" width="704" height="244" rx="20" fill="#ecf3fc" stroke="#d6e2d9"/><rect x="68" y="467" width="42" height="36" rx="10" fill="#245a86" stroke="none"/><text x="76" y="492" font-size="22" fill="white" font-weight="700">02</text><text x="70" y="541" font-size="36" fill="#245a86" font-weight="700">설치되어 있음</text><text x="70" y="601" font-size="36" fill="#253d33" font-weight="400">내 앱의 설치 상태를 확인한</text><text x="70" y="649" font-size="36" fill="#253d33" font-weight="400">것입니다.</text><rect x="48" y="711" width="704" height="244" rx="20" fill="#fff5e7" stroke="#d6e2d9"/><rect x="68" y="731" width="42" height="36" rx="10" fill="#8a540a" stroke="none"/><text x="76" y="756" font-size="22" fill="white" font-weight="700">03</text><text x="70" y="805" font-size="36" fill="#8a540a" font-weight="700">현재 작업에 노출</text><text x="70" y="865" font-size="36" fill="#253d33" font-weight="400">스킬·도구가 이 작업에서 보이는지</text><text x="70" y="913" font-size="36" fill="#253d33" font-weight="400">확인합니다.</text><rect x="48" y="975" width="704" height="244" rx="20" fill="#f3effa" stroke="#d6e2d9"/><rect x="68" y="995" width="42" height="36" rx="10" fill="#654395" stroke="none"/><text x="76" y="1020" font-size="22" fill="white" font-weight="700">04</text><text x="70" y="1069" font-size="36" fill="#654395" font-weight="700">작은 예제 실행</text><text x="70" y="1129" font-size="36" fill="#253d33" font-weight="400">실제 결과를 받고 원문과 비교해야</text><text x="70" y="1177" font-size="36" fill="#253d33" font-weight="400">실행을 확인할 수 있습니다.</text><rect x="48" y="1239" width="704" height="166" rx="16" fill="#fff8ec" stroke="#ead7b7"/><text x="70" y="1277" font-size="23" fill="#80520e" font-weight="700">기억할 기준</text><text x="70" y="1319" font-size="32" fill="#67491c" font-weight="400">설치됨 표시만으로 인증 성공이나 전체</text><text x="70" y="1363" font-size="32" fill="#67491c" font-weight="400">업무 완료를 보고하지 않습니다.</text><text x="48" y="1443" font-size="19" fill="#536f61" font-weight="400">본문을 요약한 개념도 · 실제 앱 화면이나 실행 결과가 아닙니다.</text></g></svg>
