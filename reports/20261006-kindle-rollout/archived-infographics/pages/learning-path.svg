<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 866" width="800" height="866" role="img" aria-labelledby="title desc"><title id="title">처음부터 내 업무 적용까지</title><desc id="desc">작게 시작: 목표 하나와 예제 자료로 첫 초안을 만듭니다. / 프로젝트 준비: 계속 쓸 지침과 이번 자료를 구분합니다. / 필요한 기능 선택: 실제 사용할 스킬과 역할을 확인합니다. / 검토하고 재사용: 원문과 비교한 기준을 다음 작업에 남깁니다.</desc><rect width="800" height="866" fill="#ffffff"/><g font-family="Apple SD Gothic Neo, Malgun Gothic, Noto Sans KR, sans-serif"><text x="48" y="43" font-size="18" fill="#516e60" font-weight="600">MoAI-Cowork · 한국어 개념 설명</text><text x="48" y="102" font-size="38" fill="#173d2b" font-weight="800">처음부터 내 업무 적용까지</text><text x="48" y="153" font-size="23" fill="#536f61" font-weight="500">업무 순서  ① → ② → ③ → ④</text><rect x="48" y="183" width="336" height="230" rx="20" fill="#edf5f0" stroke="#d6e2d9"/><rect x="68" y="203" width="42" height="36" rx="10" fill="#285942" stroke="none"/><text x="76" y="228" font-size="22" fill="white" font-weight="700">01</text><text x="70" y="277" font-size="28" fill="#285942" font-weight="700">작게 시작</text><text x="70" y="328" font-size="26" fill="#253d33" font-weight="400">목표 하나와 예제</text><text x="70" y="365" font-size="26" fill="#253d33" font-weight="400">자료로 첫 초안을</text><text x="70" y="402" font-size="26" fill="#253d33" font-weight="400">만듭니다.</text><rect x="416" y="183" width="336" height="230" rx="20" fill="#ecf3fc" stroke="#d6e2d9"/><rect x="436" y="203" width="42" height="36" rx="10" fill="#245a86" stroke="none"/><text x="444" y="228" font-size="22" fill="white" font-weight="700">02</text><text x="438" y="277" font-size="28" fill="#245a86" font-weight="700">프로젝트 준비</text><text x="438" y="328" font-size="26" fill="#253d33" font-weight="400">계속 쓸 지침과 이번</text><text x="438" y="365" font-size="26" fill="#253d33" font-weight="400">자료를 구분합니다.</text><rect x="48" y="433" width="336" height="193" rx="20" fill="#fff5e7" stroke="#d6e2d9"/><rect x="68" y="453" width="42" height="36" rx="10" fill="#8a540a" stroke="none"/><text x="76" y="478" font-size="22" fill="white" font-weight="700">03</text><text x="70" y="527" font-size="28" fill="#8a540a" font-weight="700">필요한 기능 선택</text><text x="70" y="578" font-size="26" fill="#253d33" font-weight="400">실제 사용할 스킬과</text><text x="70" y="615" font-size="26" fill="#253d33" font-weight="400">역할을 확인합니다.</text><rect x="416" y="433" width="336" height="193" rx="20" fill="#f3effa" stroke="#d6e2d9"/><rect x="436" y="453" width="42" height="36" rx="10" fill="#654395" stroke="none"/><text x="444" y="478" font-size="22" fill="white" font-weight="700">04</text><text x="438" y="527" font-size="28" fill="#654395" font-weight="700">검토하고 재사용</text><text x="438" y="578" font-size="26" fill="#253d33" font-weight="400">원문과 비교한 기준을</text><text x="438" y="615" font-size="26" fill="#253d33" font-weight="400">다음 작업에 남깁니다.</text><rect x="48" y="646" width="704" height="150" rx="16" fill="#fff8ec" stroke="#ead7b7"/><text x="70" y="684" font-size="23" fill="#80520e" font-weight="700">기억할 기준</text><text x="70" y="726" font-size="25" fill="#67491c" font-weight="400">순서를 외우기보다 각 단계에서 확인한 결과를</text><text x="70" y="762" font-size="25" fill="#67491c" font-weight="400">설명해 보세요.</text><text x="48" y="834" font-size="19" fill="#536f61" font-weight="400">본문을 요약한 개념도 · 실제 앱 화면이나 실행 결과가 아닙니다.</text></g></svg>
