<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1406" width="800" height="1406" role="img" aria-labelledby="title desc"><title id="title">광고 트랙 한눈에 보기</title><desc id="desc">준비할 자료: 광고 자료·기간·목표 / 작업의 핵심: 자료 확인, 요구 정리, 초안, 검토 순서로 진행합니다. / 검토 기준: 지표 정의·계정·기간·예산 변경 여부를 확인합니다. / 만들 결과: 광고 성과 분석과 개선안</desc><rect width="800" height="1406" fill="#ffffff"/><g font-family="Apple SD Gothic Neo, Malgun Gothic, Noto Sans KR, sans-serif"><text x="48" y="43" font-size="18" fill="#516e60" font-weight="600">MoAI-Cowork · 한국어 개념 설명</text><text x="48" y="102" font-size="38" fill="#173d2b" font-weight="800">광고 트랙 한눈에 보기</text><text x="48" y="153" font-size="23" fill="#536f61" font-weight="500">업무 순서  ① → ② → ③ → ④</text><rect x="48" y="183" width="336" height="230" rx="20" fill="#edf5f0" stroke="#d6e2d9"/><rect x="68" y="203" width="42" height="36" rx="10" fill="#285942" stroke="none"/><text x="76" y="228" font-size="22" fill="white" font-weight="700">01</text><text x="70" y="277" font-size="28" fill="#285942" font-weight="700">준비할 자료</text><text x="70" y="328" font-size="26" fill="#253d33" font-weight="400">광고 자료·기간·목표</text><rect x="416" y="183" width="336" height="230" rx="20" fill="#ecf3fc" stroke="#d6e2d9"/><rect x="436" y="203" width="42" height="36" rx="10" fill="#245a86" stroke="none"/><text x="444" y="228" font-size="22" fill="white" font-weight="700">02</text><text x="438" y="277" font-size="28" fill="#245a86" font-weight="700">작업의 핵심</text><text x="438" y="328" font-size="26" fill="#253d33" font-weight="400">자료 확인, 요구 정리,</text><text x="438" y="365" font-size="26" fill="#253d33" font-weight="400">초안, 검토 순서로</text><text x="438" y="402" font-size="26" fill="#253d33" font-weight="400">진행합니다.</text><rect x="48" y="433" width="336" height="267" rx="20" fill="#fff5e7" stroke="#d6e2d9"/><rect x="68" y="453" width="42" height="36" rx="10" fill="#8a540a" stroke="none"/><text x="76" y="478" font-size="22" fill="white" font-weight="700">03</text><text x="70" y="527" font-size="28" fill="#8a540a" font-weight="700">검토 기준</text><text x="70" y="578" font-size="26" fill="#253d33" font-weight="400">지표</text><text x="70" y="615" font-size="26" fill="#253d33" font-weight="400">정의·계정·기간·예산</text><text x="70" y="652" font-size="26" fill="#253d33" font-weight="400">변경 여부를</text><text x="70" y="689" font-size="26" fill="#253d33" font-weight="400">확인합니다.</text><rect x="416" y="433" width="336" height="267" rx="20" fill="#f3effa" stroke="#d6e2d9"/><rect x="436" y="453" width="42" height="36" rx="10" fill="#654395" stroke="none"/><text x="444" y="478" font-size="22" fill="white" font-weight="700">04</text><text x="438" y="527" font-size="28" fill="#654395" font-weight="700">만들 결과</text><text x="438" y="578" font-size="26" fill="#253d33" font-weight="400">광고 성과 분석과</text><text x="438" y="615" font-size="26" fill="#253d33" font-weight="400">개선안</text><text x="48" y="751" font-size="29" fill="#173d2b" font-weight="700">가상 예제로 읽어 보기</text><rect x="48" y="772" width="704" height="191" rx="16" fill="#f8faf8" stroke="#d6e2d9"/><text x="70" y="814" font-size="23" fill="#285942" font-weight="700">제공 자료</text><text x="70" y="858" font-size="26" fill="#253d33" font-weight="400">가상 무선 스탠드: USB-C 충전, 밝기 3단계, 높이</text><text x="70" y="895" font-size="26" fill="#253d33" font-weight="400">28cm. 사용 시간·판매가·인증 여부는 자료에</text><text x="70" y="932" font-size="26" fill="#253d33" font-weight="400">없음. 대상은 책상 공간을 정리하려는 사용자.</text><rect x="48" y="979" width="704" height="191" rx="16" fill="#f8faf8" stroke="#d6e2d9"/><text x="70" y="1021" font-size="23" fill="#285942" font-weight="700">예상 결과</text><text x="70" y="1065" font-size="26" fill="#253d33" font-weight="400">USB-C 충전과 밝기 조절이라는 확인된 특징으로</text><text x="70" y="1102" font-size="26" fill="#253d33" font-weight="400">초안을 씁니다. 가격과 사용 시간은 확인 필요</text><text x="70" y="1139" font-size="26" fill="#253d33" font-weight="400">목록으로 분리합니다.</text><rect x="48" y="1186" width="704" height="150" rx="16" fill="#fff8ec" stroke="#ead7b7"/><text x="70" y="1224" font-size="23" fill="#80520e" font-weight="700">주의할 혼동</text><text x="70" y="1266" font-size="25" fill="#67491c" font-weight="400">하루 종일 사용, 업계 최저가 같은 근거 없는</text><text x="70" y="1302" font-size="25" fill="#67491c" font-weight="400">표현을 넣습니다.</text><text x="48" y="1374" font-size="19" fill="#536f61" font-weight="400">본문을 요약한 개념도 · 실제 앱 화면이나 실행 결과가 아닙니다.</text></g></svg>
