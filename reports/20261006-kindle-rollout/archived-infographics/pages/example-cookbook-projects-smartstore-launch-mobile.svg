<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 2105" width="800" height="2105" role="img" aria-labelledby="title desc"><title id="title">스마트스토어 신제품 런칭하기 한눈에 보기</title><desc id="desc">준비할 자료: 상품 정보·사진·고객·판매 조건 / 작업의 핵심: 상품 사실, 상세페이지 문구, 이미지, 등록 전 점검을 순서대로 진행합니다. / 검토 기준: 인증·효능 근거·가격·배송 조건·게시 상태를 확인합니다. / 만들 결과: 상품 소개와 출시 준비 목록</desc><rect width="800" height="2105" fill="#ffffff"/><g font-family="Apple SD Gothic Neo, Malgun Gothic, Noto Sans KR, sans-serif"><text x="48" y="43" font-size="18" fill="#516e60" font-weight="600">MoAI-Cowork · 한국어 개념 설명</text><text x="48" y="102" font-size="38" fill="#173d2b" font-weight="800">스마트스토어 신제품 런칭하기 한눈에</text><text x="48" y="152" font-size="38" fill="#173d2b" font-weight="800">보기</text><text x="48" y="203" font-size="23" fill="#536f61" font-weight="500">업무 순서  ① → ② → ③ → ④</text><rect x="48" y="233" width="704" height="196" rx="20" fill="#edf5f0" stroke="#d6e2d9"/><rect x="68" y="253" width="42" height="36" rx="10" fill="#285942" stroke="none"/><text x="76" y="278" font-size="22" fill="white" font-weight="700">01</text><text x="70" y="327" font-size="36" fill="#285942" font-weight="700">준비할 자료</text><text x="70" y="387" font-size="36" fill="#253d33" font-weight="400">상품 정보·사진·고객·판매 조건</text><rect x="48" y="449" width="704" height="292" rx="20" fill="#ecf3fc" stroke="#d6e2d9"/><rect x="68" y="469" width="42" height="36" rx="10" fill="#245a86" stroke="none"/><text x="76" y="494" font-size="22" fill="white" font-weight="700">02</text><text x="70" y="543" font-size="36" fill="#245a86" font-weight="700">작업의 핵심</text><text x="70" y="603" font-size="36" fill="#253d33" font-weight="400">상품 사실, 상세페이지 문구,</text><text x="70" y="651" font-size="36" fill="#253d33" font-weight="400">이미지, 등록 전 점검을 순서대로</text><text x="70" y="699" font-size="36" fill="#253d33" font-weight="400">진행합니다.</text><rect x="48" y="761" width="704" height="244" rx="20" fill="#fff5e7" stroke="#d6e2d9"/><rect x="68" y="781" width="42" height="36" rx="10" fill="#8a540a" stroke="none"/><text x="76" y="806" font-size="22" fill="white" font-weight="700">03</text><text x="70" y="855" font-size="36" fill="#8a540a" font-weight="700">검토 기준</text><text x="70" y="915" font-size="36" fill="#253d33" font-weight="400">인증·효능 근거·가격·배송 조건·게시</text><text x="70" y="963" font-size="36" fill="#253d33" font-weight="400">상태를 확인합니다.</text><rect x="48" y="1025" width="704" height="196" rx="20" fill="#f3effa" stroke="#d6e2d9"/><rect x="68" y="1045" width="42" height="36" rx="10" fill="#654395" stroke="none"/><text x="76" y="1070" font-size="22" fill="white" font-weight="700">04</text><text x="70" y="1119" font-size="36" fill="#654395" font-weight="700">만들 결과</text><text x="70" y="1179" font-size="36" fill="#253d33" font-weight="400">상품 소개와 출시 준비 목록</text><text x="48" y="1272" font-size="29" fill="#173d2b" font-weight="700">가상 예제로 읽어 보기</text><rect x="48" y="1293" width="704" height="272" rx="16" fill="#f8faf8" stroke="#d6e2d9"/><text x="70" y="1335" font-size="23" fill="#285942" font-weight="700">제공 자료</text><text x="70" y="1379" font-size="36" fill="#253d33" font-weight="400">가상 상품: USB-C 충전 스탠드,</text><text x="70" y="1427" font-size="36" fill="#253d33" font-weight="400">높이 28cm, 밝기 3단계.</text><text x="70" y="1475" font-size="36" fill="#253d33" font-weight="400">가격·배송비·사용 시간·인증 정보는</text><text x="70" y="1523" font-size="36" fill="#253d33" font-weight="400">없음.</text><rect x="48" y="1581" width="704" height="272" rx="16" fill="#f8faf8" stroke="#d6e2d9"/><text x="70" y="1623" font-size="23" fill="#285942" font-weight="700">예상 결과</text><text x="70" y="1667" font-size="36" fill="#253d33" font-weight="400">확인된 사양으로 소개 초안을 만들고</text><text x="70" y="1715" font-size="36" fill="#253d33" font-weight="400">가격·배송비·사용 시간·인증은 확인</text><text x="70" y="1763" font-size="36" fill="#253d33" font-weight="400">목록으로 나눕니다. 실제 등록은</text><text x="70" y="1811" font-size="36" fill="#253d33" font-weight="400">수행하지 않은 상태로 표시합니다.</text><rect x="48" y="1869" width="704" height="166" rx="16" fill="#fff8ec" stroke="#ead7b7"/><text x="70" y="1907" font-size="23" fill="#80520e" font-weight="700">주의할 혼동</text><text x="70" y="1949" font-size="32" fill="#67491c" font-weight="400">효능이나 인증을 만들어 넣거나 초안을</text><text x="70" y="1993" font-size="32" fill="#67491c" font-weight="400">만든 뒤 상품을 등록했다고 보고합니다.</text><text x="48" y="2073" font-size="19" fill="#536f61" font-weight="400">본문을 요약한 개념도 · 실제 앱 화면이나 실행 결과가 아닙니다.</text></g></svg>
