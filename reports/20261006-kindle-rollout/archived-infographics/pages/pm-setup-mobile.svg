<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1523" width="800" height="1523" role="img" aria-labelledby="title desc"><title id="title">내 프로젝트에 맞는 지침 만들기</title><desc id="desc">맥락과 실제 기능: 목표·독자·자료를 질문하고 사용할 스킬과 도구를 확인합니다. / 역할과 업무 순서: 각 역할의 입력·출력·완료 기준과 인계 조건을 정합니다. / 지침 생성과 적용: 지원되는 프로젝트 지침 경로에 저장하고 새 작업에서 읽기를 확인합니다. / 첫 업무와 결과 검토: 작은 업무를 실행해 결과 파일과 미정 항목을 확인합니다.</desc><rect width="800" height="1523" fill="#ffffff"/><g font-family="Apple SD Gothic Neo, Malgun Gothic, Noto Sans KR, sans-serif"><text x="48" y="43" font-size="18" fill="#516e60" font-weight="600">MoAI-Cowork · 한국어 개념 설명</text><text x="48" y="102" font-size="38" fill="#173d2b" font-weight="800">내 프로젝트에 맞는 지침 만들기</text><text x="48" y="153" font-size="23" fill="#536f61" font-weight="500">업무 순서  ① → ② → ③ → ④</text><rect x="48" y="183" width="704" height="244" rx="20" fill="#edf5f0" stroke="#d6e2d9"/><rect x="68" y="203" width="42" height="36" rx="10" fill="#285942" stroke="none"/><text x="76" y="228" font-size="22" fill="white" font-weight="700">01</text><text x="70" y="277" font-size="36" fill="#285942" font-weight="700">맥락과 실제 기능</text><text x="70" y="337" font-size="36" fill="#253d33" font-weight="400">목표·독자·자료를 질문하고 사용할</text><text x="70" y="385" font-size="36" fill="#253d33" font-weight="400">스킬과 도구를 확인합니다.</text><rect x="48" y="447" width="704" height="244" rx="20" fill="#ecf3fc" stroke="#d6e2d9"/><rect x="68" y="467" width="42" height="36" rx="10" fill="#245a86" stroke="none"/><text x="76" y="492" font-size="22" fill="white" font-weight="700">02</text><text x="70" y="541" font-size="36" fill="#245a86" font-weight="700">역할과 업무 순서</text><text x="70" y="601" font-size="36" fill="#253d33" font-weight="400">각 역할의 입력·출력·완료 기준과</text><text x="70" y="649" font-size="36" fill="#253d33" font-weight="400">인계 조건을 정합니다.</text><rect x="48" y="711" width="704" height="292" rx="20" fill="#fff5e7" stroke="#d6e2d9"/><rect x="68" y="731" width="42" height="36" rx="10" fill="#8a540a" stroke="none"/><text x="76" y="756" font-size="22" fill="white" font-weight="700">03</text><text x="70" y="805" font-size="36" fill="#8a540a" font-weight="700">지침 생성과 적용</text><text x="70" y="865" font-size="36" fill="#253d33" font-weight="400">지원되는 프로젝트 지침 경로에</text><text x="70" y="913" font-size="36" fill="#253d33" font-weight="400">저장하고 새 작업에서 읽기를</text><text x="70" y="961" font-size="36" fill="#253d33" font-weight="400">확인합니다.</text><rect x="48" y="1023" width="704" height="244" rx="20" fill="#f3effa" stroke="#d6e2d9"/><rect x="68" y="1043" width="42" height="36" rx="10" fill="#654395" stroke="none"/><text x="76" y="1068" font-size="22" fill="white" font-weight="700">04</text><text x="70" y="1117" font-size="36" fill="#654395" font-weight="700">첫 업무와 결과 검토</text><text x="70" y="1177" font-size="36" fill="#253d33" font-weight="400">작은 업무를 실행해 결과 파일과</text><text x="70" y="1225" font-size="36" fill="#253d33" font-weight="400">미정 항목을 확인합니다.</text><rect x="48" y="1287" width="704" height="166" rx="16" fill="#fff8ec" stroke="#ead7b7"/><text x="70" y="1325" font-size="23" fill="#80520e" font-weight="700">기억할 기준</text><text x="70" y="1367" font-size="32" fill="#67491c" font-weight="400">지침 파일 생성, 앱 Projects 저장,</text><text x="70" y="1411" font-size="32" fill="#67491c" font-weight="400">실제 참조는 서로 다른 상태입니다.</text><text x="48" y="1491" font-size="19" fill="#536f61" font-weight="400">본문을 요약한 개념도 · 실제 앱 화면이나 실행 결과가 아닙니다.</text></g></svg>
