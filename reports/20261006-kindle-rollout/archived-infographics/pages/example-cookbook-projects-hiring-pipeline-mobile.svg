<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 2149" width="800" height="2149" role="img" aria-labelledby="title desc"><title id="title">채용 공고부터 오퍼레터까지 한눈에 보기</title><desc id="desc">준비할 자료: 직무 요구·채용 절차·공고 양식 / 작업의 핵심: 공고, 평가 기준, 인터뷰 질문, 후속 문서 순서를 구성합니다. / 검토 기준: 직무 관련성·평가 기준·민감정보 범위를 확인합니다. / 만들 결과: 채용 문서와 진행 기준</desc><rect width="800" height="2149" fill="#ffffff"/><g font-family="Apple SD Gothic Neo, Malgun Gothic, Noto Sans KR, sans-serif"><text x="48" y="43" font-size="18" fill="#516e60" font-weight="600">MoAI-Cowork · 한국어 개념 설명</text><text x="48" y="102" font-size="38" fill="#173d2b" font-weight="800">채용 공고부터 오퍼레터까지 한눈에</text><text x="48" y="152" font-size="38" fill="#173d2b" font-weight="800">보기</text><text x="48" y="203" font-size="23" fill="#536f61" font-weight="500">업무 순서  ① → ② → ③ → ④</text><rect x="48" y="233" width="704" height="196" rx="20" fill="#edf5f0" stroke="#d6e2d9"/><rect x="68" y="253" width="42" height="36" rx="10" fill="#285942" stroke="none"/><text x="76" y="278" font-size="22" fill="white" font-weight="700">01</text><text x="70" y="327" font-size="36" fill="#285942" font-weight="700">준비할 자료</text><text x="70" y="387" font-size="36" fill="#253d33" font-weight="400">직무 요구·채용 절차·공고 양식</text><rect x="48" y="449" width="704" height="244" rx="20" fill="#ecf3fc" stroke="#d6e2d9"/><rect x="68" y="469" width="42" height="36" rx="10" fill="#245a86" stroke="none"/><text x="76" y="494" font-size="22" fill="white" font-weight="700">02</text><text x="70" y="543" font-size="36" fill="#245a86" font-weight="700">작업의 핵심</text><text x="70" y="603" font-size="36" fill="#253d33" font-weight="400">공고, 평가 기준, 인터뷰 질문, 후속</text><text x="70" y="651" font-size="36" fill="#253d33" font-weight="400">문서 순서를 구성합니다.</text><rect x="48" y="713" width="704" height="244" rx="20" fill="#fff5e7" stroke="#d6e2d9"/><rect x="68" y="733" width="42" height="36" rx="10" fill="#8a540a" stroke="none"/><text x="76" y="758" font-size="22" fill="white" font-weight="700">03</text><text x="70" y="807" font-size="36" fill="#8a540a" font-weight="700">검토 기준</text><text x="70" y="867" font-size="36" fill="#253d33" font-weight="400">직무 관련성·평가 기준·민감정보</text><text x="70" y="915" font-size="36" fill="#253d33" font-weight="400">범위를 확인합니다.</text><rect x="48" y="977" width="704" height="196" rx="20" fill="#f3effa" stroke="#d6e2d9"/><rect x="68" y="997" width="42" height="36" rx="10" fill="#654395" stroke="none"/><text x="76" y="1022" font-size="22" fill="white" font-weight="700">04</text><text x="70" y="1071" font-size="36" fill="#654395" font-weight="700">만들 결과</text><text x="70" y="1131" font-size="36" fill="#253d33" font-weight="400">채용 문서와 진행 기준</text><text x="48" y="1224" font-size="29" fill="#173d2b" font-weight="700">가상 예제로 읽어 보기</text><rect x="48" y="1245" width="704" height="272" rx="16" fill="#f8faf8" stroke="#d6e2d9"/><text x="70" y="1287" font-size="23" fill="#285942" font-weight="700">제공 자료</text><text x="70" y="1331" font-size="36" fill="#253d33" font-weight="400">가상 직무: 고객 문의 정리와</text><text x="70" y="1379" font-size="36" fill="#253d33" font-weight="400">주간보고 작성. 요구 능력은 표</text><text x="70" y="1427" font-size="36" fill="#253d33" font-weight="400">작성, 정책 근거 확인, 팀 문서</text><text x="70" y="1475" font-size="36" fill="#253d33" font-weight="400">인계. 지원자 자료는 없음.</text><rect x="48" y="1533" width="704" height="320" rx="16" fill="#f8faf8" stroke="#d6e2d9"/><text x="70" y="1575" font-size="23" fill="#285942" font-weight="700">예상 결과</text><text x="70" y="1619" font-size="36" fill="#253d33" font-weight="400">업무와 관련된 공고 문구, 표 작성</text><text x="70" y="1667" font-size="36" fill="#253d33" font-weight="400">과제, 정책 검토 질문을 만듭니다.</text><text x="70" y="1715" font-size="36" fill="#253d33" font-weight="400">미정 근무 조건은 확인 필요로</text><text x="70" y="1763" font-size="36" fill="#253d33" font-weight="400">표시하며 지원자 평가 결과는 만들지</text><text x="70" y="1811" font-size="36" fill="#253d33" font-weight="400">않습니다.</text><rect x="48" y="1869" width="704" height="210" rx="16" fill="#fff8ec" stroke="#ead7b7"/><text x="70" y="1907" font-size="23" fill="#80520e" font-weight="700">주의할 혼동</text><text x="70" y="1949" font-size="32" fill="#67491c" font-weight="400">지원자 자료 없이 합격자를 정하거나</text><text x="70" y="1993" font-size="32" fill="#67491c" font-weight="400">직무와 관계없는 개인 특성으로 평가</text><text x="70" y="2037" font-size="32" fill="#67491c" font-weight="400">기준을 만듭니다.</text><text x="48" y="2117" font-size="19" fill="#536f61" font-weight="400">본문을 요약한 개념도 · 실제 앱 화면이나 실행 결과가 아닙니다.</text></g></svg>
