<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1406" width="800" height="1406" role="img" aria-labelledby="title desc"><title id="title">디자이너 한눈에 보기</title><desc id="desc">준비할 자료: 디자인 목적·브랜드·참고 자료 / 작업의 핵심: 브랜드 자료로 디자인 브리프를 작성합니다. 실제 사용할 제작 도구도 확인해 줘. / 검토 기준: 제공 자료와 결과를 비교하고 미정 항목을 구분합니다. / 만들 결과: 브리프와 시안</desc><rect width="800" height="1406" fill="#ffffff"/><g font-family="Apple SD Gothic Neo, Malgun Gothic, Noto Sans KR, sans-serif"><text x="48" y="43" font-size="18" fill="#516e60" font-weight="600">MoAI-Cowork · 한국어 개념 설명</text><text x="48" y="102" font-size="38" fill="#173d2b" font-weight="800">디자이너 한눈에 보기</text><text x="48" y="153" font-size="23" fill="#536f61" font-weight="500">업무 순서  ① → ② → ③ → ④</text><rect x="48" y="183" width="336" height="267" rx="20" fill="#edf5f0" stroke="#d6e2d9"/><rect x="68" y="203" width="42" height="36" rx="10" fill="#285942" stroke="none"/><text x="76" y="228" font-size="22" fill="white" font-weight="700">01</text><text x="70" y="277" font-size="28" fill="#285942" font-weight="700">준비할 자료</text><text x="70" y="328" font-size="26" fill="#253d33" font-weight="400">디자인</text><text x="70" y="365" font-size="26" fill="#253d33" font-weight="400">목적·브랜드·참고 자료</text><rect x="416" y="183" width="336" height="267" rx="20" fill="#ecf3fc" stroke="#d6e2d9"/><rect x="436" y="203" width="42" height="36" rx="10" fill="#245a86" stroke="none"/><text x="444" y="228" font-size="22" fill="white" font-weight="700">02</text><text x="438" y="277" font-size="28" fill="#245a86" font-weight="700">작업의 핵심</text><text x="438" y="328" font-size="26" fill="#253d33" font-weight="400">브랜드 자료로 디자인</text><text x="438" y="365" font-size="26" fill="#253d33" font-weight="400">브리프를 작성합니다.</text><text x="438" y="402" font-size="26" fill="#253d33" font-weight="400">실제 사용할 제작</text><text x="438" y="439" font-size="26" fill="#253d33" font-weight="400">도구도 확인해 줘.</text><rect x="48" y="470" width="336" height="230" rx="20" fill="#fff5e7" stroke="#d6e2d9"/><rect x="68" y="490" width="42" height="36" rx="10" fill="#8a540a" stroke="none"/><text x="76" y="515" font-size="22" fill="white" font-weight="700">03</text><text x="70" y="564" font-size="28" fill="#8a540a" font-weight="700">검토 기준</text><text x="70" y="615" font-size="26" fill="#253d33" font-weight="400">제공 자료와 결과를</text><text x="70" y="652" font-size="26" fill="#253d33" font-weight="400">비교하고 미정 항목을</text><text x="70" y="689" font-size="26" fill="#253d33" font-weight="400">구분합니다.</text><rect x="416" y="470" width="336" height="230" rx="20" fill="#f3effa" stroke="#d6e2d9"/><rect x="436" y="490" width="42" height="36" rx="10" fill="#654395" stroke="none"/><text x="444" y="515" font-size="22" fill="white" font-weight="700">04</text><text x="438" y="564" font-size="28" fill="#654395" font-weight="700">만들 결과</text><text x="438" y="615" font-size="26" fill="#253d33" font-weight="400">브리프와 시안</text><text x="48" y="751" font-size="29" fill="#173d2b" font-weight="700">가상 예제로 읽어 보기</text><rect x="48" y="772" width="704" height="191" rx="16" fill="#f8faf8" stroke="#d6e2d9"/><text x="70" y="814" font-size="23" fill="#285942" font-weight="700">제공 자료</text><text x="70" y="858" font-size="26" fill="#253d33" font-weight="400">가상 발표: 문의 6건을 배송 3·반품 2·결제 1로</text><text x="70" y="895" font-size="26" fill="#253d33" font-weight="400">정리한 개선 제안. 청중은 고객지원 팀장. 브랜드</text><text x="70" y="932" font-size="26" fill="#253d33" font-weight="400">색과 화면 크기는 미정.</text><rect x="48" y="979" width="704" height="191" rx="16" fill="#f8faf8" stroke="#d6e2d9"/><text x="70" y="1021" font-size="23" fill="#285942" font-weight="700">예상 결과</text><text x="70" y="1065" font-size="26" fill="#253d33" font-weight="400">문제, 분류 근거, FAQ 초안, 확인 필요 사항,</text><text x="70" y="1102" font-size="26" fill="#253d33" font-weight="400">다음 행동 순서로 구성합니다. 차트에 문의 수와</text><text x="70" y="1139" font-size="26" fill="#253d33" font-weight="400">단위를 쓰며 글자는 발표 화면에서 확인합니다.</text><rect x="48" y="1186" width="704" height="150" rx="16" fill="#fff8ec" stroke="#ead7b7"/><text x="70" y="1224" font-size="23" fill="#80520e" font-weight="700">주의할 혼동</text><text x="70" y="1266" font-size="25" fill="#67491c" font-weight="400">한 장에 모든 문장을 넣거나 문의 건수를 비율인</text><text x="70" y="1302" font-size="25" fill="#67491c" font-weight="400">것처럼 표시합니다.</text><text x="48" y="1374" font-size="19" fill="#536f61" font-weight="400">본문을 요약한 개념도 · 실제 앱 화면이나 실행 결과가 아닙니다.</text></g></svg>
