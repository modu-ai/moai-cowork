<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 2103" width="800" height="2103" role="img" aria-labelledby="title desc"><title id="title">이직 준비 프로젝트 한눈에 보기</title><desc id="desc">준비할 자료: 경력·희망 직무·이력서·활동 가능 범위 / 작업의 핵심: 직무 요구를 확인하고 경력 정리, 이력서 수정, 면접 준비로 진행합니다. / 검토 기준: 실제 경력·수치·지원 요건·미정 일정을 확인합니다. / 만들 결과: 이직 준비 목록과 지원 자료</desc><rect width="800" height="2103" fill="#ffffff"/><g font-family="Apple SD Gothic Neo, Malgun Gothic, Noto Sans KR, sans-serif"><text x="48" y="43" font-size="18" fill="#516e60" font-weight="600">MoAI-Cowork · 한국어 개념 설명</text><text x="48" y="102" font-size="38" fill="#173d2b" font-weight="800">이직 준비 프로젝트 한눈에 보기</text><text x="48" y="153" font-size="23" fill="#536f61" font-weight="500">업무 순서  ① → ② → ③ → ④</text><rect x="48" y="183" width="704" height="244" rx="20" fill="#edf5f0" stroke="#d6e2d9"/><rect x="68" y="203" width="42" height="36" rx="10" fill="#285942" stroke="none"/><text x="76" y="228" font-size="22" fill="white" font-weight="700">01</text><text x="70" y="277" font-size="36" fill="#285942" font-weight="700">준비할 자료</text><text x="70" y="337" font-size="36" fill="#253d33" font-weight="400">경력·희망 직무·이력서·활동 가능</text><text x="70" y="385" font-size="36" fill="#253d33" font-weight="400">범위</text><rect x="48" y="447" width="704" height="292" rx="20" fill="#ecf3fc" stroke="#d6e2d9"/><rect x="68" y="467" width="42" height="36" rx="10" fill="#245a86" stroke="none"/><text x="76" y="492" font-size="22" fill="white" font-weight="700">02</text><text x="70" y="541" font-size="36" fill="#245a86" font-weight="700">작업의 핵심</text><text x="70" y="601" font-size="36" fill="#253d33" font-weight="400">직무 요구를 확인하고 경력 정리,</text><text x="70" y="649" font-size="36" fill="#253d33" font-weight="400">이력서 수정, 면접 준비로</text><text x="70" y="697" font-size="36" fill="#253d33" font-weight="400">진행합니다.</text><rect x="48" y="759" width="704" height="244" rx="20" fill="#fff5e7" stroke="#d6e2d9"/><rect x="68" y="779" width="42" height="36" rx="10" fill="#8a540a" stroke="none"/><text x="76" y="804" font-size="22" fill="white" font-weight="700">03</text><text x="70" y="853" font-size="36" fill="#8a540a" font-weight="700">검토 기준</text><text x="70" y="913" font-size="36" fill="#253d33" font-weight="400">실제 경력·수치·지원 요건·미정</text><text x="70" y="961" font-size="36" fill="#253d33" font-weight="400">일정을 확인합니다.</text><rect x="48" y="1023" width="704" height="196" rx="20" fill="#f3effa" stroke="#d6e2d9"/><rect x="68" y="1043" width="42" height="36" rx="10" fill="#654395" stroke="none"/><text x="76" y="1068" font-size="22" fill="white" font-weight="700">04</text><text x="70" y="1117" font-size="36" fill="#654395" font-weight="700">만들 결과</text><text x="70" y="1177" font-size="36" fill="#253d33" font-weight="400">이직 준비 목록과 지원 자료</text><text x="48" y="1270" font-size="29" fill="#173d2b" font-weight="700">가상 예제로 읽어 보기</text><rect x="48" y="1291" width="704" height="272" rx="16" fill="#f8faf8" stroke="#d6e2d9"/><text x="70" y="1333" font-size="23" fill="#285942" font-weight="700">제공 자료</text><text x="70" y="1377" font-size="36" fill="#253d33" font-weight="400">가상 경력: 문의 처리 1년, FAQ</text><text x="70" y="1425" font-size="36" fill="#253d33" font-weight="400">초안 4개 작성, 스프레드시트로 문의</text><text x="70" y="1473" font-size="36" fill="#253d33" font-weight="400">목록 정리. 지원 희망은 고객지원</text><text x="70" y="1521" font-size="36" fill="#253d33" font-weight="400">운영. 매출 기여 수치는 없음.</text><rect x="48" y="1579" width="704" height="272" rx="16" fill="#f8faf8" stroke="#d6e2d9"/><text x="70" y="1621" font-size="23" fill="#285942" font-weight="700">예상 결과</text><text x="70" y="1665" font-size="36" fill="#253d33" font-weight="400">문의 처리, FAQ 작성, 자료 정리</text><text x="70" y="1713" font-size="36" fill="#253d33" font-weight="400">경험을 희망 직무와 연결합니다.</text><text x="70" y="1761" font-size="36" fill="#253d33" font-weight="400">실제 경험과 학습 계획을 구분하고</text><text x="70" y="1809" font-size="36" fill="#253d33" font-weight="400">매출 성과는 만들지 않습니다.</text><rect x="48" y="1867" width="704" height="166" rx="16" fill="#fff8ec" stroke="#ead7b7"/><text x="70" y="1905" font-size="23" fill="#80520e" font-weight="700">주의할 혼동</text><text x="70" y="1947" font-size="32" fill="#67491c" font-weight="400">경력을 과장하거나 팀 전체 성과를 본인</text><text x="70" y="1991" font-size="32" fill="#67491c" font-weight="400">실적으로 바꿉니다.</text><text x="48" y="2071" font-size="19" fill="#536f61" font-weight="400">본문을 요약한 개념도 · 실제 앱 화면이나 실행 결과가 아닙니다.</text></g></svg>
