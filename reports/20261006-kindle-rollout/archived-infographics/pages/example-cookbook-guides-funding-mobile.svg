<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 2103" width="800" height="2103" role="img" aria-labelledby="title desc"><title id="title">투자 유치 가이드 한눈에 보기</title><desc id="desc">준비할 자료: 사업 지표·투자 단계·검토 질문 / 작업의 핵심: 투자자에게 설명할 질문과 근거를 정리한 뒤 자료를 구성합니다. / 검토 기준: 실적과 전망의 구분·자금 사용 근거를 확인합니다. / 만들 결과: 투자 설명 자료</desc><rect width="800" height="2103" fill="#ffffff"/><g font-family="Apple SD Gothic Neo, Malgun Gothic, Noto Sans KR, sans-serif"><text x="48" y="43" font-size="18" fill="#516e60" font-weight="600">MoAI-Cowork · 한국어 개념 설명</text><text x="48" y="102" font-size="38" fill="#173d2b" font-weight="800">투자 유치 가이드 한눈에 보기</text><text x="48" y="153" font-size="23" fill="#536f61" font-weight="500">업무 순서  ① → ② → ③ → ④</text><rect x="48" y="183" width="704" height="196" rx="20" fill="#edf5f0" stroke="#d6e2d9"/><rect x="68" y="203" width="42" height="36" rx="10" fill="#285942" stroke="none"/><text x="76" y="228" font-size="22" fill="white" font-weight="700">01</text><text x="70" y="277" font-size="36" fill="#285942" font-weight="700">준비할 자료</text><text x="70" y="337" font-size="36" fill="#253d33" font-weight="400">사업 지표·투자 단계·검토 질문</text><rect x="48" y="399" width="704" height="244" rx="20" fill="#ecf3fc" stroke="#d6e2d9"/><rect x="68" y="419" width="42" height="36" rx="10" fill="#245a86" stroke="none"/><text x="76" y="444" font-size="22" fill="white" font-weight="700">02</text><text x="70" y="493" font-size="36" fill="#245a86" font-weight="700">작업의 핵심</text><text x="70" y="553" font-size="36" fill="#253d33" font-weight="400">투자자에게 설명할 질문과 근거를</text><text x="70" y="601" font-size="36" fill="#253d33" font-weight="400">정리한 뒤 자료를 구성합니다.</text><rect x="48" y="663" width="704" height="244" rx="20" fill="#fff5e7" stroke="#d6e2d9"/><rect x="68" y="683" width="42" height="36" rx="10" fill="#8a540a" stroke="none"/><text x="76" y="708" font-size="22" fill="white" font-weight="700">03</text><text x="70" y="757" font-size="36" fill="#8a540a" font-weight="700">검토 기준</text><text x="70" y="817" font-size="36" fill="#253d33" font-weight="400">실적과 전망의 구분·자금 사용</text><text x="70" y="865" font-size="36" fill="#253d33" font-weight="400">근거를 확인합니다.</text><rect x="48" y="927" width="704" height="196" rx="20" fill="#f3effa" stroke="#d6e2d9"/><rect x="68" y="947" width="42" height="36" rx="10" fill="#654395" stroke="none"/><text x="76" y="972" font-size="22" fill="white" font-weight="700">04</text><text x="70" y="1021" font-size="36" fill="#654395" font-weight="700">만들 결과</text><text x="70" y="1081" font-size="36" fill="#253d33" font-weight="400">투자 설명 자료</text><text x="48" y="1174" font-size="29" fill="#173d2b" font-weight="700">가상 예제로 읽어 보기</text><rect x="48" y="1195" width="704" height="320" rx="16" fill="#f8faf8" stroke="#d6e2d9"/><text x="70" y="1237" font-size="23" fill="#285942" font-weight="700">제공 자료</text><text x="70" y="1281" font-size="36" fill="#253d33" font-weight="400">가상 교육 서비스: 대상은 초보</text><text x="70" y="1329" font-size="36" fill="#253d33" font-weight="400">사무직, 해결할 문제는 보고서</text><text x="70" y="1377" font-size="36" fill="#253d33" font-weight="400">작성의 반복 작업. 월 이용료 후보</text><text x="70" y="1425" font-size="36" fill="#253d33" font-weight="400">20,000원, 이용자 수와 유지율은</text><text x="70" y="1473" font-size="36" fill="#253d33" font-weight="400">미검증.</text><rect x="48" y="1531" width="704" height="320" rx="16" fill="#f8faf8" stroke="#d6e2d9"/><text x="70" y="1573" font-size="23" fill="#285942" font-weight="700">예상 결과</text><text x="70" y="1617" font-size="36" fill="#253d33" font-weight="400">고객 문제, 해결안, 수익 가정, 검증</text><text x="70" y="1665" font-size="36" fill="#253d33" font-weight="400">질문을 분리합니다. 이용자 수와</text><text x="70" y="1713" font-size="36" fill="#253d33" font-weight="400">유지율은 미검증 가정으로 남기고</text><text x="70" y="1761" font-size="36" fill="#253d33" font-weight="400">인터뷰·시험 운영의 확인 항목을</text><text x="70" y="1809" font-size="36" fill="#253d33" font-weight="400">정리합니다.</text><rect x="48" y="1867" width="704" height="166" rx="16" fill="#fff8ec" stroke="#ead7b7"/><text x="70" y="1905" font-size="23" fill="#80520e" font-weight="700">주의할 혼동</text><text x="70" y="1947" font-size="32" fill="#67491c" font-weight="400">확인하지 않은 고객 수와 매출을 시장</text><text x="70" y="1991" font-size="32" fill="#67491c" font-weight="400">근거처럼 제시합니다.</text><text x="48" y="2071" font-size="19" fill="#536f61" font-weight="400">본문을 요약한 개념도 · 실제 앱 화면이나 실행 결과가 아닙니다.</text></g></svg>
