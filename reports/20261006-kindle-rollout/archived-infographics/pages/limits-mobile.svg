<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1525" width="800" height="1525" role="img" aria-labelledby="title desc"><title id="title">큰 작업을 확인 가능한 단위로 나누기</title><desc id="desc">결과물 하나 정하기: 이번에 만들 결과와 완료 기준을 정합니다. / 필요한 자료 선택: 목차·범위를 확인하고 필요한 원본을 제공합니다. / 수정할 위치 지정: 전체 재작성보다 틀린 위치와 근거를 알려 줍니다. / 기준과 남은 일 기록: 반복 기준은 지침에, 미완료 업무는 다음 작업에 남깁니다.</desc><rect width="800" height="1525" fill="#ffffff"/><g font-family="Apple SD Gothic Neo, Malgun Gothic, Noto Sans KR, sans-serif"><text x="48" y="43" font-size="18" fill="#516e60" font-weight="600">MoAI-Cowork · 한국어 개념 설명</text><text x="48" y="102" font-size="38" fill="#173d2b" font-weight="800">큰 작업을 확인 가능한 단위로</text><text x="48" y="152" font-size="38" fill="#173d2b" font-weight="800">나누기</text><text x="48" y="203" font-size="23" fill="#536f61" font-weight="500">업무 순서  ① → ② → ③ → ④</text><rect x="48" y="233" width="704" height="244" rx="20" fill="#edf5f0" stroke="#d6e2d9"/><rect x="68" y="253" width="42" height="36" rx="10" fill="#285942" stroke="none"/><text x="76" y="278" font-size="22" fill="white" font-weight="700">01</text><text x="70" y="327" font-size="36" fill="#285942" font-weight="700">결과물 하나 정하기</text><text x="70" y="387" font-size="36" fill="#253d33" font-weight="400">이번에 만들 결과와 완료 기준을</text><text x="70" y="435" font-size="36" fill="#253d33" font-weight="400">정합니다.</text><rect x="48" y="497" width="704" height="244" rx="20" fill="#ecf3fc" stroke="#d6e2d9"/><rect x="68" y="517" width="42" height="36" rx="10" fill="#245a86" stroke="none"/><text x="76" y="542" font-size="22" fill="white" font-weight="700">02</text><text x="70" y="591" font-size="36" fill="#245a86" font-weight="700">필요한 자료 선택</text><text x="70" y="651" font-size="36" fill="#253d33" font-weight="400">목차·범위를 확인하고 필요한 원본을</text><text x="70" y="699" font-size="36" fill="#253d33" font-weight="400">제공합니다.</text><rect x="48" y="761" width="704" height="244" rx="20" fill="#fff5e7" stroke="#d6e2d9"/><rect x="68" y="781" width="42" height="36" rx="10" fill="#8a540a" stroke="none"/><text x="76" y="806" font-size="22" fill="white" font-weight="700">03</text><text x="70" y="855" font-size="36" fill="#8a540a" font-weight="700">수정할 위치 지정</text><text x="70" y="915" font-size="36" fill="#253d33" font-weight="400">전체 재작성보다 틀린 위치와 근거를</text><text x="70" y="963" font-size="36" fill="#253d33" font-weight="400">알려 줍니다.</text><rect x="48" y="1025" width="704" height="244" rx="20" fill="#f3effa" stroke="#d6e2d9"/><rect x="68" y="1045" width="42" height="36" rx="10" fill="#654395" stroke="none"/><text x="76" y="1070" font-size="22" fill="white" font-weight="700">04</text><text x="70" y="1119" font-size="36" fill="#654395" font-weight="700">기준과 남은 일 기록</text><text x="70" y="1179" font-size="36" fill="#253d33" font-weight="400">반복 기준은 지침에, 미완료 업무는</text><text x="70" y="1227" font-size="36" fill="#253d33" font-weight="400">다음 작업에 남깁니다.</text><rect x="48" y="1289" width="704" height="166" rx="16" fill="#fff8ec" stroke="#ead7b7"/><text x="70" y="1327" font-size="23" fill="#80520e" font-weight="700">기억할 기준</text><text x="70" y="1369" font-size="32" fill="#67491c" font-weight="400">계정 사용량 한도와 자료 길이는 별도로</text><text x="70" y="1413" font-size="32" fill="#67491c" font-weight="400">확인합니다.</text><text x="48" y="1493" font-size="19" fill="#536f61" font-weight="400">본문을 요약한 개념도 · 실제 앱 화면이나 실행 결과가 아닙니다.</text></g></svg>
