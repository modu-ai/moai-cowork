<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1427" width="800" height="1427" role="img" aria-labelledby="title desc"><title id="title">결과물로 실습과 역할을 고르세요</title><desc id="desc">보고·기획·문서: 보고서와 문서 파일 → 코워커·사무관 실습 / 콘텐츠·시안: 글·캠페인·발표 → 작가·마케터·디자이너 실습 / 분석·고객지원: 표·자료·FAQ → 애널리스트·CS 실습 / 여러 분야의 프로젝트: 역할과 인계 조건을 PM으로 정리합니다.</desc><rect width="800" height="1427" fill="#ffffff"/><g font-family="Apple SD Gothic Neo, Malgun Gothic, Noto Sans KR, sans-serif"><text x="48" y="43" font-size="18" fill="#516e60" font-weight="600">MoAI-Cowork · 한국어 개념 설명</text><text x="48" y="102" font-size="38" fill="#173d2b" font-weight="800">결과물로 실습과 역할을 고르세요</text><text x="48" y="153" font-size="23" fill="#536f61" font-weight="500">비슷해 보여도 서로 다른 네 가지</text><rect x="48" y="183" width="704" height="244" rx="20" fill="#edf5f0" stroke="#d6e2d9"/><rect x="68" y="203" width="42" height="36" rx="10" fill="#285942" stroke="none"/><text x="76" y="228" font-size="22" fill="white" font-weight="700">01</text><text x="70" y="277" font-size="36" fill="#285942" font-weight="700">보고·기획·문서</text><text x="70" y="337" font-size="36" fill="#253d33" font-weight="400">보고서와 문서 파일 → 코워커·사무관</text><text x="70" y="385" font-size="36" fill="#253d33" font-weight="400">실습</text><rect x="48" y="447" width="704" height="244" rx="20" fill="#ecf3fc" stroke="#d6e2d9"/><rect x="68" y="467" width="42" height="36" rx="10" fill="#245a86" stroke="none"/><text x="76" y="492" font-size="22" fill="white" font-weight="700">02</text><text x="70" y="541" font-size="36" fill="#245a86" font-weight="700">콘텐츠·시안</text><text x="70" y="601" font-size="36" fill="#253d33" font-weight="400">글·캠페인·발표 →</text><text x="70" y="649" font-size="36" fill="#253d33" font-weight="400">작가·마케터·디자이너 실습</text><rect x="48" y="711" width="704" height="196" rx="20" fill="#fff5e7" stroke="#d6e2d9"/><rect x="68" y="731" width="42" height="36" rx="10" fill="#8a540a" stroke="none"/><text x="76" y="756" font-size="22" fill="white" font-weight="700">03</text><text x="70" y="805" font-size="36" fill="#8a540a" font-weight="700">분석·고객지원</text><text x="70" y="865" font-size="36" fill="#253d33" font-weight="400">표·자료·FAQ → 애널리스트·CS 실습</text><rect x="48" y="927" width="704" height="244" rx="20" fill="#f3effa" stroke="#d6e2d9"/><rect x="68" y="947" width="42" height="36" rx="10" fill="#654395" stroke="none"/><text x="76" y="972" font-size="22" fill="white" font-weight="700">04</text><text x="70" y="1021" font-size="36" fill="#654395" font-weight="700">여러 분야의 프로젝트</text><text x="70" y="1081" font-size="36" fill="#253d33" font-weight="400">역할과 인계 조건을 PM으로</text><text x="70" y="1129" font-size="36" fill="#253d33" font-weight="400">정리합니다.</text><rect x="48" y="1191" width="704" height="166" rx="16" fill="#fff8ec" stroke="#ead7b7"/><text x="70" y="1229" font-size="23" fill="#80520e" font-weight="700">기억할 기준</text><text x="70" y="1271" font-size="32" fill="#67491c" font-weight="400">선택 후보를 현재 설치·노출된 기능과</text><text x="70" y="1315" font-size="32" fill="#67491c" font-weight="400">비교하고 작은 결과부터 확인하세요.</text><text x="48" y="1395" font-size="19" fill="#536f61" font-weight="400">본문을 요약한 개념도 · 실제 앱 화면이나 실행 결과가 아닙니다.</text></g></svg>
