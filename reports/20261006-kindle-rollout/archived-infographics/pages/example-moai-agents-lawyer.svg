<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1443" width="800" height="1443" role="img" aria-labelledby="title desc"><title id="title">법무 담당 한눈에 보기</title><desc id="desc">준비할 자료: 문서·관할·검토 목적 / 작업의 핵심: 이 문서에서 확인할 쟁점을 정리해 줘. 해당 조항과 출처를 함께 표시해 줘. / 검토 기준: 제공 자료와 결과를 비교하고 미정 항목을 구분합니다. / 만들 결과: 조항별 쟁점과 근거 목록</desc><rect width="800" height="1443" fill="#ffffff"/><g font-family="Apple SD Gothic Neo, Malgun Gothic, Noto Sans KR, sans-serif"><text x="48" y="43" font-size="18" fill="#516e60" font-weight="600">MoAI-Cowork · 한국어 개념 설명</text><text x="48" y="102" font-size="38" fill="#173d2b" font-weight="800">법무 담당 한눈에 보기</text><text x="48" y="153" font-size="23" fill="#536f61" font-weight="500">업무 순서  ① → ② → ③ → ④</text><rect x="48" y="183" width="336" height="267" rx="20" fill="#edf5f0" stroke="#d6e2d9"/><rect x="68" y="203" width="42" height="36" rx="10" fill="#285942" stroke="none"/><text x="76" y="228" font-size="22" fill="white" font-weight="700">01</text><text x="70" y="277" font-size="28" fill="#285942" font-weight="700">준비할 자료</text><text x="70" y="328" font-size="26" fill="#253d33" font-weight="400">문서·관할·검토 목적</text><rect x="416" y="183" width="336" height="267" rx="20" fill="#ecf3fc" stroke="#d6e2d9"/><rect x="436" y="203" width="42" height="36" rx="10" fill="#245a86" stroke="none"/><text x="444" y="228" font-size="22" fill="white" font-weight="700">02</text><text x="438" y="277" font-size="28" fill="#245a86" font-weight="700">작업의 핵심</text><text x="438" y="328" font-size="26" fill="#253d33" font-weight="400">이 문서에서 확인할</text><text x="438" y="365" font-size="26" fill="#253d33" font-weight="400">쟁점을 정리해 줘. 해당</text><text x="438" y="402" font-size="26" fill="#253d33" font-weight="400">조항과 출처를 함께</text><text x="438" y="439" font-size="26" fill="#253d33" font-weight="400">표시해 줘.</text><rect x="48" y="470" width="336" height="230" rx="20" fill="#fff5e7" stroke="#d6e2d9"/><rect x="68" y="490" width="42" height="36" rx="10" fill="#8a540a" stroke="none"/><text x="76" y="515" font-size="22" fill="white" font-weight="700">03</text><text x="70" y="564" font-size="28" fill="#8a540a" font-weight="700">검토 기준</text><text x="70" y="615" font-size="26" fill="#253d33" font-weight="400">제공 자료와 결과를</text><text x="70" y="652" font-size="26" fill="#253d33" font-weight="400">비교하고 미정 항목을</text><text x="70" y="689" font-size="26" fill="#253d33" font-weight="400">구분합니다.</text><rect x="416" y="470" width="336" height="230" rx="20" fill="#f3effa" stroke="#d6e2d9"/><rect x="436" y="490" width="42" height="36" rx="10" fill="#654395" stroke="none"/><text x="444" y="515" font-size="22" fill="white" font-weight="700">04</text><text x="438" y="564" font-size="28" fill="#654395" font-weight="700">만들 결과</text><text x="438" y="615" font-size="26" fill="#253d33" font-weight="400">조항별 쟁점과 근거</text><text x="438" y="652" font-size="26" fill="#253d33" font-weight="400">목록</text><text x="48" y="751" font-size="29" fill="#173d2b" font-weight="700">가상 예제로 읽어 보기</text><rect x="48" y="772" width="704" height="191" rx="16" fill="#f8faf8" stroke="#d6e2d9"/><text x="70" y="814" font-size="23" fill="#285942" font-weight="700">제공 자료</text><text x="70" y="858" font-size="26" fill="#253d33" font-weight="400">가상 조항: 제3조 대금은 300,000원. 지급 기한은</text><text x="70" y="895" font-size="26" fill="#253d33" font-weight="400">공란. 제4조 결과물 수정 횟수는 협의. 당사자와</text><text x="70" y="932" font-size="26" fill="#253d33" font-weight="400">관할은 미정.</text><rect x="48" y="979" width="704" height="228" rx="16" fill="#f8faf8" stroke="#d6e2d9"/><text x="70" y="1021" font-size="23" fill="#285942" font-weight="700">예상 결과</text><text x="70" y="1065" font-size="26" fill="#253d33" font-weight="400">제3조의 지급 기한 공란과 제4조의 수정 범위</text><text x="70" y="1102" font-size="26" fill="#253d33" font-weight="400">미정을 쟁점으로 적습니다. 조항 번호와 원문,</text><text x="70" y="1139" font-size="26" fill="#253d33" font-weight="400">필요한 합의 정보를 함께 표시합니다. 법적 효력은</text><text x="70" y="1176" font-size="26" fill="#253d33" font-weight="400">확정하지 않습니다.</text><rect x="48" y="1223" width="704" height="150" rx="16" fill="#fff8ec" stroke="#ead7b7"/><text x="70" y="1261" font-size="23" fill="#80520e" font-weight="700">주의할 혼동</text><text x="70" y="1303" font-size="25" fill="#67491c" font-weight="400">합의하지 않은 기한을 채우거나 관할을 모른 채</text><text x="70" y="1339" font-size="25" fill="#67491c" font-weight="400">적법하다고 결론 냅니다.</text><text x="48" y="1411" font-size="19" fill="#536f61" font-weight="400">본문을 요약한 개념도 · 실제 앱 화면이나 실행 결과가 아닙니다.</text></g></svg>
