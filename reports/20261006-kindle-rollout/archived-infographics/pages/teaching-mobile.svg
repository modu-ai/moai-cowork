<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1569" width="800" height="1569" role="img" aria-labelledby="title desc"><title id="title">설명에서 직접 수행까지 이어지는 수업</title><desc id="desc">개념 설명과 시연: 그림의 관계를 짚고 같은 가상 자료로 예제를 보여 줍니다. / 수강생 개별 실습: 직접 요청하고 필요한 질문에 답하게 합니다. / 원문과 결과 비교: 숫자·미정 상태·정책 근거를 비교하게 합니다. / 해설과 내 업무 과제: 답의 이유를 설명하고 자기 업무의 검토 기준을 작성합니다.</desc><rect width="800" height="1569" fill="#ffffff"/><g font-family="Apple SD Gothic Neo, Malgun Gothic, Noto Sans KR, sans-serif"><text x="48" y="43" font-size="18" fill="#516e60" font-weight="600">MoAI-Cowork · 한국어 개념 설명</text><text x="48" y="102" font-size="38" fill="#173d2b" font-weight="800">설명에서 직접 수행까지 이어지는</text><text x="48" y="152" font-size="38" fill="#173d2b" font-weight="800">수업</text><text x="48" y="203" font-size="23" fill="#536f61" font-weight="500">업무 순서  ① → ② → ③ → ④</text><rect x="48" y="233" width="704" height="244" rx="20" fill="#edf5f0" stroke="#d6e2d9"/><rect x="68" y="253" width="42" height="36" rx="10" fill="#285942" stroke="none"/><text x="76" y="278" font-size="22" fill="white" font-weight="700">01</text><text x="70" y="327" font-size="36" fill="#285942" font-weight="700">개념 설명과 시연</text><text x="70" y="387" font-size="36" fill="#253d33" font-weight="400">그림의 관계를 짚고 같은 가상</text><text x="70" y="435" font-size="36" fill="#253d33" font-weight="400">자료로 예제를 보여 줍니다.</text><rect x="48" y="497" width="704" height="244" rx="20" fill="#ecf3fc" stroke="#d6e2d9"/><rect x="68" y="517" width="42" height="36" rx="10" fill="#245a86" stroke="none"/><text x="76" y="542" font-size="22" fill="white" font-weight="700">02</text><text x="70" y="591" font-size="36" fill="#245a86" font-weight="700">수강생 개별 실습</text><text x="70" y="651" font-size="36" fill="#253d33" font-weight="400">직접 요청하고 필요한 질문에 답하게</text><text x="70" y="699" font-size="36" fill="#253d33" font-weight="400">합니다.</text><rect x="48" y="761" width="704" height="244" rx="20" fill="#fff5e7" stroke="#d6e2d9"/><rect x="68" y="781" width="42" height="36" rx="10" fill="#8a540a" stroke="none"/><text x="76" y="806" font-size="22" fill="white" font-weight="700">03</text><text x="70" y="855" font-size="36" fill="#8a540a" font-weight="700">원문과 결과 비교</text><text x="70" y="915" font-size="36" fill="#253d33" font-weight="400">숫자·미정 상태·정책 근거를</text><text x="70" y="963" font-size="36" fill="#253d33" font-weight="400">비교하게 합니다.</text><rect x="48" y="1025" width="704" height="244" rx="20" fill="#f3effa" stroke="#d6e2d9"/><rect x="68" y="1045" width="42" height="36" rx="10" fill="#654395" stroke="none"/><text x="76" y="1070" font-size="22" fill="white" font-weight="700">04</text><text x="70" y="1119" font-size="36" fill="#654395" font-weight="700">해설과 내 업무 과제</text><text x="70" y="1179" font-size="36" fill="#253d33" font-weight="400">답의 이유를 설명하고 자기 업무의</text><text x="70" y="1227" font-size="36" fill="#253d33" font-weight="400">검토 기준을 작성합니다.</text><rect x="48" y="1289" width="704" height="210" rx="16" fill="#fff8ec" stroke="#ead7b7"/><text x="70" y="1327" font-size="23" fill="#80520e" font-weight="700">기억할 기준</text><text x="70" y="1369" font-size="32" fill="#67491c" font-weight="400">모범 결과와 수강생의 실제 수행은</text><text x="70" y="1413" font-size="32" fill="#67491c" font-weight="400">구분합니다. 앱이 막히면 미실행 상태를</text><text x="70" y="1457" font-size="32" fill="#67491c" font-weight="400">기록합니다.</text><text x="48" y="1537" font-size="19" fill="#536f61" font-weight="400">본문을 요약한 개념도 · 실제 앱 화면이나 실행 결과가 아닙니다.</text></g></svg>
