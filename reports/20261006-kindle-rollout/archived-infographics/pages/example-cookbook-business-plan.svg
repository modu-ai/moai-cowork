<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1406" width="800" height="1406" role="img" aria-labelledby="title desc"><title id="title">사업계획서 자동화 한눈에 보기</title><desc id="desc">준비할 자료: 사업 개요·고객·수익 구조·근거 자료 / 작업의 핵심: 고객 문제, 해결책, 운영 방식, 재무 가정을 구분해 작성합니다. / 검토 기준: 시장 수치 출처·가정·수익 계산을 확인합니다. / 만들 결과: 사업계획서 초안</desc><rect width="800" height="1406" fill="#ffffff"/><g font-family="Apple SD Gothic Neo, Malgun Gothic, Noto Sans KR, sans-serif"><text x="48" y="43" font-size="18" fill="#516e60" font-weight="600">MoAI-Cowork · 한국어 개념 설명</text><text x="48" y="102" font-size="38" fill="#173d2b" font-weight="800">사업계획서 자동화 한눈에 보기</text><text x="48" y="153" font-size="23" fill="#536f61" font-weight="500">업무 순서  ① → ② → ③ → ④</text><rect x="48" y="183" width="336" height="230" rx="20" fill="#edf5f0" stroke="#d6e2d9"/><rect x="68" y="203" width="42" height="36" rx="10" fill="#285942" stroke="none"/><text x="76" y="228" font-size="22" fill="white" font-weight="700">01</text><text x="70" y="277" font-size="28" fill="#285942" font-weight="700">준비할 자료</text><text x="70" y="328" font-size="26" fill="#253d33" font-weight="400">사업 개요·고객·수익</text><text x="70" y="365" font-size="26" fill="#253d33" font-weight="400">구조·근거 자료</text><rect x="416" y="183" width="336" height="230" rx="20" fill="#ecf3fc" stroke="#d6e2d9"/><rect x="436" y="203" width="42" height="36" rx="10" fill="#245a86" stroke="none"/><text x="444" y="228" font-size="22" fill="white" font-weight="700">02</text><text x="438" y="277" font-size="28" fill="#245a86" font-weight="700">작업의 핵심</text><text x="438" y="328" font-size="26" fill="#253d33" font-weight="400">고객 문제, 해결책,</text><text x="438" y="365" font-size="26" fill="#253d33" font-weight="400">운영 방식, 재무 가정을</text><text x="438" y="402" font-size="26" fill="#253d33" font-weight="400">구분해 작성합니다.</text><rect x="48" y="433" width="336" height="230" rx="20" fill="#fff5e7" stroke="#d6e2d9"/><rect x="68" y="453" width="42" height="36" rx="10" fill="#8a540a" stroke="none"/><text x="76" y="478" font-size="22" fill="white" font-weight="700">03</text><text x="70" y="527" font-size="28" fill="#8a540a" font-weight="700">검토 기준</text><text x="70" y="578" font-size="26" fill="#253d33" font-weight="400">시장 수치</text><text x="70" y="615" font-size="26" fill="#253d33" font-weight="400">출처·가정·수익 계산을</text><text x="70" y="652" font-size="26" fill="#253d33" font-weight="400">확인합니다.</text><rect x="416" y="433" width="336" height="230" rx="20" fill="#f3effa" stroke="#d6e2d9"/><rect x="436" y="453" width="42" height="36" rx="10" fill="#654395" stroke="none"/><text x="444" y="478" font-size="22" fill="white" font-weight="700">04</text><text x="438" y="527" font-size="28" fill="#654395" font-weight="700">만들 결과</text><text x="438" y="578" font-size="26" fill="#253d33" font-weight="400">사업계획서 초안</text><text x="48" y="714" font-size="29" fill="#173d2b" font-weight="700">가상 예제로 읽어 보기</text><rect x="48" y="735" width="704" height="191" rx="16" fill="#f8faf8" stroke="#d6e2d9"/><text x="70" y="777" font-size="23" fill="#285942" font-weight="700">제공 자료</text><text x="70" y="821" font-size="26" fill="#253d33" font-weight="400">가상 교육 서비스: 대상은 초보 사무직, 해결할</text><text x="70" y="858" font-size="26" fill="#253d33" font-weight="400">문제는 보고서 작성의 반복 작업. 월 이용료 후보</text><text x="70" y="895" font-size="26" fill="#253d33" font-weight="400">20,000원, 이용자 수와 유지율은 미검증.</text><rect x="48" y="942" width="704" height="228" rx="16" fill="#f8faf8" stroke="#d6e2d9"/><text x="70" y="984" font-size="23" fill="#285942" font-weight="700">예상 결과</text><text x="70" y="1028" font-size="26" fill="#253d33" font-weight="400">고객 문제, 해결안, 수익 가정, 검증 질문을</text><text x="70" y="1065" font-size="26" fill="#253d33" font-weight="400">분리합니다. 이용자 수와 유지율은 미검증 가정으로</text><text x="70" y="1102" font-size="26" fill="#253d33" font-weight="400">남기고 인터뷰·시험 운영의 확인 항목을</text><text x="70" y="1139" font-size="26" fill="#253d33" font-weight="400">정리합니다.</text><rect x="48" y="1186" width="704" height="150" rx="16" fill="#fff8ec" stroke="#ead7b7"/><text x="70" y="1224" font-size="23" fill="#80520e" font-weight="700">주의할 혼동</text><text x="70" y="1266" font-size="25" fill="#67491c" font-weight="400">확인하지 않은 고객 수와 매출을 시장 근거처럼</text><text x="70" y="1302" font-size="25" fill="#67491c" font-weight="400">제시합니다.</text><text x="48" y="1374" font-size="19" fill="#536f61" font-weight="400">본문을 요약한 개념도 · 실제 앱 화면이나 실행 결과가 아닙니다.</text></g></svg>
