<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1475" width="800" height="1475" role="img" aria-labelledby="title desc"><title id="title">무료 패키지와 서비스 비용은 별개</title><desc id="desc">MoAI 패키지: 플러그인 소스의 이용 조건을 확인합니다. / AI 앱 이용: 본인 계정의 현재 요금제와 지원 범위를 확인합니다. / 외부 생성 서비스: 이미지·영상 등 서비스의 크레딧과 사용량을 확인합니다. / API·조직 설정: API 청구·한도와 조직의 관리 조건을 확인합니다.</desc><rect width="800" height="1475" fill="#ffffff"/><g font-family="Apple SD Gothic Neo, Malgun Gothic, Noto Sans KR, sans-serif"><text x="48" y="43" font-size="18" fill="#516e60" font-weight="600">MoAI-Cowork · 한국어 개념 설명</text><text x="48" y="102" font-size="38" fill="#173d2b" font-weight="800">무료 패키지와 서비스 비용은 별개</text><text x="48" y="153" font-size="23" fill="#536f61" font-weight="500">비슷해 보여도 서로 다른 네 가지</text><rect x="48" y="183" width="704" height="244" rx="20" fill="#edf5f0" stroke="#d6e2d9"/><rect x="68" y="203" width="42" height="36" rx="10" fill="#285942" stroke="none"/><text x="76" y="228" font-size="22" fill="white" font-weight="700">01</text><text x="70" y="277" font-size="36" fill="#285942" font-weight="700">MoAI 패키지</text><text x="70" y="337" font-size="36" fill="#253d33" font-weight="400">플러그인 소스의 이용 조건을</text><text x="70" y="385" font-size="36" fill="#253d33" font-weight="400">확인합니다.</text><rect x="48" y="447" width="704" height="244" rx="20" fill="#ecf3fc" stroke="#d6e2d9"/><rect x="68" y="467" width="42" height="36" rx="10" fill="#245a86" stroke="none"/><text x="76" y="492" font-size="22" fill="white" font-weight="700">02</text><text x="70" y="541" font-size="36" fill="#245a86" font-weight="700">AI 앱 이용</text><text x="70" y="601" font-size="36" fill="#253d33" font-weight="400">본인 계정의 현재 요금제와 지원</text><text x="70" y="649" font-size="36" fill="#253d33" font-weight="400">범위를 확인합니다.</text><rect x="48" y="711" width="704" height="244" rx="20" fill="#fff5e7" stroke="#d6e2d9"/><rect x="68" y="731" width="42" height="36" rx="10" fill="#8a540a" stroke="none"/><text x="76" y="756" font-size="22" fill="white" font-weight="700">03</text><text x="70" y="805" font-size="36" fill="#8a540a" font-weight="700">외부 생성 서비스</text><text x="70" y="865" font-size="36" fill="#253d33" font-weight="400">이미지·영상 등 서비스의 크레딧과</text><text x="70" y="913" font-size="36" fill="#253d33" font-weight="400">사용량을 확인합니다.</text><rect x="48" y="975" width="704" height="244" rx="20" fill="#f3effa" stroke="#d6e2d9"/><rect x="68" y="995" width="42" height="36" rx="10" fill="#654395" stroke="none"/><text x="76" y="1020" font-size="22" fill="white" font-weight="700">04</text><text x="70" y="1069" font-size="36" fill="#654395" font-weight="700">API·조직 설정</text><text x="70" y="1129" font-size="36" fill="#253d33" font-weight="400">API 청구·한도와 조직의 관리 조건을</text><text x="70" y="1177" font-size="36" fill="#253d33" font-weight="400">확인합니다.</text><rect x="48" y="1239" width="704" height="166" rx="16" fill="#fff8ec" stroke="#ead7b7"/><text x="70" y="1277" font-size="23" fill="#80520e" font-weight="700">기억할 기준</text><text x="70" y="1319" font-size="32" fill="#67491c" font-weight="400">첫 실습은 가상 텍스트로 시작합니다.</text><text x="70" y="1363" font-size="32" fill="#67491c" font-weight="400">가격을 그림에 고정하지 않습니다.</text><text x="48" y="1443" font-size="19" fill="#536f61" font-weight="400">본문을 요약한 개념도 · 실제 앱 화면이나 실행 결과가 아닙니다.</text></g></svg>
