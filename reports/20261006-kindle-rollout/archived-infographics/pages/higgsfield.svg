<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 940" width="800" height="940" role="img" aria-labelledby="title desc"><title id="title">생성 도구 연결과 제작을 분리</title><desc id="desc">목적과 기능 확인: 만들 이미지·영상과 현재 제공되는 도구를 확인합니다. / 제품별 연결 경로: Claude의 공식 MCP, ChatGPT의 공식 플러그인 경로를 확인합니다. / 계정과 사용 범위: 로그인·이용 조건·크레딧과 실행 범위를 확인합니다. / 작은 결과 검토: 실제 생성 결과의 글자·형태·권리와 저장 파일을 확인합니다.</desc><rect width="800" height="940" fill="#ffffff"/><g font-family="Apple SD Gothic Neo, Malgun Gothic, Noto Sans KR, sans-serif"><text x="48" y="43" font-size="18" fill="#516e60" font-weight="600">MoAI-Cowork · 한국어 개념 설명</text><text x="48" y="102" font-size="38" fill="#173d2b" font-weight="800">생성 도구 연결과 제작을 분리</text><text x="48" y="153" font-size="23" fill="#536f61" font-weight="500">업무 순서  ① → ② → ③ → ④</text><rect x="48" y="183" width="336" height="267" rx="20" fill="#edf5f0" stroke="#d6e2d9"/><rect x="68" y="203" width="42" height="36" rx="10" fill="#285942" stroke="none"/><text x="76" y="228" font-size="22" fill="white" font-weight="700">01</text><text x="70" y="277" font-size="28" fill="#285942" font-weight="700">목적과 기능 확인</text><text x="70" y="328" font-size="26" fill="#253d33" font-weight="400">만들 이미지·영상과</text><text x="70" y="365" font-size="26" fill="#253d33" font-weight="400">현재 제공되는 도구를</text><text x="70" y="402" font-size="26" fill="#253d33" font-weight="400">확인합니다.</text><rect x="416" y="183" width="336" height="267" rx="20" fill="#ecf3fc" stroke="#d6e2d9"/><rect x="436" y="203" width="42" height="36" rx="10" fill="#245a86" stroke="none"/><text x="444" y="228" font-size="22" fill="white" font-weight="700">02</text><text x="438" y="277" font-size="28" fill="#245a86" font-weight="700">제품별 연결 경로</text><text x="438" y="328" font-size="26" fill="#253d33" font-weight="400">Claude의 공식 MCP,</text><text x="438" y="365" font-size="26" fill="#253d33" font-weight="400">ChatGPT의 공식</text><text x="438" y="402" font-size="26" fill="#253d33" font-weight="400">플러그인 경로를</text><text x="438" y="439" font-size="26" fill="#253d33" font-weight="400">확인합니다.</text><rect x="48" y="470" width="336" height="230" rx="20" fill="#fff5e7" stroke="#d6e2d9"/><rect x="68" y="490" width="42" height="36" rx="10" fill="#8a540a" stroke="none"/><text x="76" y="515" font-size="22" fill="white" font-weight="700">03</text><text x="70" y="564" font-size="28" fill="#8a540a" font-weight="700">계정과 사용 범위</text><text x="70" y="615" font-size="26" fill="#253d33" font-weight="400">로그인·이용</text><text x="70" y="652" font-size="26" fill="#253d33" font-weight="400">조건·크레딧과 실행</text><text x="70" y="689" font-size="26" fill="#253d33" font-weight="400">범위를 확인합니다.</text><rect x="416" y="470" width="336" height="230" rx="20" fill="#f3effa" stroke="#d6e2d9"/><rect x="436" y="490" width="42" height="36" rx="10" fill="#654395" stroke="none"/><text x="444" y="515" font-size="22" fill="white" font-weight="700">04</text><text x="438" y="564" font-size="28" fill="#654395" font-weight="700">작은 결과 검토</text><text x="438" y="615" font-size="26" fill="#253d33" font-weight="400">실제 생성 결과의</text><text x="438" y="652" font-size="26" fill="#253d33" font-weight="400">글자·형태·권리와 저장</text><text x="438" y="689" font-size="26" fill="#253d33" font-weight="400">파일을 확인합니다.</text><rect x="48" y="720" width="704" height="150" rx="16" fill="#fff8ec" stroke="#ead7b7"/><text x="70" y="758" font-size="23" fill="#80520e" font-weight="700">기억할 기준</text><text x="70" y="800" font-size="25" fill="#67491c" font-weight="400">설정과 제작 성공은 다릅니다. 지원 기능·비용은</text><text x="70" y="836" font-size="25" fill="#67491c" font-weight="400">현재 공식 안내에서 확인하세요.</text><text x="48" y="908" font-size="19" fill="#536f61" font-weight="400">본문을 요약한 개념도 · 실제 앱 화면이나 실행 결과가 아닙니다.</text></g></svg>
