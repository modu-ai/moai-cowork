<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1406" width="800" height="1406" role="img" aria-labelledby="title desc"><title id="title">미디어 크리에이터 한눈에 보기</title><desc id="desc">준비할 자료: 제작 목적·장면·형식·참고 자료 / 작업의 핵심: 이 자료로 이미지 제작안을 작성합니다. 실제 생성 도구와 비용 조건은 먼저 확인해 줘. / 검토 기준: 제공 자료와 결과를 비교하고 미정 항목을 구분합니다. / 만들 결과: 이미지·영상 제작안 또는 지원되는 생성 결과</desc><rect width="800" height="1406" fill="#ffffff"/><g font-family="Apple SD Gothic Neo, Malgun Gothic, Noto Sans KR, sans-serif"><text x="48" y="43" font-size="18" fill="#516e60" font-weight="600">MoAI-Cowork · 한국어 개념 설명</text><text x="48" y="102" font-size="38" fill="#173d2b" font-weight="800">미디어 크리에이터 한눈에 보기</text><text x="48" y="153" font-size="23" fill="#536f61" font-weight="500">업무 순서  ① → ② → ③ → ④</text><rect x="48" y="183" width="336" height="267" rx="20" fill="#edf5f0" stroke="#d6e2d9"/><rect x="68" y="203" width="42" height="36" rx="10" fill="#285942" stroke="none"/><text x="76" y="228" font-size="22" fill="white" font-weight="700">01</text><text x="70" y="277" font-size="28" fill="#285942" font-weight="700">준비할 자료</text><text x="70" y="328" font-size="26" fill="#253d33" font-weight="400">제작</text><text x="70" y="365" font-size="26" fill="#253d33" font-weight="400">목적·장면·형식·참고</text><text x="70" y="402" font-size="26" fill="#253d33" font-weight="400">자료</text><rect x="416" y="183" width="336" height="267" rx="20" fill="#ecf3fc" stroke="#d6e2d9"/><rect x="436" y="203" width="42" height="36" rx="10" fill="#245a86" stroke="none"/><text x="444" y="228" font-size="22" fill="white" font-weight="700">02</text><text x="438" y="277" font-size="28" fill="#245a86" font-weight="700">작업의 핵심</text><text x="438" y="328" font-size="26" fill="#253d33" font-weight="400">이 자료로 이미지</text><text x="438" y="365" font-size="26" fill="#253d33" font-weight="400">제작안을 작성합니다.</text><text x="438" y="402" font-size="26" fill="#253d33" font-weight="400">실제 생성 도구와 비용</text><text x="438" y="439" font-size="26" fill="#253d33" font-weight="400">조건은 먼저 확인해 줘.</text><rect x="48" y="470" width="336" height="230" rx="20" fill="#fff5e7" stroke="#d6e2d9"/><rect x="68" y="490" width="42" height="36" rx="10" fill="#8a540a" stroke="none"/><text x="76" y="515" font-size="22" fill="white" font-weight="700">03</text><text x="70" y="564" font-size="28" fill="#8a540a" font-weight="700">검토 기준</text><text x="70" y="615" font-size="26" fill="#253d33" font-weight="400">제공 자료와 결과를</text><text x="70" y="652" font-size="26" fill="#253d33" font-weight="400">비교하고 미정 항목을</text><text x="70" y="689" font-size="26" fill="#253d33" font-weight="400">구분합니다.</text><rect x="416" y="470" width="336" height="230" rx="20" fill="#f3effa" stroke="#d6e2d9"/><rect x="436" y="490" width="42" height="36" rx="10" fill="#654395" stroke="none"/><text x="444" y="515" font-size="22" fill="white" font-weight="700">04</text><text x="438" y="564" font-size="28" fill="#654395" font-weight="700">만들 결과</text><text x="438" y="615" font-size="26" fill="#253d33" font-weight="400">이미지·영상 제작안</text><text x="438" y="652" font-size="26" fill="#253d33" font-weight="400">또는 지원되는 생성</text><text x="438" y="689" font-size="26" fill="#253d33" font-weight="400">결과</text><text x="48" y="751" font-size="29" fill="#173d2b" font-weight="700">가상 예제로 읽어 보기</text><rect x="48" y="772" width="704" height="191" rx="16" fill="#f8faf8" stroke="#d6e2d9"/><text x="70" y="814" font-size="23" fill="#285942" font-weight="700">제공 자료</text><text x="70" y="858" font-size="26" fill="#253d33" font-weight="400">가상 이미지 요청: 고객 문의 업무를 설명하는</text><text x="70" y="895" font-size="26" fill="#253d33" font-weight="400">한국어 개념 그림. 실제 앱 화면을 흉내 내지</text><text x="70" y="932" font-size="26" fill="#253d33" font-weight="400">않으며 제목과 흐름이 읽혀야 함.</text><rect x="48" y="979" width="704" height="191" rx="16" fill="#f8faf8" stroke="#d6e2d9"/><text x="70" y="1021" font-size="23" fill="#285942" font-weight="700">예상 결과</text><text x="70" y="1065" font-size="26" fill="#253d33" font-weight="400">개념도에는 목표·자료·질문·검토를 배치합니다.</text><text x="70" y="1102" font-size="26" fill="#253d33" font-weight="400">실제 UI 안내는 직접 촬영한 화면을 사용하며</text><text x="70" y="1139" font-size="26" fill="#253d33" font-weight="400">글자와 화살표를 검토합니다.</text><rect x="48" y="1186" width="704" height="150" rx="16" fill="#fff8ec" stroke="#ead7b7"/><text x="70" y="1224" font-size="23" fill="#80520e" font-weight="700">주의할 혼동</text><text x="70" y="1266" font-size="25" fill="#67491c" font-weight="400">생성한 화면을 실제 앱 스크린샷으로 표시하거나</text><text x="70" y="1302" font-size="25" fill="#67491c" font-weight="400">한국어 오타가 있는 이미지를 바로 사용합니다.</text><text x="48" y="1374" font-size="19" fill="#536f61" font-weight="400">본문을 요약한 개념도 · 실제 앱 화면이나 실행 결과가 아닙니다.</text></g></svg>
