<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 940" width="800" height="940" role="img" aria-labelledby="title desc"><title id="title">계정별 인증 정보와 조회를 분리</title><desc id="desc">서비스와 계정 선택: 어느 프로젝트에서 어떤 계정 자료가 필요한지 정합니다. / 지원되는 경로로 설정: 비밀정보 입력란 또는 해당 서버의 자격증명 파일을 사용합니다. / 읽기 전용 조회: 키 이름·권한·만료와 실제 연결 계정을 확인합니다. / 계정과 결과 비교: 올바른 계정·기간의 결과인지 확인하고 빈 결과와 오류를 구분합니다.</desc><rect width="800" height="940" fill="#ffffff"/><g font-family="Apple SD Gothic Neo, Malgun Gothic, Noto Sans KR, sans-serif"><text x="48" y="43" font-size="18" fill="#516e60" font-weight="600">MoAI-Cowork · 한국어 개념 설명</text><text x="48" y="102" font-size="38" fill="#173d2b" font-weight="800">계정별 인증 정보와 조회를 분리</text><text x="48" y="153" font-size="23" fill="#536f61" font-weight="500">업무 순서  ① → ② → ③ → ④</text><rect x="48" y="183" width="336" height="230" rx="20" fill="#edf5f0" stroke="#d6e2d9"/><rect x="68" y="203" width="42" height="36" rx="10" fill="#285942" stroke="none"/><text x="76" y="228" font-size="22" fill="white" font-weight="700">01</text><text x="70" y="277" font-size="28" fill="#285942" font-weight="700">서비스와 계정 선택</text><text x="70" y="328" font-size="26" fill="#253d33" font-weight="400">어느 프로젝트에서 어떤</text><text x="70" y="365" font-size="26" fill="#253d33" font-weight="400">계정 자료가 필요한지</text><text x="70" y="402" font-size="26" fill="#253d33" font-weight="400">정합니다.</text><rect x="416" y="183" width="336" height="230" rx="20" fill="#ecf3fc" stroke="#d6e2d9"/><rect x="436" y="203" width="42" height="36" rx="10" fill="#245a86" stroke="none"/><text x="444" y="228" font-size="22" fill="white" font-weight="700">02</text><text x="438" y="277" font-size="28" fill="#245a86" font-weight="700">지원되는 경로로 설정</text><text x="438" y="328" font-size="26" fill="#253d33" font-weight="400">비밀정보 입력란 또는</text><text x="438" y="365" font-size="26" fill="#253d33" font-weight="400">해당 서버의 자격증명</text><text x="438" y="402" font-size="26" fill="#253d33" font-weight="400">파일을 사용합니다.</text><rect x="48" y="433" width="336" height="267" rx="20" fill="#fff5e7" stroke="#d6e2d9"/><rect x="68" y="453" width="42" height="36" rx="10" fill="#8a540a" stroke="none"/><text x="76" y="478" font-size="22" fill="white" font-weight="700">03</text><text x="70" y="527" font-size="28" fill="#8a540a" font-weight="700">읽기 전용 조회</text><text x="70" y="578" font-size="26" fill="#253d33" font-weight="400">키 이름·권한·만료와</text><text x="70" y="615" font-size="26" fill="#253d33" font-weight="400">실제 연결 계정을</text><text x="70" y="652" font-size="26" fill="#253d33" font-weight="400">확인합니다.</text><rect x="416" y="433" width="336" height="267" rx="20" fill="#f3effa" stroke="#d6e2d9"/><rect x="436" y="453" width="42" height="36" rx="10" fill="#654395" stroke="none"/><text x="444" y="478" font-size="22" fill="white" font-weight="700">04</text><text x="438" y="527" font-size="28" fill="#654395" font-weight="700">계정과 결과 비교</text><text x="438" y="578" font-size="26" fill="#253d33" font-weight="400">올바른 계정·기간의</text><text x="438" y="615" font-size="26" fill="#253d33" font-weight="400">결과인지 확인하고 빈</text><text x="438" y="652" font-size="26" fill="#253d33" font-weight="400">결과와 오류를</text><text x="438" y="689" font-size="26" fill="#253d33" font-weight="400">구분합니다.</text><rect x="48" y="720" width="704" height="150" rx="16" fill="#fff8ec" stroke="#ead7b7"/><text x="70" y="758" font-size="23" fill="#80520e" font-weight="700">기억할 기준</text><text x="70" y="800" font-size="25" fill="#67491c" font-weight="400">자격증명 파일 생성은 인증 성공이 아닙니다.</text><text x="70" y="836" font-size="25" fill="#67491c" font-weight="400">키·토큰은 그림이나 채팅에 넣지 않습니다.</text><text x="48" y="908" font-size="19" fill="#536f61" font-weight="400">본문을 요약한 개념도 · 실제 앱 화면이나 실행 결과가 아닙니다.</text></g></svg>
