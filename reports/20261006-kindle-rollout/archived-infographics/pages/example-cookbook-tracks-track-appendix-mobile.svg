<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 2003" width="800" height="2003" role="img" aria-labelledby="title desc"><title id="title">부록 트랙 한눈에 보기</title><desc id="desc">준비할 자료: 학습 목표·연구 자료·공고 / 작업의 핵심: 자료 확인, 요구 정리, 초안, 검토 순서로 진행합니다. / 검토 기준: 출처·목표·평가 기준을 확인합니다. / 만들 결과: 학습·연구 확인 목록</desc><rect width="800" height="2003" fill="#ffffff"/><g font-family="Apple SD Gothic Neo, Malgun Gothic, Noto Sans KR, sans-serif"><text x="48" y="43" font-size="18" fill="#516e60" font-weight="600">MoAI-Cowork · 한국어 개념 설명</text><text x="48" y="102" font-size="38" fill="#173d2b" font-weight="800">부록 트랙 한눈에 보기</text><text x="48" y="153" font-size="23" fill="#536f61" font-weight="500">업무 순서  ① → ② → ③ → ④</text><rect x="48" y="183" width="704" height="196" rx="20" fill="#edf5f0" stroke="#d6e2d9"/><rect x="68" y="203" width="42" height="36" rx="10" fill="#285942" stroke="none"/><text x="76" y="228" font-size="22" fill="white" font-weight="700">01</text><text x="70" y="277" font-size="36" fill="#285942" font-weight="700">준비할 자료</text><text x="70" y="337" font-size="36" fill="#253d33" font-weight="400">학습 목표·연구 자료·공고</text><rect x="48" y="399" width="704" height="244" rx="20" fill="#ecf3fc" stroke="#d6e2d9"/><rect x="68" y="419" width="42" height="36" rx="10" fill="#245a86" stroke="none"/><text x="76" y="444" font-size="22" fill="white" font-weight="700">02</text><text x="70" y="493" font-size="36" fill="#245a86" font-weight="700">작업의 핵심</text><text x="70" y="553" font-size="36" fill="#253d33" font-weight="400">자료 확인, 요구 정리, 초안, 검토</text><text x="70" y="601" font-size="36" fill="#253d33" font-weight="400">순서로 진행합니다.</text><rect x="48" y="663" width="704" height="196" rx="20" fill="#fff5e7" stroke="#d6e2d9"/><rect x="68" y="683" width="42" height="36" rx="10" fill="#8a540a" stroke="none"/><text x="76" y="708" font-size="22" fill="white" font-weight="700">03</text><text x="70" y="757" font-size="36" fill="#8a540a" font-weight="700">검토 기준</text><text x="70" y="817" font-size="36" fill="#253d33" font-weight="400">출처·목표·평가 기준을 확인합니다.</text><rect x="48" y="879" width="704" height="196" rx="20" fill="#f3effa" stroke="#d6e2d9"/><rect x="68" y="899" width="42" height="36" rx="10" fill="#654395" stroke="none"/><text x="76" y="924" font-size="22" fill="white" font-weight="700">04</text><text x="70" y="973" font-size="36" fill="#654395" font-weight="700">만들 결과</text><text x="70" y="1033" font-size="36" fill="#253d33" font-weight="400">학습·연구 확인 목록</text><text x="48" y="1126" font-size="29" fill="#173d2b" font-weight="700">가상 예제로 읽어 보기</text><rect x="48" y="1147" width="704" height="272" rx="16" fill="#f8faf8" stroke="#d6e2d9"/><text x="70" y="1189" font-size="23" fill="#285942" font-weight="700">제공 자료</text><text x="70" y="1233" font-size="36" fill="#253d33" font-weight="400">가상 학습 목표: 고객 문의 메모로</text><text x="70" y="1281" font-size="36" fill="#253d33" font-weight="400">근거가 있는 주간보고를 작성한다.</text><text x="70" y="1329" font-size="36" fill="#253d33" font-weight="400">학습자는 AI 업무 요청이 처음이며</text><text x="70" y="1377" font-size="36" fill="#253d33" font-weight="400">표를 읽을 수 있다.</text><rect x="48" y="1435" width="704" height="272" rx="16" fill="#f8faf8" stroke="#d6e2d9"/><text x="70" y="1477" font-size="23" fill="#285942" font-weight="700">예상 결과</text><text x="70" y="1521" font-size="36" fill="#253d33" font-weight="400">개념 설명, 예제 시연, 개별 실습,</text><text x="70" y="1569" font-size="36" fill="#253d33" font-weight="400">원문 비교, 확인 문제 순서로 수업을</text><text x="70" y="1617" font-size="36" fill="#253d33" font-weight="400">구성합니다. 평가 기준은 숫자와</text><text x="70" y="1665" font-size="36" fill="#253d33" font-weight="400">미정 상태의 정확성으로 정합니다.</text><rect x="48" y="1723" width="704" height="210" rx="16" fill="#fff8ec" stroke="#ead7b7"/><text x="70" y="1761" font-size="23" fill="#80520e" font-weight="700">주의할 혼동</text><text x="70" y="1803" font-size="32" fill="#67491c" font-weight="400">도구 이름 암기를 완료 기준으로 삼거나</text><text x="70" y="1847" font-size="32" fill="#67491c" font-weight="400">예제 결과를 실제 학습자의 수행 결과로</text><text x="70" y="1891" font-size="32" fill="#67491c" font-weight="400">보고합니다.</text><text x="48" y="1971" font-size="19" fill="#536f61" font-weight="400">본문을 요약한 개념도 · 실제 앱 화면이나 실행 결과가 아닙니다.</text></g></svg>
