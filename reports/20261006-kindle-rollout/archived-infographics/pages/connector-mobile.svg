<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1519" width="800" height="1519" role="img" aria-labelledby="title desc"><title id="title">외부 연결을 확인하는 네 단계</title><desc id="desc">호스트·서버 방식: 웹·데스크톱·클라우드와 로컬·원격 방식을 확인합니다. / 필요한 실행 도구: 로컬 실행에 필요한 경우에만 uv·Node.js 등을 준비합니다. / 계정 인증: 해당 서비스가 지원하는 로그인 또는 비밀정보 설정을 사용합니다. / 작은 조회와 검토: 필요한 범위만 읽고 계정·기간·자료를 직접 확인합니다.</desc><rect width="800" height="1519" fill="#ffffff"/><g font-family="Apple SD Gothic Neo, Malgun Gothic, Noto Sans KR, sans-serif"><text x="48" y="43" font-size="18" fill="#516e60" font-weight="600">MoAI-Cowork · 한국어 개념 설명</text><text x="48" y="102" font-size="38" fill="#173d2b" font-weight="800">외부 연결을 확인하는 네 단계</text><text x="48" y="153" font-size="23" fill="#536f61" font-weight="500">업무 순서  ① → ② → ③ → ④</text><rect x="48" y="183" width="704" height="244" rx="20" fill="#edf5f0" stroke="#d6e2d9"/><rect x="68" y="203" width="42" height="36" rx="10" fill="#285942" stroke="none"/><text x="76" y="228" font-size="22" fill="white" font-weight="700">01</text><text x="70" y="277" font-size="36" fill="#285942" font-weight="700">호스트·서버 방식</text><text x="70" y="337" font-size="36" fill="#253d33" font-weight="400">웹·데스크톱·클라우드와 로컬·원격</text><text x="70" y="385" font-size="36" fill="#253d33" font-weight="400">방식을 확인합니다.</text><rect x="48" y="447" width="704" height="244" rx="20" fill="#ecf3fc" stroke="#d6e2d9"/><rect x="68" y="467" width="42" height="36" rx="10" fill="#245a86" stroke="none"/><text x="76" y="492" font-size="22" fill="white" font-weight="700">02</text><text x="70" y="541" font-size="36" fill="#245a86" font-weight="700">필요한 실행 도구</text><text x="70" y="601" font-size="36" fill="#253d33" font-weight="400">로컬 실행에 필요한 경우에만</text><text x="70" y="649" font-size="36" fill="#253d33" font-weight="400">uv·Node.js 등을 준비합니다.</text><rect x="48" y="711" width="704" height="244" rx="20" fill="#fff5e7" stroke="#d6e2d9"/><rect x="68" y="731" width="42" height="36" rx="10" fill="#8a540a" stroke="none"/><text x="76" y="756" font-size="22" fill="white" font-weight="700">03</text><text x="70" y="805" font-size="36" fill="#8a540a" font-weight="700">계정 인증</text><text x="70" y="865" font-size="36" fill="#253d33" font-weight="400">해당 서비스가 지원하는 로그인 또는</text><text x="70" y="913" font-size="36" fill="#253d33" font-weight="400">비밀정보 설정을 사용합니다.</text><rect x="48" y="975" width="704" height="244" rx="20" fill="#f3effa" stroke="#d6e2d9"/><rect x="68" y="995" width="42" height="36" rx="10" fill="#654395" stroke="none"/><text x="76" y="1020" font-size="22" fill="white" font-weight="700">04</text><text x="70" y="1069" font-size="36" fill="#654395" font-weight="700">작은 조회와 검토</text><text x="70" y="1129" font-size="36" fill="#253d33" font-weight="400">필요한 범위만 읽고</text><text x="70" y="1177" font-size="36" fill="#253d33" font-weight="400">계정·기간·자료를 직접 확인합니다.</text><rect x="48" y="1239" width="704" height="210" rx="16" fill="#fff8ec" stroke="#ead7b7"/><text x="70" y="1277" font-size="23" fill="#80520e" font-weight="700">기억할 기준</text><text x="70" y="1319" font-size="32" fill="#67491c" font-weight="400">버전 출력만으로 플러그인 로드·서버</text><text x="70" y="1363" font-size="32" fill="#67491c" font-weight="400">시작·계정 인증까지 확인된 것은</text><text x="70" y="1407" font-size="32" fill="#67491c" font-weight="400">아닙니다.</text><text x="48" y="1487" font-size="19" fill="#536f61" font-weight="400">본문을 요약한 개념도 · 실제 앱 화면이나 실행 결과가 아닙니다.</text></g></svg>
