<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1456" width="800" height="1456" role="img" aria-labelledby="title desc"><title id="title">VOC 분석으로 FAQ 지식베이스 구축하기 한눈에 보기</title><desc id="desc">준비할 자료: 고객 문의·기존 정책·FAQ / 작업의 핵심: 문의 유형을 분류하고 정책과 대조한 뒤 FAQ 초안을 검토합니다. / 검토 기준: 정책 근거·개인정보 제거·반복 질문의 대표성을 확인합니다. / 만들 결과: 문의 분류와 FAQ 초안</desc><rect width="800" height="1456" fill="#ffffff"/><g font-family="Apple SD Gothic Neo, Malgun Gothic, Noto Sans KR, sans-serif"><text x="48" y="43" font-size="18" fill="#516e60" font-weight="600">MoAI-Cowork · 한국어 개념 설명</text><text x="48" y="102" font-size="38" fill="#173d2b" font-weight="800">VOC 분석으로 FAQ 지식베이스</text><text x="48" y="152" font-size="38" fill="#173d2b" font-weight="800">구축하기 한눈에 보기</text><text x="48" y="203" font-size="23" fill="#536f61" font-weight="500">업무 순서  ① → ② → ③ → ④</text><rect x="48" y="233" width="336" height="230" rx="20" fill="#edf5f0" stroke="#d6e2d9"/><rect x="68" y="253" width="42" height="36" rx="10" fill="#285942" stroke="none"/><text x="76" y="278" font-size="22" fill="white" font-weight="700">01</text><text x="70" y="327" font-size="28" fill="#285942" font-weight="700">준비할 자료</text><text x="70" y="378" font-size="26" fill="#253d33" font-weight="400">고객 문의·기존</text><text x="70" y="415" font-size="26" fill="#253d33" font-weight="400">정책·FAQ</text><rect x="416" y="233" width="336" height="230" rx="20" fill="#ecf3fc" stroke="#d6e2d9"/><rect x="436" y="253" width="42" height="36" rx="10" fill="#245a86" stroke="none"/><text x="444" y="278" font-size="22" fill="white" font-weight="700">02</text><text x="438" y="327" font-size="28" fill="#245a86" font-weight="700">작업의 핵심</text><text x="438" y="378" font-size="26" fill="#253d33" font-weight="400">문의 유형을 분류하고</text><text x="438" y="415" font-size="26" fill="#253d33" font-weight="400">정책과 대조한 뒤 FAQ</text><text x="438" y="452" font-size="26" fill="#253d33" font-weight="400">초안을 검토합니다.</text><rect x="48" y="483" width="336" height="230" rx="20" fill="#fff5e7" stroke="#d6e2d9"/><rect x="68" y="503" width="42" height="36" rx="10" fill="#8a540a" stroke="none"/><text x="76" y="528" font-size="22" fill="white" font-weight="700">03</text><text x="70" y="577" font-size="28" fill="#8a540a" font-weight="700">검토 기준</text><text x="70" y="628" font-size="26" fill="#253d33" font-weight="400">정책 근거·개인정보</text><text x="70" y="665" font-size="26" fill="#253d33" font-weight="400">제거·반복 질문의</text><text x="70" y="702" font-size="26" fill="#253d33" font-weight="400">대표성을 확인합니다.</text><rect x="416" y="483" width="336" height="230" rx="20" fill="#f3effa" stroke="#d6e2d9"/><rect x="436" y="503" width="42" height="36" rx="10" fill="#654395" stroke="none"/><text x="444" y="528" font-size="22" fill="white" font-weight="700">04</text><text x="438" y="577" font-size="28" fill="#654395" font-weight="700">만들 결과</text><text x="438" y="628" font-size="26" fill="#253d33" font-weight="400">문의 분류와 FAQ 초안</text><text x="48" y="764" font-size="29" fill="#173d2b" font-weight="700">가상 예제로 읽어 보기</text><rect x="48" y="785" width="704" height="228" rx="16" fill="#f8faf8" stroke="#d6e2d9"/><text x="70" y="827" font-size="23" fill="#285942" font-weight="700">제공 자료</text><text x="70" y="871" font-size="26" fill="#253d33" font-weight="400">수업용 문의 6건: 배송 3건, 반품 2건, 결제 1건.</text><text x="70" y="908" font-size="26" fill="#253d33" font-weight="400">정책은 영업일 2일 이내 출고, 고객지원 창구로</text><text x="70" y="945" font-size="26" fill="#253d33" font-weight="400">반품 신청. 배송 완료 시점·반품 비용·결제 승인</text><text x="70" y="982" font-size="26" fill="#253d33" font-weight="400">기준은 없음.</text><rect x="48" y="1029" width="704" height="191" rx="16" fill="#f8faf8" stroke="#d6e2d9"/><text x="70" y="1071" font-size="23" fill="#285942" font-weight="700">예상 결과</text><text x="70" y="1115" font-size="26" fill="#253d33" font-weight="400">유형 합계 6건을 표시하고 출고 기준과 도착 시점을</text><text x="70" y="1152" font-size="26" fill="#253d33" font-weight="400">구분합니다. 반품 비용과 결제 정책은 확인 필요로</text><text x="70" y="1189" font-size="26" fill="#253d33" font-weight="400">남깁니다. 원문 ID를 FAQ 근거에 연결합니다.</text><rect x="48" y="1236" width="704" height="150" rx="16" fill="#fff8ec" stroke="#ead7b7"/><text x="70" y="1274" font-size="23" fill="#80520e" font-weight="700">주의할 혼동</text><text x="70" y="1316" font-size="25" fill="#67491c" font-weight="400">2일 이내 출고를 2일 이내 도착으로 바꾸거나</text><text x="70" y="1352" font-size="25" fill="#67491c" font-weight="400">반품이 항상 무료라고 씁니다.</text><text x="48" y="1424" font-size="19" fill="#536f61" font-weight="400">본문을 요약한 개념도 · 실제 앱 화면이나 실행 결과가 아닙니다.</text></g></svg>
