<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 2057" width="800" height="2057" role="img" aria-labelledby="title desc"><title id="title">주간보고 자동화 루틴 만들기 한눈에 보기</title><desc id="desc">준비할 자료: 업무 기록·양식·보고 주기 / 작업의 핵심: 수동 보고서를 검토한 뒤 자료 수집과 예약 실행 가능 여부를 확인합니다. / 검토 기준: 누락·숫자·담당자·예약 첫 실행을 확인합니다. / 만들 결과: 주간보고와 반복 업무 설정</desc><rect width="800" height="2057" fill="#ffffff"/><g font-family="Apple SD Gothic Neo, Malgun Gothic, Noto Sans KR, sans-serif"><text x="48" y="43" font-size="18" fill="#516e60" font-weight="600">MoAI-Cowork · 한국어 개념 설명</text><text x="48" y="102" font-size="38" fill="#173d2b" font-weight="800">주간보고 자동화 루틴 만들기 한눈에</text><text x="48" y="152" font-size="38" fill="#173d2b" font-weight="800">보기</text><text x="48" y="203" font-size="23" fill="#536f61" font-weight="500">업무 순서  ① → ② → ③ → ④</text><rect x="48" y="233" width="704" height="196" rx="20" fill="#edf5f0" stroke="#d6e2d9"/><rect x="68" y="253" width="42" height="36" rx="10" fill="#285942" stroke="none"/><text x="76" y="278" font-size="22" fill="white" font-weight="700">01</text><text x="70" y="327" font-size="36" fill="#285942" font-weight="700">준비할 자료</text><text x="70" y="387" font-size="36" fill="#253d33" font-weight="400">업무 기록·양식·보고 주기</text><rect x="48" y="449" width="704" height="292" rx="20" fill="#ecf3fc" stroke="#d6e2d9"/><rect x="68" y="469" width="42" height="36" rx="10" fill="#245a86" stroke="none"/><text x="76" y="494" font-size="22" fill="white" font-weight="700">02</text><text x="70" y="543" font-size="36" fill="#245a86" font-weight="700">작업의 핵심</text><text x="70" y="603" font-size="36" fill="#253d33" font-weight="400">수동 보고서를 검토한 뒤 자료</text><text x="70" y="651" font-size="36" fill="#253d33" font-weight="400">수집과 예약 실행 가능 여부를</text><text x="70" y="699" font-size="36" fill="#253d33" font-weight="400">확인합니다.</text><rect x="48" y="761" width="704" height="244" rx="20" fill="#fff5e7" stroke="#d6e2d9"/><rect x="68" y="781" width="42" height="36" rx="10" fill="#8a540a" stroke="none"/><text x="76" y="806" font-size="22" fill="white" font-weight="700">03</text><text x="70" y="855" font-size="36" fill="#8a540a" font-weight="700">검토 기준</text><text x="70" y="915" font-size="36" fill="#253d33" font-weight="400">누락·숫자·담당자·예약 첫 실행을</text><text x="70" y="963" font-size="36" fill="#253d33" font-weight="400">확인합니다.</text><rect x="48" y="1025" width="704" height="196" rx="20" fill="#f3effa" stroke="#d6e2d9"/><rect x="68" y="1045" width="42" height="36" rx="10" fill="#654395" stroke="none"/><text x="76" y="1070" font-size="22" fill="white" font-weight="700">04</text><text x="70" y="1119" font-size="36" fill="#654395" font-weight="700">만들 결과</text><text x="70" y="1179" font-size="36" fill="#253d33" font-weight="400">주간보고와 반복 업무 설정</text><text x="48" y="1272" font-size="29" fill="#173d2b" font-weight="700">가상 예제로 읽어 보기</text><rect x="48" y="1293" width="704" height="224" rx="16" fill="#f8faf8" stroke="#d6e2d9"/><text x="70" y="1335" font-size="23" fill="#285942" font-weight="700">제공 자료</text><text x="70" y="1379" font-size="36" fill="#253d33" font-weight="400">문의 12건 답변, FAQ 초안 4개,</text><text x="70" y="1427" font-size="36" fill="#253d33" font-weight="400">배송 지연 원인 미확인. 다음 행동은</text><text x="70" y="1475" font-size="36" fill="#253d33" font-weight="400">안내문 수정과 FAQ 검토.</text><rect x="48" y="1533" width="704" height="272" rx="16" fill="#f8faf8" stroke="#d6e2d9"/><text x="70" y="1575" font-size="23" fill="#285942" font-weight="700">예상 결과</text><text x="70" y="1619" font-size="36" fill="#253d33" font-weight="400">문의 12건은 답변 완료, FAQ 4개는</text><text x="70" y="1667" font-size="36" fill="#253d33" font-weight="400">검토 전 초안으로 나눕니다. 배송</text><text x="70" y="1715" font-size="36" fill="#253d33" font-weight="400">지연 원인과 다음 행동의 담당자는</text><text x="70" y="1763" font-size="36" fill="#253d33" font-weight="400">확인 필요로 표시합니다.</text><rect x="48" y="1821" width="704" height="166" rx="16" fill="#fff8ec" stroke="#ead7b7"/><text x="70" y="1859" font-size="23" fill="#80520e" font-weight="700">주의할 혼동</text><text x="70" y="1901" font-size="32" fill="#67491c" font-weight="400">FAQ 4개를 최종 완료로 쓰거나 배송</text><text x="70" y="1945" font-size="32" fill="#67491c" font-weight="400">지연 원인을 추정합니다.</text><text x="48" y="2025" font-size="19" fill="#536f61" font-weight="400">본문을 요약한 개념도 · 실제 앱 화면이나 실행 결과가 아닙니다.</text></g></svg>
