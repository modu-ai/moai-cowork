<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 953" width="800" height="953" role="img" aria-labelledby="title desc"><title id="title">MCP: 실행 위치와 연결 방식을 따로 확인</title><desc id="desc">로컬 서버: 실행 환경에 필요한 프로그램과 서버 시작 상태를 확인합니다. / 원격 서버: 접속 가능한 서버와 지원되는 인증 경로를 확인합니다. / 웹·클라우드 작업: 컴퓨터의 로컬 서버를 자동 사용할 수 있다고 가정하지 않습니다. / 실제 조회: 현재 작업의 도구와 인증 계정으로 자료를 읽어 확인합니다.</desc><rect width="800" height="953" fill="#ffffff"/><g font-family="Apple SD Gothic Neo, Malgun Gothic, Noto Sans KR, sans-serif"><text x="48" y="43" font-size="18" fill="#516e60" font-weight="600">MoAI-Cowork · 한국어 개념 설명</text><text x="48" y="102" font-size="38" fill="#173d2b" font-weight="800">MCP: 실행 위치와 연결 방식을 따로</text><text x="48" y="152" font-size="38" fill="#173d2b" font-weight="800">확인</text><text x="48" y="203" font-size="23" fill="#536f61" font-weight="500">비슷해 보여도 서로 다른 네 가지</text><rect x="48" y="233" width="336" height="230" rx="20" fill="#edf5f0" stroke="#d6e2d9"/><rect x="68" y="253" width="42" height="36" rx="10" fill="#285942" stroke="none"/><text x="76" y="278" font-size="22" fill="white" font-weight="700">01</text><text x="70" y="327" font-size="28" fill="#285942" font-weight="700">로컬 서버</text><text x="70" y="378" font-size="26" fill="#253d33" font-weight="400">실행 환경에 필요한</text><text x="70" y="415" font-size="26" fill="#253d33" font-weight="400">프로그램과 서버 시작</text><text x="70" y="452" font-size="26" fill="#253d33" font-weight="400">상태를 확인합니다.</text><rect x="416" y="233" width="336" height="230" rx="20" fill="#ecf3fc" stroke="#d6e2d9"/><rect x="436" y="253" width="42" height="36" rx="10" fill="#245a86" stroke="none"/><text x="444" y="278" font-size="22" fill="white" font-weight="700">02</text><text x="438" y="327" font-size="28" fill="#245a86" font-weight="700">원격 서버</text><text x="438" y="378" font-size="26" fill="#253d33" font-weight="400">접속 가능한 서버와</text><text x="438" y="415" font-size="26" fill="#253d33" font-weight="400">지원되는 인증 경로를</text><text x="438" y="452" font-size="26" fill="#253d33" font-weight="400">확인합니다.</text><rect x="48" y="483" width="336" height="230" rx="20" fill="#fff5e7" stroke="#d6e2d9"/><rect x="68" y="503" width="42" height="36" rx="10" fill="#8a540a" stroke="none"/><text x="76" y="528" font-size="22" fill="white" font-weight="700">03</text><text x="70" y="577" font-size="28" fill="#8a540a" font-weight="700">웹·클라우드 작업</text><text x="70" y="628" font-size="26" fill="#253d33" font-weight="400">컴퓨터의 로컬 서버를</text><text x="70" y="665" font-size="26" fill="#253d33" font-weight="400">자동 사용할 수 있다고</text><text x="70" y="702" font-size="26" fill="#253d33" font-weight="400">가정하지 않습니다.</text><rect x="416" y="483" width="336" height="230" rx="20" fill="#f3effa" stroke="#d6e2d9"/><rect x="436" y="503" width="42" height="36" rx="10" fill="#654395" stroke="none"/><text x="444" y="528" font-size="22" fill="white" font-weight="700">04</text><text x="438" y="577" font-size="28" fill="#654395" font-weight="700">실제 조회</text><text x="438" y="628" font-size="26" fill="#253d33" font-weight="400">현재 작업의 도구와</text><text x="438" y="665" font-size="26" fill="#253d33" font-weight="400">인증 계정으로 자료를</text><text x="438" y="702" font-size="26" fill="#253d33" font-weight="400">읽어 확인합니다.</text><rect x="48" y="733" width="704" height="150" rx="16" fill="#fff8ec" stroke="#ead7b7"/><text x="70" y="771" font-size="23" fill="#80520e" font-weight="700">기억할 기준</text><text x="70" y="813" font-size="25" fill="#67491c" font-weight="400">패키지 설정, 도구 노출, 실제 조회 성공은 각각의</text><text x="70" y="849" font-size="25" fill="#67491c" font-weight="400">근거가 필요합니다.</text><text x="48" y="921" font-size="19" fill="#536f61" font-weight="400">본문을 요약한 개념도 · 실제 앱 화면이나 실행 결과가 아닙니다.</text></g></svg>
