<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1419" width="800" height="1419" role="img" aria-labelledby="title desc"><title id="title">웹소설 기획부터 연재·표지까지 한눈에 보기</title><desc id="desc">준비할 자료: 장르·독자·세계관·등장인물 / 작업의 핵심: 기획, 설정, 회차 구조, 초안, 설정 검토 순서로 진행합니다. / 검토 기준: 설정 일관성·인물 동기·저작권과 유사성을 확인합니다. / 만들 결과: 웹소설 기획안과 첫 회 초안</desc><rect width="800" height="1419" fill="#ffffff"/><g font-family="Apple SD Gothic Neo, Malgun Gothic, Noto Sans KR, sans-serif"><text x="48" y="43" font-size="18" fill="#516e60" font-weight="600">MoAI-Cowork · 한국어 개념 설명</text><text x="48" y="102" font-size="38" fill="#173d2b" font-weight="800">웹소설 기획부터 연재·표지까지</text><text x="48" y="152" font-size="38" fill="#173d2b" font-weight="800">한눈에 보기</text><text x="48" y="203" font-size="23" fill="#536f61" font-weight="500">업무 순서  ① → ② → ③ → ④</text><rect x="48" y="233" width="336" height="230" rx="20" fill="#edf5f0" stroke="#d6e2d9"/><rect x="68" y="253" width="42" height="36" rx="10" fill="#285942" stroke="none"/><text x="76" y="278" font-size="22" fill="white" font-weight="700">01</text><text x="70" y="327" font-size="28" fill="#285942" font-weight="700">준비할 자료</text><text x="70" y="378" font-size="26" fill="#253d33" font-weight="400">장르·독자·세계관·등장</text><text x="70" y="415" font-size="26" fill="#253d33" font-weight="400">인물</text><rect x="416" y="233" width="336" height="230" rx="20" fill="#ecf3fc" stroke="#d6e2d9"/><rect x="436" y="253" width="42" height="36" rx="10" fill="#245a86" stroke="none"/><text x="444" y="278" font-size="22" fill="white" font-weight="700">02</text><text x="438" y="327" font-size="28" fill="#245a86" font-weight="700">작업의 핵심</text><text x="438" y="378" font-size="26" fill="#253d33" font-weight="400">기획, 설정, 회차 구조,</text><text x="438" y="415" font-size="26" fill="#253d33" font-weight="400">초안, 설정 검토 순서로</text><text x="438" y="452" font-size="26" fill="#253d33" font-weight="400">진행합니다.</text><rect x="48" y="483" width="336" height="230" rx="20" fill="#fff5e7" stroke="#d6e2d9"/><rect x="68" y="503" width="42" height="36" rx="10" fill="#8a540a" stroke="none"/><text x="76" y="528" font-size="22" fill="white" font-weight="700">03</text><text x="70" y="577" font-size="28" fill="#8a540a" font-weight="700">검토 기준</text><text x="70" y="628" font-size="26" fill="#253d33" font-weight="400">설정 일관성·인물</text><text x="70" y="665" font-size="26" fill="#253d33" font-weight="400">동기·저작권과 유사성을</text><text x="70" y="702" font-size="26" fill="#253d33" font-weight="400">확인합니다.</text><rect x="416" y="483" width="336" height="230" rx="20" fill="#f3effa" stroke="#d6e2d9"/><rect x="436" y="503" width="42" height="36" rx="10" fill="#654395" stroke="none"/><text x="444" y="528" font-size="22" fill="white" font-weight="700">04</text><text x="438" y="577" font-size="28" fill="#654395" font-weight="700">만들 결과</text><text x="438" y="628" font-size="26" fill="#253d33" font-weight="400">웹소설 기획안과 첫 회</text><text x="438" y="665" font-size="26" fill="#253d33" font-weight="400">초안</text><text x="48" y="764" font-size="29" fill="#173d2b" font-weight="700">가상 예제로 읽어 보기</text><rect x="48" y="785" width="704" height="191" rx="16" fill="#f8faf8" stroke="#d6e2d9"/><text x="70" y="827" font-size="23" fill="#285942" font-weight="700">제공 자료</text><text x="70" y="871" font-size="26" fill="#253d33" font-weight="400">가상 설정: 기록을 잃은 도시에서 지도 제작자 민이</text><text x="70" y="908" font-size="26" fill="#253d33" font-weight="400">오래된 지도를 찾는다. 지도는 과거의 길만 보여</text><text x="70" y="945" font-size="26" fill="#253d33" font-weight="400">주며 미래는 보여 주지 못한다.</text><rect x="48" y="992" width="704" height="191" rx="16" fill="#f8faf8" stroke="#d6e2d9"/><text x="70" y="1034" font-size="23" fill="#285942" font-weight="700">예상 결과</text><text x="70" y="1078" font-size="26" fill="#253d33" font-weight="400">민의 목표와 장애물을 정하고 첫 장면을 씁니다.</text><text x="70" y="1115" font-size="26" fill="#253d33" font-weight="400">지도가 미래를 알려 주는 장면은 넣지 않고 설정</text><text x="70" y="1152" font-size="26" fill="#253d33" font-weight="400">검토 목록을 남깁니다.</text><rect x="48" y="1199" width="704" height="150" rx="16" fill="#fff8ec" stroke="#ead7b7"/><text x="70" y="1237" font-size="23" fill="#80520e" font-weight="700">주의할 혼동</text><text x="70" y="1279" font-size="25" fill="#67491c" font-weight="400">회차가 바뀌며 지도의 능력을 임의로 확장하거나</text><text x="70" y="1315" font-size="25" fill="#67491c" font-weight="400">인물의 목표가 사라집니다.</text><text x="48" y="1387" font-size="19" fill="#536f61" font-weight="400">본문을 요약한 개념도 · 실제 앱 화면이나 실행 결과가 아닙니다.</text></g></svg>
