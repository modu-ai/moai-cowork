<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1406" width="800" height="1406" role="img" aria-labelledby="title desc"><title id="title">셀러 한눈에 보기</title><desc id="desc">준비할 자료: 상품 정보·고객 질문·운영 자료 / 작업의 핵심: 상품 정보로 상세페이지 초안을 만들고 확인하지 못한 인증·효능은 쓰지 마. / 검토 기준: 제공 자료와 결과를 비교하고 미정 항목을 구분합니다. / 만들 결과: 상세페이지 또는 운영 개선안</desc><rect width="800" height="1406" fill="#ffffff"/><g font-family="Apple SD Gothic Neo, Malgun Gothic, Noto Sans KR, sans-serif"><text x="48" y="43" font-size="18" fill="#516e60" font-weight="600">MoAI-Cowork · 한국어 개념 설명</text><text x="48" y="102" font-size="38" fill="#173d2b" font-weight="800">셀러 한눈에 보기</text><text x="48" y="153" font-size="23" fill="#536f61" font-weight="500">업무 순서  ① → ② → ③ → ④</text><rect x="48" y="183" width="336" height="267" rx="20" fill="#edf5f0" stroke="#d6e2d9"/><rect x="68" y="203" width="42" height="36" rx="10" fill="#285942" stroke="none"/><text x="76" y="228" font-size="22" fill="white" font-weight="700">01</text><text x="70" y="277" font-size="28" fill="#285942" font-weight="700">준비할 자료</text><text x="70" y="328" font-size="26" fill="#253d33" font-weight="400">상품 정보·고객</text><text x="70" y="365" font-size="26" fill="#253d33" font-weight="400">질문·운영 자료</text><rect x="416" y="183" width="336" height="267" rx="20" fill="#ecf3fc" stroke="#d6e2d9"/><rect x="436" y="203" width="42" height="36" rx="10" fill="#245a86" stroke="none"/><text x="444" y="228" font-size="22" fill="white" font-weight="700">02</text><text x="438" y="277" font-size="28" fill="#245a86" font-weight="700">작업의 핵심</text><text x="438" y="328" font-size="26" fill="#253d33" font-weight="400">상품 정보로 상세페이지</text><text x="438" y="365" font-size="26" fill="#253d33" font-weight="400">초안을 만들고 확인하지</text><text x="438" y="402" font-size="26" fill="#253d33" font-weight="400">못한 인증·효능은 쓰지</text><text x="438" y="439" font-size="26" fill="#253d33" font-weight="400">마.</text><rect x="48" y="470" width="336" height="230" rx="20" fill="#fff5e7" stroke="#d6e2d9"/><rect x="68" y="490" width="42" height="36" rx="10" fill="#8a540a" stroke="none"/><text x="76" y="515" font-size="22" fill="white" font-weight="700">03</text><text x="70" y="564" font-size="28" fill="#8a540a" font-weight="700">검토 기준</text><text x="70" y="615" font-size="26" fill="#253d33" font-weight="400">제공 자료와 결과를</text><text x="70" y="652" font-size="26" fill="#253d33" font-weight="400">비교하고 미정 항목을</text><text x="70" y="689" font-size="26" fill="#253d33" font-weight="400">구분합니다.</text><rect x="416" y="470" width="336" height="230" rx="20" fill="#f3effa" stroke="#d6e2d9"/><rect x="436" y="490" width="42" height="36" rx="10" fill="#654395" stroke="none"/><text x="444" y="515" font-size="22" fill="white" font-weight="700">04</text><text x="438" y="564" font-size="28" fill="#654395" font-weight="700">만들 결과</text><text x="438" y="615" font-size="26" fill="#253d33" font-weight="400">상세페이지 또는 운영</text><text x="438" y="652" font-size="26" fill="#253d33" font-weight="400">개선안</text><text x="48" y="751" font-size="29" fill="#173d2b" font-weight="700">가상 예제로 읽어 보기</text><rect x="48" y="772" width="704" height="154" rx="16" fill="#f8faf8" stroke="#d6e2d9"/><text x="70" y="814" font-size="23" fill="#285942" font-weight="700">제공 자료</text><text x="70" y="858" font-size="26" fill="#253d33" font-weight="400">가상 상품: USB-C 충전 스탠드, 높이 28cm, 밝기</text><text x="70" y="895" font-size="26" fill="#253d33" font-weight="400">3단계. 가격·배송비·사용 시간·인증 정보는 없음.</text><rect x="48" y="942" width="704" height="228" rx="16" fill="#f8faf8" stroke="#d6e2d9"/><text x="70" y="984" font-size="23" fill="#285942" font-weight="700">예상 결과</text><text x="70" y="1028" font-size="26" fill="#253d33" font-weight="400">확인된 사양으로 소개 초안을 만들고</text><text x="70" y="1065" font-size="26" fill="#253d33" font-weight="400">가격·배송비·사용 시간·인증은 확인 목록으로</text><text x="70" y="1102" font-size="26" fill="#253d33" font-weight="400">나눕니다. 실제 등록은 수행하지 않은 상태로</text><text x="70" y="1139" font-size="26" fill="#253d33" font-weight="400">표시합니다.</text><rect x="48" y="1186" width="704" height="150" rx="16" fill="#fff8ec" stroke="#ead7b7"/><text x="70" y="1224" font-size="23" fill="#80520e" font-weight="700">주의할 혼동</text><text x="70" y="1266" font-size="25" fill="#67491c" font-weight="400">효능이나 인증을 만들어 넣거나 초안을 만든 뒤</text><text x="70" y="1302" font-size="25" fill="#67491c" font-weight="400">상품을 등록했다고 보고합니다.</text><text x="48" y="1374" font-size="19" fill="#536f61" font-weight="400">본문을 요약한 개념도 · 실제 앱 화면이나 실행 결과가 아닙니다.</text></g></svg>
