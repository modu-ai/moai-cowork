<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 2338" width="800" height="2338" role="img" aria-labelledby="title desc"><title id="title">시각화 최적화 원칙 한눈에 보기</title><desc id="desc">준비할 자료: 표·독자·전달할 메시지 / 작업의 핵심: 비교, 변화, 분포 중 전달 목적을 정하고 차트를 선택합니다. / 검토 기준: 축·단위·기간·색 대비·원문 값을 확인합니다. / 만들 결과: 차트와 설명</desc><rect width="800" height="2338" fill="#ffffff"/><g font-family="Apple SD Gothic Neo, Malgun Gothic, Noto Sans KR, sans-serif"><text x="48" y="43" font-size="18" fill="#516e60" font-weight="600">MoAI-Cowork · 한국어 개념 설명</text><text x="48" y="102" font-size="38" fill="#173d2b" font-weight="800">시각화 최적화 원칙 한눈에 보기</text><text x="48" y="153" font-size="23" fill="#536f61" font-weight="500">업무 순서  ① → ② → ③ → ④</text><rect x="48" y="183" width="704" height="196" rx="20" fill="#edf5f0" stroke="#d6e2d9"/><rect x="68" y="203" width="42" height="36" rx="10" fill="#285942" stroke="none"/><text x="76" y="228" font-size="22" fill="white" font-weight="700">01</text><text x="70" y="277" font-size="36" fill="#285942" font-weight="700">준비할 자료</text><text x="70" y="337" font-size="36" fill="#253d33" font-weight="400">표·독자·전달할 메시지</text><rect x="48" y="399" width="704" height="244" rx="20" fill="#ecf3fc" stroke="#d6e2d9"/><rect x="68" y="419" width="42" height="36" rx="10" fill="#245a86" stroke="none"/><text x="76" y="444" font-size="22" fill="white" font-weight="700">02</text><text x="70" y="493" font-size="36" fill="#245a86" font-weight="700">작업의 핵심</text><text x="70" y="553" font-size="36" fill="#253d33" font-weight="400">비교, 변화, 분포 중 전달 목적을</text><text x="70" y="601" font-size="36" fill="#253d33" font-weight="400">정하고 차트를 선택합니다.</text><rect x="48" y="663" width="704" height="244" rx="20" fill="#fff5e7" stroke="#d6e2d9"/><rect x="68" y="683" width="42" height="36" rx="10" fill="#8a540a" stroke="none"/><text x="76" y="708" font-size="22" fill="white" font-weight="700">03</text><text x="70" y="757" font-size="36" fill="#8a540a" font-weight="700">검토 기준</text><text x="70" y="817" font-size="36" fill="#253d33" font-weight="400">축·단위·기간·색 대비·원문 값을</text><text x="70" y="865" font-size="36" fill="#253d33" font-weight="400">확인합니다.</text><rect x="48" y="927" width="704" height="196" rx="20" fill="#f3effa" stroke="#d6e2d9"/><rect x="68" y="947" width="42" height="36" rx="10" fill="#654395" stroke="none"/><text x="76" y="972" font-size="22" fill="white" font-weight="700">04</text><text x="70" y="1021" font-size="36" fill="#654395" font-weight="700">만들 결과</text><text x="70" y="1081" font-size="36" fill="#253d33" font-weight="400">차트와 설명</text><text x="48" y="1175" font-size="29" fill="#173d2b" font-weight="700">비율은 건수를 합쳐서 계산</text><text x="48" y="1234" font-size="26" fill="#245a86" font-weight="600">A지역 24/30</text><rect x="250" y="1212" width="390" height="30" rx="6" fill="#e6ede8" stroke="none"/><rect x="250" y="1212" width="312.0" height="30" rx="6" fill="#245a86" stroke="none"/><text x="658" y="1236" font-size="28" fill="#245a86" font-weight="700">80%</text><text x="48" y="1303" font-size="26" fill="#654395" font-weight="600">B지역 10/20</text><rect x="250" y="1281" width="390" height="30" rx="6" fill="#e6ede8" stroke="none"/><rect x="250" y="1281" width="195.0" height="30" rx="6" fill="#654395" stroke="none"/><text x="658" y="1305" font-size="28" fill="#654395" font-weight="700">50%</text><text x="48" y="1372" font-size="26" fill="#285942" font-weight="600">전체 34/50</text><rect x="250" y="1350" width="390" height="30" rx="6" fill="#e6ede8" stroke="none"/><rect x="250" y="1350" width="265.2" height="30" rx="6" fill="#285942" stroke="none"/><text x="658" y="1374" font-size="28" fill="#285942" font-weight="700">68%</text><text x="48" y="1434" font-size="24" fill="#253d33" font-weight="600">전체 완료율 = 완료 합계 ÷ 문의 합계 × 100</text><text x="48" y="1505" font-size="29" fill="#173d2b" font-weight="700">가상 예제로 읽어 보기</text><rect x="48" y="1526" width="704" height="272" rx="16" fill="#f8faf8" stroke="#d6e2d9"/><text x="70" y="1568" font-size="23" fill="#285942" font-weight="700">제공 자료</text><text x="70" y="1612" font-size="36" fill="#253d33" font-weight="400">가상 자료: A지역 문의 30건, 응답</text><text x="70" y="1660" font-size="36" fill="#253d33" font-weight="400">완료 24건. B지역 문의 20건, 응답</text><text x="70" y="1708" font-size="36" fill="#253d33" font-weight="400">완료 10건. 두 값의 기간은 같은</text><text x="70" y="1756" font-size="36" fill="#253d33" font-weight="400">주이며 단위는 건.</text><rect x="48" y="1814" width="704" height="272" rx="16" fill="#f8faf8" stroke="#d6e2d9"/><text x="70" y="1856" font-size="23" fill="#285942" font-weight="700">예상 결과</text><text x="70" y="1900" font-size="36" fill="#253d33" font-weight="400">전체 문의 50건, 완료 34건, 전체</text><text x="70" y="1948" font-size="36" fill="#253d33" font-weight="400">완료율 68%입니다. A는 80%, B는</text><text x="70" y="1996" font-size="36" fill="#253d33" font-weight="400">50%입니다. 지역별 건수와 비율을</text><text x="70" y="2044" font-size="36" fill="#253d33" font-weight="400">함께 표시합니다.</text><rect x="48" y="2102" width="704" height="166" rx="16" fill="#fff8ec" stroke="#ead7b7"/><text x="70" y="2140" font-size="23" fill="#80520e" font-weight="700">주의할 혼동</text><text x="70" y="2182" font-size="32" fill="#67491c" font-weight="400">80%와 50%를 단순 평균해 전체 완료율을</text><text x="70" y="2226" font-size="32" fill="#67491c" font-weight="400">65%로 씁니다.</text><text x="48" y="2306" font-size="19" fill="#536f61" font-weight="400">본문을 요약한 개념도 · 실제 앱 화면이나 실행 결과가 아닙니다.</text></g></svg>
