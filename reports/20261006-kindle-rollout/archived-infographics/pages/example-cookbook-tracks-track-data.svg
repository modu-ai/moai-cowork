<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1663" width="800" height="1663" role="img" aria-labelledby="title desc"><title id="title">데이터 트랙 한눈에 보기</title><desc id="desc">준비할 자료: 표·조사 질문·출처 / 작업의 핵심: 자료 확인, 요구 정리, 초안, 검토 순서로 진행합니다. / 검토 기준: 누락·단위·계산·해석을 확인합니다. / 만들 결과: 데이터 분석 보고서</desc><rect width="800" height="1663" fill="#ffffff"/><g font-family="Apple SD Gothic Neo, Malgun Gothic, Noto Sans KR, sans-serif"><text x="48" y="43" font-size="18" fill="#516e60" font-weight="600">MoAI-Cowork · 한국어 개념 설명</text><text x="48" y="102" font-size="38" fill="#173d2b" font-weight="800">데이터 트랙 한눈에 보기</text><text x="48" y="153" font-size="23" fill="#536f61" font-weight="500">업무 순서  ① → ② → ③ → ④</text><rect x="48" y="183" width="336" height="230" rx="20" fill="#edf5f0" stroke="#d6e2d9"/><rect x="68" y="203" width="42" height="36" rx="10" fill="#285942" stroke="none"/><text x="76" y="228" font-size="22" fill="white" font-weight="700">01</text><text x="70" y="277" font-size="28" fill="#285942" font-weight="700">준비할 자료</text><text x="70" y="328" font-size="26" fill="#253d33" font-weight="400">표·조사 질문·출처</text><rect x="416" y="183" width="336" height="230" rx="20" fill="#ecf3fc" stroke="#d6e2d9"/><rect x="436" y="203" width="42" height="36" rx="10" fill="#245a86" stroke="none"/><text x="444" y="228" font-size="22" fill="white" font-weight="700">02</text><text x="438" y="277" font-size="28" fill="#245a86" font-weight="700">작업의 핵심</text><text x="438" y="328" font-size="26" fill="#253d33" font-weight="400">자료 확인, 요구 정리,</text><text x="438" y="365" font-size="26" fill="#253d33" font-weight="400">초안, 검토 순서로</text><text x="438" y="402" font-size="26" fill="#253d33" font-weight="400">진행합니다.</text><rect x="48" y="433" width="336" height="193" rx="20" fill="#fff5e7" stroke="#d6e2d9"/><rect x="68" y="453" width="42" height="36" rx="10" fill="#8a540a" stroke="none"/><text x="76" y="478" font-size="22" fill="white" font-weight="700">03</text><text x="70" y="527" font-size="28" fill="#8a540a" font-weight="700">검토 기준</text><text x="70" y="578" font-size="26" fill="#253d33" font-weight="400">누락·단위·계산·해석을</text><text x="70" y="615" font-size="26" fill="#253d33" font-weight="400">확인합니다.</text><rect x="416" y="433" width="336" height="193" rx="20" fill="#f3effa" stroke="#d6e2d9"/><rect x="436" y="453" width="42" height="36" rx="10" fill="#654395" stroke="none"/><text x="444" y="478" font-size="22" fill="white" font-weight="700">04</text><text x="438" y="527" font-size="28" fill="#654395" font-weight="700">만들 결과</text><text x="438" y="578" font-size="26" fill="#253d33" font-weight="400">데이터 분석 보고서</text><text x="48" y="678" font-size="29" fill="#173d2b" font-weight="700">비율은 건수를 합쳐서 계산</text><text x="48" y="737" font-size="26" fill="#245a86" font-weight="600">A지역 24/30</text><rect x="250" y="715" width="390" height="30" rx="6" fill="#e6ede8" stroke="none"/><rect x="250" y="715" width="312.0" height="30" rx="6" fill="#245a86" stroke="none"/><text x="658" y="739" font-size="28" fill="#245a86" font-weight="700">80%</text><text x="48" y="806" font-size="26" fill="#654395" font-weight="600">B지역 10/20</text><rect x="250" y="784" width="390" height="30" rx="6" fill="#e6ede8" stroke="none"/><rect x="250" y="784" width="195.0" height="30" rx="6" fill="#654395" stroke="none"/><text x="658" y="808" font-size="28" fill="#654395" font-weight="700">50%</text><text x="48" y="875" font-size="26" fill="#285942" font-weight="600">전체 34/50</text><rect x="250" y="853" width="390" height="30" rx="6" fill="#e6ede8" stroke="none"/><rect x="250" y="853" width="265.2" height="30" rx="6" fill="#285942" stroke="none"/><text x="658" y="877" font-size="28" fill="#285942" font-weight="700">68%</text><text x="48" y="937" font-size="24" fill="#253d33" font-weight="600">전체 완료율 = 완료 합계 ÷ 문의 합계 × 100</text><text x="48" y="1008" font-size="29" fill="#173d2b" font-weight="700">가상 예제로 읽어 보기</text><rect x="48" y="1029" width="704" height="191" rx="16" fill="#f8faf8" stroke="#d6e2d9"/><text x="70" y="1071" font-size="23" fill="#285942" font-weight="700">제공 자료</text><text x="70" y="1115" font-size="26" fill="#253d33" font-weight="400">가상 자료: A지역 문의 30건, 응답 완료 24건.</text><text x="70" y="1152" font-size="26" fill="#253d33" font-weight="400">B지역 문의 20건, 응답 완료 10건. 두 값의</text><text x="70" y="1189" font-size="26" fill="#253d33" font-weight="400">기간은 같은 주이며 단위는 건.</text><rect x="48" y="1236" width="704" height="191" rx="16" fill="#f8faf8" stroke="#d6e2d9"/><text x="70" y="1278" font-size="23" fill="#285942" font-weight="700">예상 결과</text><text x="70" y="1322" font-size="26" fill="#253d33" font-weight="400">전체 문의 50건, 완료 34건, 전체 완료율</text><text x="70" y="1359" font-size="26" fill="#253d33" font-weight="400">68%입니다. A는 80%, B는 50%입니다. 지역별</text><text x="70" y="1396" font-size="26" fill="#253d33" font-weight="400">건수와 비율을 함께 표시합니다.</text><rect x="48" y="1443" width="704" height="150" rx="16" fill="#fff8ec" stroke="#ead7b7"/><text x="70" y="1481" font-size="23" fill="#80520e" font-weight="700">주의할 혼동</text><text x="70" y="1523" font-size="25" fill="#67491c" font-weight="400">80%와 50%를 단순 평균해 전체 완료율을 65%로</text><text x="70" y="1559" font-size="25" fill="#67491c" font-weight="400">씁니다.</text><text x="48" y="1631" font-size="19" fill="#536f61" font-weight="400">본문을 요약한 개념도 · 실제 앱 화면이나 실행 결과가 아닙니다.</text></g></svg>
