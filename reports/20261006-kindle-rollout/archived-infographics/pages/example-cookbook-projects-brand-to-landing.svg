<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1419" width="800" height="1419" role="img" aria-labelledby="title desc"><title id="title">브랜드에서 랜딩 페이지까지 한눈에 보기</title><desc id="desc">준비할 자료: 브랜드·고객·제품·기존 자료 / 작업의 핵심: 브랜드 기준, 콘텐츠, 시안, 접근성 검토를 순서대로 진행합니다. / 검토 기준: 주장 근거·행동 버튼·모바일 가독성을 확인합니다. / 만들 결과: 브랜드 기준과 랜딩 페이지 초안</desc><rect width="800" height="1419" fill="#ffffff"/><g font-family="Apple SD Gothic Neo, Malgun Gothic, Noto Sans KR, sans-serif"><text x="48" y="43" font-size="18" fill="#516e60" font-weight="600">MoAI-Cowork · 한국어 개념 설명</text><text x="48" y="102" font-size="38" fill="#173d2b" font-weight="800">브랜드에서 랜딩 페이지까지 한눈에</text><text x="48" y="152" font-size="38" fill="#173d2b" font-weight="800">보기</text><text x="48" y="203" font-size="23" fill="#536f61" font-weight="500">업무 순서  ① → ② → ③ → ④</text><rect x="48" y="233" width="336" height="230" rx="20" fill="#edf5f0" stroke="#d6e2d9"/><rect x="68" y="253" width="42" height="36" rx="10" fill="#285942" stroke="none"/><text x="76" y="278" font-size="22" fill="white" font-weight="700">01</text><text x="70" y="327" font-size="28" fill="#285942" font-weight="700">준비할 자료</text><text x="70" y="378" font-size="26" fill="#253d33" font-weight="400">브랜드·고객·제품·기존</text><text x="70" y="415" font-size="26" fill="#253d33" font-weight="400">자료</text><rect x="416" y="233" width="336" height="230" rx="20" fill="#ecf3fc" stroke="#d6e2d9"/><rect x="436" y="253" width="42" height="36" rx="10" fill="#245a86" stroke="none"/><text x="444" y="278" font-size="22" fill="white" font-weight="700">02</text><text x="438" y="327" font-size="28" fill="#245a86" font-weight="700">작업의 핵심</text><text x="438" y="378" font-size="26" fill="#253d33" font-weight="400">브랜드 기준, 콘텐츠,</text><text x="438" y="415" font-size="26" fill="#253d33" font-weight="400">시안, 접근성 검토를</text><text x="438" y="452" font-size="26" fill="#253d33" font-weight="400">순서대로 진행합니다.</text><rect x="48" y="483" width="336" height="230" rx="20" fill="#fff5e7" stroke="#d6e2d9"/><rect x="68" y="503" width="42" height="36" rx="10" fill="#8a540a" stroke="none"/><text x="76" y="528" font-size="22" fill="white" font-weight="700">03</text><text x="70" y="577" font-size="28" fill="#8a540a" font-weight="700">검토 기준</text><text x="70" y="628" font-size="26" fill="#253d33" font-weight="400">주장 근거·행동</text><text x="70" y="665" font-size="26" fill="#253d33" font-weight="400">버튼·모바일 가독성을</text><text x="70" y="702" font-size="26" fill="#253d33" font-weight="400">확인합니다.</text><rect x="416" y="483" width="336" height="230" rx="20" fill="#f3effa" stroke="#d6e2d9"/><rect x="436" y="503" width="42" height="36" rx="10" fill="#654395" stroke="none"/><text x="444" y="528" font-size="22" fill="white" font-weight="700">04</text><text x="438" y="577" font-size="28" fill="#654395" font-weight="700">만들 결과</text><text x="438" y="628" font-size="26" fill="#253d33" font-weight="400">브랜드 기준과 랜딩</text><text x="438" y="665" font-size="26" fill="#253d33" font-weight="400">페이지 초안</text><text x="48" y="764" font-size="29" fill="#173d2b" font-weight="700">가상 예제로 읽어 보기</text><rect x="48" y="785" width="704" height="191" rx="16" fill="#f8faf8" stroke="#d6e2d9"/><text x="70" y="827" font-size="23" fill="#285942" font-weight="700">제공 자료</text><text x="70" y="871" font-size="26" fill="#253d33" font-weight="400">가상 발표: 문의 6건을 배송 3·반품 2·결제 1로</text><text x="70" y="908" font-size="26" fill="#253d33" font-weight="400">정리한 개선 제안. 청중은 고객지원 팀장. 브랜드</text><text x="70" y="945" font-size="26" fill="#253d33" font-weight="400">색과 화면 크기는 미정.</text><rect x="48" y="992" width="704" height="191" rx="16" fill="#f8faf8" stroke="#d6e2d9"/><text x="70" y="1034" font-size="23" fill="#285942" font-weight="700">예상 결과</text><text x="70" y="1078" font-size="26" fill="#253d33" font-weight="400">문제, 분류 근거, FAQ 초안, 확인 필요 사항,</text><text x="70" y="1115" font-size="26" fill="#253d33" font-weight="400">다음 행동 순서로 구성합니다. 차트에 문의 수와</text><text x="70" y="1152" font-size="26" fill="#253d33" font-weight="400">단위를 쓰며 글자는 발표 화면에서 확인합니다.</text><rect x="48" y="1199" width="704" height="150" rx="16" fill="#fff8ec" stroke="#ead7b7"/><text x="70" y="1237" font-size="23" fill="#80520e" font-weight="700">주의할 혼동</text><text x="70" y="1279" font-size="25" fill="#67491c" font-weight="400">한 장에 모든 문장을 넣거나 문의 건수를 비율인</text><text x="70" y="1315" font-size="25" fill="#67491c" font-weight="400">것처럼 표시합니다.</text><text x="48" y="1387" font-size="19" fill="#536f61" font-weight="400">본문을 요약한 개념도 · 실제 앱 화면이나 실행 결과가 아닙니다.</text></g></svg>
