<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1480" width="800" height="1480" role="img" aria-labelledby="title desc"><title id="title">재무·세무 담당 한눈에 보기</title><desc id="desc">준비할 자료: 재무 자료·기준 기간·가정 / 작업의 핵심: 제공 자료로 재무 항목을 정리하고 가정과 확인 필요 항목을 구분해 줘. / 검토 기준: 제공 자료와 결과를 비교하고 미정 항목을 구분합니다. / 만들 결과: 재무 분석 또는 점검표</desc><rect width="800" height="1480" fill="#ffffff"/><g font-family="Apple SD Gothic Neo, Malgun Gothic, Noto Sans KR, sans-serif"><text x="48" y="43" font-size="18" fill="#516e60" font-weight="600">MoAI-Cowork · 한국어 개념 설명</text><text x="48" y="102" font-size="38" fill="#173d2b" font-weight="800">재무·세무 담당 한눈에 보기</text><text x="48" y="153" font-size="23" fill="#536f61" font-weight="500">업무 순서  ① → ② → ③ → ④</text><rect x="48" y="183" width="336" height="267" rx="20" fill="#edf5f0" stroke="#d6e2d9"/><rect x="68" y="203" width="42" height="36" rx="10" fill="#285942" stroke="none"/><text x="76" y="228" font-size="22" fill="white" font-weight="700">01</text><text x="70" y="277" font-size="28" fill="#285942" font-weight="700">준비할 자료</text><text x="70" y="328" font-size="26" fill="#253d33" font-weight="400">재무 자료·기준</text><text x="70" y="365" font-size="26" fill="#253d33" font-weight="400">기간·가정</text><rect x="416" y="183" width="336" height="267" rx="20" fill="#ecf3fc" stroke="#d6e2d9"/><rect x="436" y="203" width="42" height="36" rx="10" fill="#245a86" stroke="none"/><text x="444" y="228" font-size="22" fill="white" font-weight="700">02</text><text x="438" y="277" font-size="28" fill="#245a86" font-weight="700">작업의 핵심</text><text x="438" y="328" font-size="26" fill="#253d33" font-weight="400">제공 자료로 재무</text><text x="438" y="365" font-size="26" fill="#253d33" font-weight="400">항목을 정리하고 가정과</text><text x="438" y="402" font-size="26" fill="#253d33" font-weight="400">확인 필요 항목을</text><text x="438" y="439" font-size="26" fill="#253d33" font-weight="400">구분해 줘.</text><rect x="48" y="470" width="336" height="230" rx="20" fill="#fff5e7" stroke="#d6e2d9"/><rect x="68" y="490" width="42" height="36" rx="10" fill="#8a540a" stroke="none"/><text x="76" y="515" font-size="22" fill="white" font-weight="700">03</text><text x="70" y="564" font-size="28" fill="#8a540a" font-weight="700">검토 기준</text><text x="70" y="615" font-size="26" fill="#253d33" font-weight="400">제공 자료와 결과를</text><text x="70" y="652" font-size="26" fill="#253d33" font-weight="400">비교하고 미정 항목을</text><text x="70" y="689" font-size="26" fill="#253d33" font-weight="400">구분합니다.</text><rect x="416" y="470" width="336" height="230" rx="20" fill="#f3effa" stroke="#d6e2d9"/><rect x="436" y="490" width="42" height="36" rx="10" fill="#654395" stroke="none"/><text x="444" y="515" font-size="22" fill="white" font-weight="700">04</text><text x="438" y="564" font-size="28" fill="#654395" font-weight="700">만들 결과</text><text x="438" y="615" font-size="26" fill="#253d33" font-weight="400">재무 분석 또는 점검표</text><text x="48" y="751" font-size="29" fill="#173d2b" font-weight="700">가상 예제로 읽어 보기</text><rect x="48" y="772" width="704" height="228" rx="16" fill="#f8faf8" stroke="#d6e2d9"/><text x="70" y="814" font-size="23" fill="#285942" font-weight="700">제공 자료</text><text x="70" y="858" font-size="26" fill="#253d33" font-weight="400">가상 계획: 판매량 100개, 개당 판매가</text><text x="70" y="895" font-size="26" fill="#253d33" font-weight="400">20,000원, 개당 변동비 8,000원, 고정비</text><text x="70" y="932" font-size="26" fill="#253d33" font-weight="400">500,000원. 모두 전망 가정이며 실제 실적이</text><text x="70" y="969" font-size="26" fill="#253d33" font-weight="400">아님.</text><rect x="48" y="1016" width="704" height="228" rx="16" fill="#f8faf8" stroke="#d6e2d9"/><text x="70" y="1058" font-size="23" fill="#285942" font-weight="700">예상 결과</text><text x="70" y="1102" font-size="26" fill="#253d33" font-weight="400">매출 2,000,000원, 변동비 800,000원, 고정비</text><text x="70" y="1139" font-size="26" fill="#253d33" font-weight="400">500,000원입니다. 이 가정만의 차액은</text><text x="70" y="1176" font-size="26" fill="#253d33" font-weight="400">700,000원이며 미제공 비용을 제외한 계산임을</text><text x="70" y="1213" font-size="26" fill="#253d33" font-weight="400">표시합니다.</text><rect x="48" y="1260" width="704" height="150" rx="16" fill="#fff8ec" stroke="#ead7b7"/><text x="70" y="1298" font-size="23" fill="#80520e" font-weight="700">주의할 혼동</text><text x="70" y="1340" font-size="25" fill="#67491c" font-weight="400">계획 숫자를 확정 실적으로 쓰거나 제공하지 않은</text><text x="70" y="1376" font-size="25" fill="#67491c" font-weight="400">세금과 수수료까지 포함한 이익으로 설명합니다.</text><text x="48" y="1448" font-size="19" fill="#536f61" font-weight="400">본문을 요약한 개념도 · 실제 앱 화면이나 실행 결과가 아닙니다.</text></g></svg>
