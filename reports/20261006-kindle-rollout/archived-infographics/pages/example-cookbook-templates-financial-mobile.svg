<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 2147" width="800" height="2147" role="img" aria-labelledby="title desc"><title id="title">재무 모델링 템플릿 한눈에 보기</title><desc id="desc">준비할 자료: 실적·비용·성장 가정·기간 / 작업의 핵심: 가정을 별도로 기록하고 계산과 시나리오를 확인합니다. / 검토 기준: 가정과 실적 구분·수식·기간·현금흐름을 확인합니다. / 만들 결과: 재무 모델 초안</desc><rect width="800" height="2147" fill="#ffffff"/><g font-family="Apple SD Gothic Neo, Malgun Gothic, Noto Sans KR, sans-serif"><text x="48" y="43" font-size="18" fill="#516e60" font-weight="600">MoAI-Cowork · 한국어 개념 설명</text><text x="48" y="102" font-size="38" fill="#173d2b" font-weight="800">재무 모델링 템플릿 한눈에 보기</text><text x="48" y="153" font-size="23" fill="#536f61" font-weight="500">업무 순서  ① → ② → ③ → ④</text><rect x="48" y="183" width="704" height="196" rx="20" fill="#edf5f0" stroke="#d6e2d9"/><rect x="68" y="203" width="42" height="36" rx="10" fill="#285942" stroke="none"/><text x="76" y="228" font-size="22" fill="white" font-weight="700">01</text><text x="70" y="277" font-size="36" fill="#285942" font-weight="700">준비할 자료</text><text x="70" y="337" font-size="36" fill="#253d33" font-weight="400">실적·비용·성장 가정·기간</text><rect x="48" y="399" width="704" height="244" rx="20" fill="#ecf3fc" stroke="#d6e2d9"/><rect x="68" y="419" width="42" height="36" rx="10" fill="#245a86" stroke="none"/><text x="76" y="444" font-size="22" fill="white" font-weight="700">02</text><text x="70" y="493" font-size="36" fill="#245a86" font-weight="700">작업의 핵심</text><text x="70" y="553" font-size="36" fill="#253d33" font-weight="400">가정을 별도로 기록하고 계산과</text><text x="70" y="601" font-size="36" fill="#253d33" font-weight="400">시나리오를 확인합니다.</text><rect x="48" y="663" width="704" height="292" rx="20" fill="#fff5e7" stroke="#d6e2d9"/><rect x="68" y="683" width="42" height="36" rx="10" fill="#8a540a" stroke="none"/><text x="76" y="708" font-size="22" fill="white" font-weight="700">03</text><text x="70" y="757" font-size="36" fill="#8a540a" font-weight="700">검토 기준</text><text x="70" y="817" font-size="36" fill="#253d33" font-weight="400">가정과 실적</text><text x="70" y="865" font-size="36" fill="#253d33" font-weight="400">구분·수식·기간·현금흐름을</text><text x="70" y="913" font-size="36" fill="#253d33" font-weight="400">확인합니다.</text><rect x="48" y="975" width="704" height="196" rx="20" fill="#f3effa" stroke="#d6e2d9"/><rect x="68" y="995" width="42" height="36" rx="10" fill="#654395" stroke="none"/><text x="76" y="1020" font-size="22" fill="white" font-weight="700">04</text><text x="70" y="1069" font-size="36" fill="#654395" font-weight="700">만들 결과</text><text x="70" y="1129" font-size="36" fill="#253d33" font-weight="400">재무 모델 초안</text><text x="48" y="1222" font-size="29" fill="#173d2b" font-weight="700">가상 예제로 읽어 보기</text><rect x="48" y="1243" width="704" height="272" rx="16" fill="#f8faf8" stroke="#d6e2d9"/><text x="70" y="1285" font-size="23" fill="#285942" font-weight="700">제공 자료</text><text x="70" y="1329" font-size="36" fill="#253d33" font-weight="400">가상 계획: 판매량 100개, 개당</text><text x="70" y="1377" font-size="36" fill="#253d33" font-weight="400">판매가 20,000원, 개당 변동비</text><text x="70" y="1425" font-size="36" fill="#253d33" font-weight="400">8,000원, 고정비 500,000원. 모두</text><text x="70" y="1473" font-size="36" fill="#253d33" font-weight="400">전망 가정이며 실제 실적이 아님.</text><rect x="48" y="1531" width="704" height="320" rx="16" fill="#f8faf8" stroke="#d6e2d9"/><text x="70" y="1573" font-size="23" fill="#285942" font-weight="700">예상 결과</text><text x="70" y="1617" font-size="36" fill="#253d33" font-weight="400">매출 2,000,000원, 변동비</text><text x="70" y="1665" font-size="36" fill="#253d33" font-weight="400">800,000원, 고정비</text><text x="70" y="1713" font-size="36" fill="#253d33" font-weight="400">500,000원입니다. 이 가정만의</text><text x="70" y="1761" font-size="36" fill="#253d33" font-weight="400">차액은 700,000원이며 미제공</text><text x="70" y="1809" font-size="36" fill="#253d33" font-weight="400">비용을 제외한 계산임을 표시합니다.</text><rect x="48" y="1867" width="704" height="210" rx="16" fill="#fff8ec" stroke="#ead7b7"/><text x="70" y="1905" font-size="23" fill="#80520e" font-weight="700">주의할 혼동</text><text x="70" y="1947" font-size="32" fill="#67491c" font-weight="400">계획 숫자를 확정 실적으로 쓰거나</text><text x="70" y="1991" font-size="32" fill="#67491c" font-weight="400">제공하지 않은 세금과 수수료까지 포함한</text><text x="70" y="2035" font-size="32" fill="#67491c" font-weight="400">이익으로 설명합니다.</text><text x="48" y="2115" font-size="19" fill="#536f61" font-weight="400">본문을 요약한 개념도 · 실제 앱 화면이나 실행 결과가 아닙니다.</text></g></svg>
