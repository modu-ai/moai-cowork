<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1525" width="800" height="1525" role="img" aria-labelledby="title desc"><title id="title">온라인 강의 한 페이지를 만드는 순서</title><desc id="desc">목표와 쉬운 설명: 수업 후 할 수 있는 일을 정하고 처음 보는 개념을 풉니다. / 그림과 실제 예제: 개념도와 직접 촬영한 화면을 구분하고 자료·요청을 준비합니다. / 실습과 검토: 예상 결과·흔한 실수·확인 문제와 해설을 제공합니다. / 게시 전 문서 확인: 출처·링크·그림·검색·모바일·기존 주소를 확인합니다.</desc><rect width="800" height="1525" fill="#ffffff"/><g font-family="Apple SD Gothic Neo, Malgun Gothic, Noto Sans KR, sans-serif"><text x="48" y="43" font-size="18" fill="#516e60" font-weight="600">MoAI-Cowork · 한국어 개념 설명</text><text x="48" y="102" font-size="38" fill="#173d2b" font-weight="800">온라인 강의 한 페이지를 만드는</text><text x="48" y="152" font-size="38" fill="#173d2b" font-weight="800">순서</text><text x="48" y="203" font-size="23" fill="#536f61" font-weight="500">업무 순서  ① → ② → ③ → ④</text><rect x="48" y="233" width="704" height="244" rx="20" fill="#edf5f0" stroke="#d6e2d9"/><rect x="68" y="253" width="42" height="36" rx="10" fill="#285942" stroke="none"/><text x="76" y="278" font-size="22" fill="white" font-weight="700">01</text><text x="70" y="327" font-size="36" fill="#285942" font-weight="700">목표와 쉬운 설명</text><text x="70" y="387" font-size="36" fill="#253d33" font-weight="400">수업 후 할 수 있는 일을 정하고</text><text x="70" y="435" font-size="36" fill="#253d33" font-weight="400">처음 보는 개념을 풉니다.</text><rect x="48" y="497" width="704" height="244" rx="20" fill="#ecf3fc" stroke="#d6e2d9"/><rect x="68" y="517" width="42" height="36" rx="10" fill="#245a86" stroke="none"/><text x="76" y="542" font-size="22" fill="white" font-weight="700">02</text><text x="70" y="591" font-size="36" fill="#245a86" font-weight="700">그림과 실제 예제</text><text x="70" y="651" font-size="36" fill="#253d33" font-weight="400">개념도와 직접 촬영한 화면을</text><text x="70" y="699" font-size="36" fill="#253d33" font-weight="400">구분하고 자료·요청을 준비합니다.</text><rect x="48" y="761" width="704" height="244" rx="20" fill="#fff5e7" stroke="#d6e2d9"/><rect x="68" y="781" width="42" height="36" rx="10" fill="#8a540a" stroke="none"/><text x="76" y="806" font-size="22" fill="white" font-weight="700">03</text><text x="70" y="855" font-size="36" fill="#8a540a" font-weight="700">실습과 검토</text><text x="70" y="915" font-size="36" fill="#253d33" font-weight="400">예상 결과·흔한 실수·확인 문제와</text><text x="70" y="963" font-size="36" fill="#253d33" font-weight="400">해설을 제공합니다.</text><rect x="48" y="1025" width="704" height="244" rx="20" fill="#f3effa" stroke="#d6e2d9"/><rect x="68" y="1045" width="42" height="36" rx="10" fill="#654395" stroke="none"/><text x="76" y="1070" font-size="22" fill="white" font-weight="700">04</text><text x="70" y="1119" font-size="36" fill="#654395" font-weight="700">게시 전 문서 확인</text><text x="70" y="1179" font-size="36" fill="#253d33" font-weight="400">출처·링크·그림·검색·모바일·기존</text><text x="70" y="1227" font-size="36" fill="#253d33" font-weight="400">주소를 확인합니다.</text><rect x="48" y="1289" width="704" height="166" rx="16" fill="#fff8ec" stroke="#ead7b7"/><text x="70" y="1327" font-size="23" fill="#80520e" font-weight="700">기억할 기준</text><text x="70" y="1369" font-size="32" fill="#67491c" font-weight="400">생성한 개념 그림을 실제 앱 화면으로</text><text x="70" y="1413" font-size="32" fill="#67491c" font-weight="400">표시하지 않습니다.</text><text x="48" y="1493" font-size="19" fill="#536f61" font-weight="400">본문을 요약한 개념도 · 실제 앱 화면이나 실행 결과가 아닙니다.</text></g></svg>
