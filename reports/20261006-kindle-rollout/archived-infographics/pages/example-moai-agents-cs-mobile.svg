<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 2151" width="800" height="2151" role="img" aria-labelledby="title desc"><title id="title">CS매니저 한눈에 보기</title><desc id="desc">준비할 자료: 고객 문의·서비스 정책 / 작업의 핵심: 고객 문의를 유형별로 분류하고 정책에 근거한 FAQ 초안을 작성합니다. / 검토 기준: 제공 자료와 결과를 비교하고 미정 항목을 구분합니다. / 만들 결과: 문의 분류와 FAQ 초안</desc><rect width="800" height="2151" fill="#ffffff"/><g font-family="Apple SD Gothic Neo, Malgun Gothic, Noto Sans KR, sans-serif"><text x="48" y="43" font-size="18" fill="#516e60" font-weight="600">MoAI-Cowork · 한국어 개념 설명</text><text x="48" y="102" font-size="38" fill="#173d2b" font-weight="800">CS매니저 한눈에 보기</text><text x="48" y="153" font-size="23" fill="#536f61" font-weight="500">업무 순서  ① → ② → ③ → ④</text><rect x="48" y="183" width="704" height="196" rx="20" fill="#edf5f0" stroke="#d6e2d9"/><rect x="68" y="203" width="42" height="36" rx="10" fill="#285942" stroke="none"/><text x="76" y="228" font-size="22" fill="white" font-weight="700">01</text><text x="70" y="277" font-size="36" fill="#285942" font-weight="700">준비할 자료</text><text x="70" y="337" font-size="36" fill="#253d33" font-weight="400">고객 문의·서비스 정책</text><rect x="48" y="399" width="704" height="292" rx="20" fill="#ecf3fc" stroke="#d6e2d9"/><rect x="68" y="419" width="42" height="36" rx="10" fill="#245a86" stroke="none"/><text x="76" y="444" font-size="22" fill="white" font-weight="700">02</text><text x="70" y="493" font-size="36" fill="#245a86" font-weight="700">작업의 핵심</text><text x="70" y="553" font-size="36" fill="#253d33" font-weight="400">고객 문의를 유형별로 분류하고</text><text x="70" y="601" font-size="36" fill="#253d33" font-weight="400">정책에 근거한 FAQ 초안을</text><text x="70" y="649" font-size="36" fill="#253d33" font-weight="400">작성합니다.</text><rect x="48" y="711" width="704" height="244" rx="20" fill="#fff5e7" stroke="#d6e2d9"/><rect x="68" y="731" width="42" height="36" rx="10" fill="#8a540a" stroke="none"/><text x="76" y="756" font-size="22" fill="white" font-weight="700">03</text><text x="70" y="805" font-size="36" fill="#8a540a" font-weight="700">검토 기준</text><text x="70" y="865" font-size="36" fill="#253d33" font-weight="400">제공 자료와 결과를 비교하고 미정</text><text x="70" y="913" font-size="36" fill="#253d33" font-weight="400">항목을 구분합니다.</text><rect x="48" y="975" width="704" height="196" rx="20" fill="#f3effa" stroke="#d6e2d9"/><rect x="68" y="995" width="42" height="36" rx="10" fill="#654395" stroke="none"/><text x="76" y="1020" font-size="22" fill="white" font-weight="700">04</text><text x="70" y="1069" font-size="36" fill="#654395" font-weight="700">만들 결과</text><text x="70" y="1129" font-size="36" fill="#253d33" font-weight="400">문의 분류와 FAQ 초안</text><text x="48" y="1222" font-size="29" fill="#173d2b" font-weight="700">가상 예제로 읽어 보기</text><rect x="48" y="1243" width="704" height="320" rx="16" fill="#f8faf8" stroke="#d6e2d9"/><text x="70" y="1285" font-size="23" fill="#285942" font-weight="700">제공 자료</text><text x="70" y="1329" font-size="36" fill="#253d33" font-weight="400">수업용 문의 6건: 배송 3건, 반품</text><text x="70" y="1377" font-size="36" fill="#253d33" font-weight="400">2건, 결제 1건. 정책은 영업일 2일</text><text x="70" y="1425" font-size="36" fill="#253d33" font-weight="400">이내 출고, 고객지원 창구로 반품</text><text x="70" y="1473" font-size="36" fill="#253d33" font-weight="400">신청. 배송 완료 시점·반품</text><text x="70" y="1521" font-size="36" fill="#253d33" font-weight="400">비용·결제 승인 기준은 없음.</text><rect x="48" y="1579" width="704" height="320" rx="16" fill="#f8faf8" stroke="#d6e2d9"/><text x="70" y="1621" font-size="23" fill="#285942" font-weight="700">예상 결과</text><text x="70" y="1665" font-size="36" fill="#253d33" font-weight="400">유형 합계 6건을 표시하고 출고</text><text x="70" y="1713" font-size="36" fill="#253d33" font-weight="400">기준과 도착 시점을 구분합니다.</text><text x="70" y="1761" font-size="36" fill="#253d33" font-weight="400">반품 비용과 결제 정책은 확인</text><text x="70" y="1809" font-size="36" fill="#253d33" font-weight="400">필요로 남깁니다. 원문 ID를 FAQ</text><text x="70" y="1857" font-size="36" fill="#253d33" font-weight="400">근거에 연결합니다.</text><rect x="48" y="1915" width="704" height="166" rx="16" fill="#fff8ec" stroke="#ead7b7"/><text x="70" y="1953" font-size="23" fill="#80520e" font-weight="700">주의할 혼동</text><text x="70" y="1995" font-size="32" fill="#67491c" font-weight="400">2일 이내 출고를 2일 이내 도착으로</text><text x="70" y="2039" font-size="32" fill="#67491c" font-weight="400">바꾸거나 반품이 항상 무료라고 씁니다.</text><text x="48" y="2119" font-size="19" fill="#536f61" font-weight="400">본문을 요약한 개념도 · 실제 앱 화면이나 실행 결과가 아닙니다.</text></g></svg>
