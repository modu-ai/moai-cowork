<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 940" width="800" height="940" role="img" aria-labelledby="title desc"><title id="title">어떤 확인을 했는지 범위를 밝히기</title><desc id="desc">정적 계약 검사: 형식·필드·참조를 확인합니다. 설치·인증의 증거는 아닙니다. / 도구 목록·단위 검사: 정의와 지정된 동작을 확인합니다. 외부 조회 전체를 대신하지 않습니다. / 대표 업무 실행: 실제로 실행한 예제와 결과만 평가합니다. / 사용자 여정 확인: 앱에서 자료·기능·결과 흐름을 확인하고 환경을 기록합니다.</desc><rect width="800" height="940" fill="#ffffff"/><g font-family="Apple SD Gothic Neo, Malgun Gothic, Noto Sans KR, sans-serif"><text x="48" y="43" font-size="18" fill="#516e60" font-weight="600">MoAI-Cowork · 한국어 개념 설명</text><text x="48" y="102" font-size="38" fill="#173d2b" font-weight="800">어떤 확인을 했는지 범위를 밝히기</text><text x="48" y="153" font-size="23" fill="#536f61" font-weight="500">비슷해 보여도 서로 다른 네 가지</text><rect x="48" y="183" width="336" height="267" rx="20" fill="#edf5f0" stroke="#d6e2d9"/><rect x="68" y="203" width="42" height="36" rx="10" fill="#285942" stroke="none"/><text x="76" y="228" font-size="22" fill="white" font-weight="700">01</text><text x="70" y="277" font-size="28" fill="#285942" font-weight="700">정적 계약 검사</text><text x="70" y="328" font-size="26" fill="#253d33" font-weight="400">형식·필드·참조를</text><text x="70" y="365" font-size="26" fill="#253d33" font-weight="400">확인합니다.</text><text x="70" y="402" font-size="26" fill="#253d33" font-weight="400">설치·인증의 증거는</text><text x="70" y="439" font-size="26" fill="#253d33" font-weight="400">아닙니다.</text><rect x="416" y="183" width="336" height="267" rx="20" fill="#ecf3fc" stroke="#d6e2d9"/><rect x="436" y="203" width="42" height="36" rx="10" fill="#245a86" stroke="none"/><text x="444" y="228" font-size="22" fill="white" font-weight="700">02</text><text x="438" y="277" font-size="28" fill="#245a86" font-weight="700">도구 목록·단위 검사</text><text x="438" y="328" font-size="26" fill="#253d33" font-weight="400">정의와 지정된 동작을</text><text x="438" y="365" font-size="26" fill="#253d33" font-weight="400">확인합니다. 외부 조회</text><text x="438" y="402" font-size="26" fill="#253d33" font-weight="400">전체를 대신하지</text><text x="438" y="439" font-size="26" fill="#253d33" font-weight="400">않습니다.</text><rect x="48" y="470" width="336" height="230" rx="20" fill="#fff5e7" stroke="#d6e2d9"/><rect x="68" y="490" width="42" height="36" rx="10" fill="#8a540a" stroke="none"/><text x="76" y="515" font-size="22" fill="white" font-weight="700">03</text><text x="70" y="564" font-size="28" fill="#8a540a" font-weight="700">대표 업무 실행</text><text x="70" y="615" font-size="26" fill="#253d33" font-weight="400">실제로 실행한 예제와</text><text x="70" y="652" font-size="26" fill="#253d33" font-weight="400">결과만 평가합니다.</text><rect x="416" y="470" width="336" height="230" rx="20" fill="#f3effa" stroke="#d6e2d9"/><rect x="436" y="490" width="42" height="36" rx="10" fill="#654395" stroke="none"/><text x="444" y="515" font-size="22" fill="white" font-weight="700">04</text><text x="438" y="564" font-size="28" fill="#654395" font-weight="700">사용자 여정 확인</text><text x="438" y="615" font-size="26" fill="#253d33" font-weight="400">앱에서 자료·기능·결과</text><text x="438" y="652" font-size="26" fill="#253d33" font-weight="400">흐름을 확인하고 환경을</text><text x="438" y="689" font-size="26" fill="#253d33" font-weight="400">기록합니다.</text><rect x="48" y="720" width="704" height="150" rx="16" fill="#fff8ec" stroke="#ead7b7"/><text x="70" y="758" font-size="23" fill="#80520e" font-weight="700">기억할 기준</text><text x="70" y="800" font-size="25" fill="#67491c" font-weight="400">검증 명령·출력·트리·범위를 남깁니다. 미실행</text><text x="70" y="836" font-size="25" fill="#67491c" font-weight="400">예제는 통과로 표시하지 않습니다.</text><text x="48" y="908" font-size="19" fill="#536f61" font-weight="400">본문을 요약한 개념도 · 실제 앱 화면이나 실행 결과가 아닙니다.</text></g></svg>
