<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 866" width="800" height="866" role="img" aria-labelledby="title desc"><title id="title">다음 담당자에게 전달할 네 묶음</title><desc id="desc">목표와 역할: 무엇을 만들고 누가 맡을지 지정합니다. / 자료와 앞 결과: 원본·버전·앞 단계 결과와 출처를 전달합니다. / 미정 정보와 질문: 모르는 값과 필요한 질문을 함께 넘깁니다. / 출력과 완료 기준: 형식·저장 위치·검토 조건을 정합니다.</desc><rect width="800" height="866" fill="#ffffff"/><g font-family="Apple SD Gothic Neo, Malgun Gothic, Noto Sans KR, sans-serif"><text x="48" y="43" font-size="18" fill="#516e60" font-weight="600">MoAI-Cowork · 한국어 개념 설명</text><text x="48" y="102" font-size="38" fill="#173d2b" font-weight="800">다음 담당자에게 전달할 네 묶음</text><text x="48" y="153" font-size="23" fill="#536f61" font-weight="500">비슷해 보여도 서로 다른 네 가지</text><rect x="48" y="183" width="336" height="230" rx="20" fill="#edf5f0" stroke="#d6e2d9"/><rect x="68" y="203" width="42" height="36" rx="10" fill="#285942" stroke="none"/><text x="76" y="228" font-size="22" fill="white" font-weight="700">01</text><text x="70" y="277" font-size="28" fill="#285942" font-weight="700">목표와 역할</text><text x="70" y="328" font-size="26" fill="#253d33" font-weight="400">무엇을 만들고 누가</text><text x="70" y="365" font-size="26" fill="#253d33" font-weight="400">맡을지 지정합니다.</text><rect x="416" y="183" width="336" height="230" rx="20" fill="#ecf3fc" stroke="#d6e2d9"/><rect x="436" y="203" width="42" height="36" rx="10" fill="#245a86" stroke="none"/><text x="444" y="228" font-size="22" fill="white" font-weight="700">02</text><text x="438" y="277" font-size="28" fill="#245a86" font-weight="700">자료와 앞 결과</text><text x="438" y="328" font-size="26" fill="#253d33" font-weight="400">원본·버전·앞 단계</text><text x="438" y="365" font-size="26" fill="#253d33" font-weight="400">결과와 출처를</text><text x="438" y="402" font-size="26" fill="#253d33" font-weight="400">전달합니다.</text><rect x="48" y="433" width="336" height="193" rx="20" fill="#fff5e7" stroke="#d6e2d9"/><rect x="68" y="453" width="42" height="36" rx="10" fill="#8a540a" stroke="none"/><text x="76" y="478" font-size="22" fill="white" font-weight="700">03</text><text x="70" y="527" font-size="28" fill="#8a540a" font-weight="700">미정 정보와 질문</text><text x="70" y="578" font-size="26" fill="#253d33" font-weight="400">모르는 값과 필요한</text><text x="70" y="615" font-size="26" fill="#253d33" font-weight="400">질문을 함께 넘깁니다.</text><rect x="416" y="433" width="336" height="193" rx="20" fill="#f3effa" stroke="#d6e2d9"/><rect x="436" y="453" width="42" height="36" rx="10" fill="#654395" stroke="none"/><text x="444" y="478" font-size="22" fill="white" font-weight="700">04</text><text x="438" y="527" font-size="28" fill="#654395" font-weight="700">출력과 완료 기준</text><text x="438" y="578" font-size="26" fill="#253d33" font-weight="400">형식·저장 위치·검토</text><text x="438" y="615" font-size="26" fill="#253d33" font-weight="400">조건을 정합니다.</text><rect x="48" y="646" width="704" height="150" rx="16" fill="#fff8ec" stroke="#ead7b7"/><text x="70" y="684" font-size="23" fill="#80520e" font-weight="700">기억할 기준</text><text x="70" y="726" font-size="25" fill="#67491c" font-weight="400">독립된 작업만 병렬 후보입니다. 기간·단위·중복을</text><text x="70" y="762" font-size="25" fill="#67491c" font-weight="400">맞춘 뒤 합치세요.</text><text x="48" y="834" font-size="19" fill="#536f61" font-weight="400">본문을 요약한 개념도 · 실제 앱 화면이나 실행 결과가 아닙니다.</text></g></svg>
