<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 2147" width="800" height="2147" role="img" aria-labelledby="title desc"><title id="title">미디어 크리에이터 한눈에 보기</title><desc id="desc">준비할 자료: 제작 목적·장면·형식·참고 자료 / 작업의 핵심: 이 자료로 이미지 제작안을 작성합니다. 실제 생성 도구와 비용 조건은 먼저 확인해 줘. / 검토 기준: 제공 자료와 결과를 비교하고 미정 항목을 구분합니다. / 만들 결과: 이미지·영상 제작안 또는 지원되는 생성 결과</desc><rect width="800" height="2147" fill="#ffffff"/><g font-family="Apple SD Gothic Neo, Malgun Gothic, Noto Sans KR, sans-serif"><text x="48" y="43" font-size="18" fill="#516e60" font-weight="600">MoAI-Cowork · 한국어 개념 설명</text><text x="48" y="102" font-size="38" fill="#173d2b" font-weight="800">미디어 크리에이터 한눈에 보기</text><text x="48" y="153" font-size="23" fill="#536f61" font-weight="500">업무 순서  ① → ② → ③ → ④</text><rect x="48" y="183" width="704" height="196" rx="20" fill="#edf5f0" stroke="#d6e2d9"/><rect x="68" y="203" width="42" height="36" rx="10" fill="#285942" stroke="none"/><text x="76" y="228" font-size="22" fill="white" font-weight="700">01</text><text x="70" y="277" font-size="36" fill="#285942" font-weight="700">준비할 자료</text><text x="70" y="337" font-size="36" fill="#253d33" font-weight="400">제작 목적·장면·형식·참고 자료</text><rect x="48" y="399" width="704" height="292" rx="20" fill="#ecf3fc" stroke="#d6e2d9"/><rect x="68" y="419" width="42" height="36" rx="10" fill="#245a86" stroke="none"/><text x="76" y="444" font-size="22" fill="white" font-weight="700">02</text><text x="70" y="493" font-size="36" fill="#245a86" font-weight="700">작업의 핵심</text><text x="70" y="553" font-size="36" fill="#253d33" font-weight="400">이 자료로 이미지 제작안을</text><text x="70" y="601" font-size="36" fill="#253d33" font-weight="400">작성합니다. 실제 생성 도구와 비용</text><text x="70" y="649" font-size="36" fill="#253d33" font-weight="400">조건은 먼저 확인해 줘.</text><rect x="48" y="711" width="704" height="244" rx="20" fill="#fff5e7" stroke="#d6e2d9"/><rect x="68" y="731" width="42" height="36" rx="10" fill="#8a540a" stroke="none"/><text x="76" y="756" font-size="22" fill="white" font-weight="700">03</text><text x="70" y="805" font-size="36" fill="#8a540a" font-weight="700">검토 기준</text><text x="70" y="865" font-size="36" fill="#253d33" font-weight="400">제공 자료와 결과를 비교하고 미정</text><text x="70" y="913" font-size="36" fill="#253d33" font-weight="400">항목을 구분합니다.</text><rect x="48" y="975" width="704" height="244" rx="20" fill="#f3effa" stroke="#d6e2d9"/><rect x="68" y="995" width="42" height="36" rx="10" fill="#654395" stroke="none"/><text x="76" y="1020" font-size="22" fill="white" font-weight="700">04</text><text x="70" y="1069" font-size="36" fill="#654395" font-weight="700">만들 결과</text><text x="70" y="1129" font-size="36" fill="#253d33" font-weight="400">이미지·영상 제작안 또는 지원되는</text><text x="70" y="1177" font-size="36" fill="#253d33" font-weight="400">생성 결과</text><text x="48" y="1270" font-size="29" fill="#173d2b" font-weight="700">가상 예제로 읽어 보기</text><rect x="48" y="1291" width="704" height="272" rx="16" fill="#f8faf8" stroke="#d6e2d9"/><text x="70" y="1333" font-size="23" fill="#285942" font-weight="700">제공 자료</text><text x="70" y="1377" font-size="36" fill="#253d33" font-weight="400">가상 이미지 요청: 고객 문의 업무를</text><text x="70" y="1425" font-size="36" fill="#253d33" font-weight="400">설명하는 한국어 개념 그림. 실제 앱</text><text x="70" y="1473" font-size="36" fill="#253d33" font-weight="400">화면을 흉내 내지 않으며 제목과</text><text x="70" y="1521" font-size="36" fill="#253d33" font-weight="400">흐름이 읽혀야 함.</text><rect x="48" y="1579" width="704" height="272" rx="16" fill="#f8faf8" stroke="#d6e2d9"/><text x="70" y="1621" font-size="23" fill="#285942" font-weight="700">예상 결과</text><text x="70" y="1665" font-size="36" fill="#253d33" font-weight="400">개념도에는 목표·자료·질문·검토를</text><text x="70" y="1713" font-size="36" fill="#253d33" font-weight="400">배치합니다. 실제 UI 안내는 직접</text><text x="70" y="1761" font-size="36" fill="#253d33" font-weight="400">촬영한 화면을 사용하며 글자와</text><text x="70" y="1809" font-size="36" fill="#253d33" font-weight="400">화살표를 검토합니다.</text><rect x="48" y="1867" width="704" height="210" rx="16" fill="#fff8ec" stroke="#ead7b7"/><text x="70" y="1905" font-size="23" fill="#80520e" font-weight="700">주의할 혼동</text><text x="70" y="1947" font-size="32" fill="#67491c" font-weight="400">생성한 화면을 실제 앱 스크린샷으로</text><text x="70" y="1991" font-size="32" fill="#67491c" font-weight="400">표시하거나 한국어 오타가 있는 이미지를</text><text x="70" y="2035" font-size="32" fill="#67491c" font-weight="400">바로 사용합니다.</text><text x="48" y="2115" font-size="19" fill="#536f61" font-weight="400">본문을 요약한 개념도 · 실제 앱 화면이나 실행 결과가 아닙니다.</text></g></svg>
