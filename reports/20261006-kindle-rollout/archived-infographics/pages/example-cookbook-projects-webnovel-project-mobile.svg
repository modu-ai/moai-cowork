<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 2057" width="800" height="2057" role="img" aria-labelledby="title desc"><title id="title">웹소설 기획부터 연재·표지까지 한눈에 보기</title><desc id="desc">준비할 자료: 장르·독자·세계관·등장인물 / 작업의 핵심: 기획, 설정, 회차 구조, 초안, 설정 검토 순서로 진행합니다. / 검토 기준: 설정 일관성·인물 동기·저작권과 유사성을 확인합니다. / 만들 결과: 웹소설 기획안과 첫 회 초안</desc><rect width="800" height="2057" fill="#ffffff"/><g font-family="Apple SD Gothic Neo, Malgun Gothic, Noto Sans KR, sans-serif"><text x="48" y="43" font-size="18" fill="#516e60" font-weight="600">MoAI-Cowork · 한국어 개념 설명</text><text x="48" y="102" font-size="38" fill="#173d2b" font-weight="800">웹소설 기획부터 연재·표지까지</text><text x="48" y="152" font-size="38" fill="#173d2b" font-weight="800">한눈에 보기</text><text x="48" y="203" font-size="23" fill="#536f61" font-weight="500">업무 순서  ① → ② → ③ → ④</text><rect x="48" y="233" width="704" height="196" rx="20" fill="#edf5f0" stroke="#d6e2d9"/><rect x="68" y="253" width="42" height="36" rx="10" fill="#285942" stroke="none"/><text x="76" y="278" font-size="22" fill="white" font-weight="700">01</text><text x="70" y="327" font-size="36" fill="#285942" font-weight="700">준비할 자료</text><text x="70" y="387" font-size="36" fill="#253d33" font-weight="400">장르·독자·세계관·등장인물</text><rect x="48" y="449" width="704" height="244" rx="20" fill="#ecf3fc" stroke="#d6e2d9"/><rect x="68" y="469" width="42" height="36" rx="10" fill="#245a86" stroke="none"/><text x="76" y="494" font-size="22" fill="white" font-weight="700">02</text><text x="70" y="543" font-size="36" fill="#245a86" font-weight="700">작업의 핵심</text><text x="70" y="603" font-size="36" fill="#253d33" font-weight="400">기획, 설정, 회차 구조, 초안, 설정</text><text x="70" y="651" font-size="36" fill="#253d33" font-weight="400">검토 순서로 진행합니다.</text><rect x="48" y="713" width="704" height="244" rx="20" fill="#fff5e7" stroke="#d6e2d9"/><rect x="68" y="733" width="42" height="36" rx="10" fill="#8a540a" stroke="none"/><text x="76" y="758" font-size="22" fill="white" font-weight="700">03</text><text x="70" y="807" font-size="36" fill="#8a540a" font-weight="700">검토 기준</text><text x="70" y="867" font-size="36" fill="#253d33" font-weight="400">설정 일관성·인물 동기·저작권과</text><text x="70" y="915" font-size="36" fill="#253d33" font-weight="400">유사성을 확인합니다.</text><rect x="48" y="977" width="704" height="196" rx="20" fill="#f3effa" stroke="#d6e2d9"/><rect x="68" y="997" width="42" height="36" rx="10" fill="#654395" stroke="none"/><text x="76" y="1022" font-size="22" fill="white" font-weight="700">04</text><text x="70" y="1071" font-size="36" fill="#654395" font-weight="700">만들 결과</text><text x="70" y="1131" font-size="36" fill="#253d33" font-weight="400">웹소설 기획안과 첫 회 초안</text><text x="48" y="1224" font-size="29" fill="#173d2b" font-weight="700">가상 예제로 읽어 보기</text><rect x="48" y="1245" width="704" height="272" rx="16" fill="#f8faf8" stroke="#d6e2d9"/><text x="70" y="1287" font-size="23" fill="#285942" font-weight="700">제공 자료</text><text x="70" y="1331" font-size="36" fill="#253d33" font-weight="400">가상 설정: 기록을 잃은 도시에서</text><text x="70" y="1379" font-size="36" fill="#253d33" font-weight="400">지도 제작자 민이 오래된 지도를</text><text x="70" y="1427" font-size="36" fill="#253d33" font-weight="400">찾는다. 지도는 과거의 길만 보여</text><text x="70" y="1475" font-size="36" fill="#253d33" font-weight="400">주며 미래는 보여 주지 못한다.</text><rect x="48" y="1533" width="704" height="272" rx="16" fill="#f8faf8" stroke="#d6e2d9"/><text x="70" y="1575" font-size="23" fill="#285942" font-weight="700">예상 결과</text><text x="70" y="1619" font-size="36" fill="#253d33" font-weight="400">민의 목표와 장애물을 정하고 첫</text><text x="70" y="1667" font-size="36" fill="#253d33" font-weight="400">장면을 씁니다. 지도가 미래를 알려</text><text x="70" y="1715" font-size="36" fill="#253d33" font-weight="400">주는 장면은 넣지 않고 설정 검토</text><text x="70" y="1763" font-size="36" fill="#253d33" font-weight="400">목록을 남깁니다.</text><rect x="48" y="1821" width="704" height="166" rx="16" fill="#fff8ec" stroke="#ead7b7"/><text x="70" y="1859" font-size="23" fill="#80520e" font-weight="700">주의할 혼동</text><text x="70" y="1901" font-size="32" fill="#67491c" font-weight="400">회차가 바뀌며 지도의 능력을 임의로</text><text x="70" y="1945" font-size="32" fill="#67491c" font-weight="400">확장하거나 인물의 목표가 사라집니다.</text><text x="48" y="2025" font-size="19" fill="#536f61" font-weight="400">본문을 요약한 개념도 · 실제 앱 화면이나 실행 결과가 아닙니다.</text></g></svg>
