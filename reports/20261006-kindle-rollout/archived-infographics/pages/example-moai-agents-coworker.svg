<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1332" width="800" height="1332" role="img" aria-labelledby="title desc"><title id="title">코워커 한눈에 보기</title><desc id="desc">준비할 자료: 업무 메모 / 작업의 핵심: 업무 메모로 성과·문제·다음 행동을 정리해 줘. / 검토 기준: 제공 자료와 결과를 비교하고 미정 항목을 구분합니다. / 만들 결과: 주간보고 초안</desc><rect width="800" height="1332" fill="#ffffff"/><g font-family="Apple SD Gothic Neo, Malgun Gothic, Noto Sans KR, sans-serif"><text x="48" y="43" font-size="18" fill="#516e60" font-weight="600">MoAI-Cowork · 한국어 개념 설명</text><text x="48" y="102" font-size="38" fill="#173d2b" font-weight="800">코워커 한눈에 보기</text><text x="48" y="153" font-size="23" fill="#536f61" font-weight="500">업무 순서  ① → ② → ③ → ④</text><rect x="48" y="183" width="336" height="230" rx="20" fill="#edf5f0" stroke="#d6e2d9"/><rect x="68" y="203" width="42" height="36" rx="10" fill="#285942" stroke="none"/><text x="76" y="228" font-size="22" fill="white" font-weight="700">01</text><text x="70" y="277" font-size="28" fill="#285942" font-weight="700">준비할 자료</text><text x="70" y="328" font-size="26" fill="#253d33" font-weight="400">업무 메모</text><rect x="416" y="183" width="336" height="230" rx="20" fill="#ecf3fc" stroke="#d6e2d9"/><rect x="436" y="203" width="42" height="36" rx="10" fill="#245a86" stroke="none"/><text x="444" y="228" font-size="22" fill="white" font-weight="700">02</text><text x="438" y="277" font-size="28" fill="#245a86" font-weight="700">작업의 핵심</text><text x="438" y="328" font-size="26" fill="#253d33" font-weight="400">업무 메모로</text><text x="438" y="365" font-size="26" fill="#253d33" font-weight="400">성과·문제·다음 행동을</text><text x="438" y="402" font-size="26" fill="#253d33" font-weight="400">정리해 줘.</text><rect x="48" y="433" width="336" height="230" rx="20" fill="#fff5e7" stroke="#d6e2d9"/><rect x="68" y="453" width="42" height="36" rx="10" fill="#8a540a" stroke="none"/><text x="76" y="478" font-size="22" fill="white" font-weight="700">03</text><text x="70" y="527" font-size="28" fill="#8a540a" font-weight="700">검토 기준</text><text x="70" y="578" font-size="26" fill="#253d33" font-weight="400">제공 자료와 결과를</text><text x="70" y="615" font-size="26" fill="#253d33" font-weight="400">비교하고 미정 항목을</text><text x="70" y="652" font-size="26" fill="#253d33" font-weight="400">구분합니다.</text><rect x="416" y="433" width="336" height="230" rx="20" fill="#f3effa" stroke="#d6e2d9"/><rect x="436" y="453" width="42" height="36" rx="10" fill="#654395" stroke="none"/><text x="444" y="478" font-size="22" fill="white" font-weight="700">04</text><text x="438" y="527" font-size="28" fill="#654395" font-weight="700">만들 결과</text><text x="438" y="578" font-size="26" fill="#253d33" font-weight="400">주간보고 초안</text><text x="48" y="714" font-size="29" fill="#173d2b" font-weight="700">가상 예제로 읽어 보기</text><rect x="48" y="735" width="704" height="154" rx="16" fill="#f8faf8" stroke="#d6e2d9"/><text x="70" y="777" font-size="23" fill="#285942" font-weight="700">제공 자료</text><text x="70" y="821" font-size="26" fill="#253d33" font-weight="400">문의 12건 답변, FAQ 초안 4개, 배송 지연 원인</text><text x="70" y="858" font-size="26" fill="#253d33" font-weight="400">미확인. 다음 행동은 안내문 수정과 FAQ 검토.</text><rect x="48" y="905" width="704" height="191" rx="16" fill="#f8faf8" stroke="#d6e2d9"/><text x="70" y="947" font-size="23" fill="#285942" font-weight="700">예상 결과</text><text x="70" y="991" font-size="26" fill="#253d33" font-weight="400">문의 12건은 답변 완료, FAQ 4개는 검토 전</text><text x="70" y="1028" font-size="26" fill="#253d33" font-weight="400">초안으로 나눕니다. 배송 지연 원인과 다음 행동의</text><text x="70" y="1065" font-size="26" fill="#253d33" font-weight="400">담당자는 확인 필요로 표시합니다.</text><rect x="48" y="1112" width="704" height="150" rx="16" fill="#fff8ec" stroke="#ead7b7"/><text x="70" y="1150" font-size="23" fill="#80520e" font-weight="700">주의할 혼동</text><text x="70" y="1192" font-size="25" fill="#67491c" font-weight="400">FAQ 4개를 최종 완료로 쓰거나 배송 지연 원인을</text><text x="70" y="1228" font-size="25" fill="#67491c" font-weight="400">추정합니다.</text><text x="48" y="1300" font-size="19" fill="#536f61" font-weight="400">본문을 요약한 개념도 · 실제 앱 화면이나 실행 결과가 아닙니다.</text></g></svg>
