<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 2055" width="800" height="2055" role="img" aria-labelledby="title desc"><title id="title">법률 트랙 한눈에 보기</title><desc id="desc">준비할 자료: 문서·관할·검토 목적 / 작업의 핵심: 자료 확인, 요구 정리, 초안, 검토 순서로 진행합니다. / 검토 기준: 원문 조항·공식 근거·관할을 확인합니다. / 만들 결과: 법률 확인 목록</desc><rect width="800" height="2055" fill="#ffffff"/><g font-family="Apple SD Gothic Neo, Malgun Gothic, Noto Sans KR, sans-serif"><text x="48" y="43" font-size="18" fill="#516e60" font-weight="600">MoAI-Cowork · 한국어 개념 설명</text><text x="48" y="102" font-size="38" fill="#173d2b" font-weight="800">법률 트랙 한눈에 보기</text><text x="48" y="153" font-size="23" fill="#536f61" font-weight="500">업무 순서  ① → ② → ③ → ④</text><rect x="48" y="183" width="704" height="196" rx="20" fill="#edf5f0" stroke="#d6e2d9"/><rect x="68" y="203" width="42" height="36" rx="10" fill="#285942" stroke="none"/><text x="76" y="228" font-size="22" fill="white" font-weight="700">01</text><text x="70" y="277" font-size="36" fill="#285942" font-weight="700">준비할 자료</text><text x="70" y="337" font-size="36" fill="#253d33" font-weight="400">문서·관할·검토 목적</text><rect x="48" y="399" width="704" height="244" rx="20" fill="#ecf3fc" stroke="#d6e2d9"/><rect x="68" y="419" width="42" height="36" rx="10" fill="#245a86" stroke="none"/><text x="76" y="444" font-size="22" fill="white" font-weight="700">02</text><text x="70" y="493" font-size="36" fill="#245a86" font-weight="700">작업의 핵심</text><text x="70" y="553" font-size="36" fill="#253d33" font-weight="400">자료 확인, 요구 정리, 초안, 검토</text><text x="70" y="601" font-size="36" fill="#253d33" font-weight="400">순서로 진행합니다.</text><rect x="48" y="663" width="704" height="244" rx="20" fill="#fff5e7" stroke="#d6e2d9"/><rect x="68" y="683" width="42" height="36" rx="10" fill="#8a540a" stroke="none"/><text x="76" y="708" font-size="22" fill="white" font-weight="700">03</text><text x="70" y="757" font-size="36" fill="#8a540a" font-weight="700">검토 기준</text><text x="70" y="817" font-size="36" fill="#253d33" font-weight="400">원문 조항·공식 근거·관할을</text><text x="70" y="865" font-size="36" fill="#253d33" font-weight="400">확인합니다.</text><rect x="48" y="927" width="704" height="196" rx="20" fill="#f3effa" stroke="#d6e2d9"/><rect x="68" y="947" width="42" height="36" rx="10" fill="#654395" stroke="none"/><text x="76" y="972" font-size="22" fill="white" font-weight="700">04</text><text x="70" y="1021" font-size="36" fill="#654395" font-weight="700">만들 결과</text><text x="70" y="1081" font-size="36" fill="#253d33" font-weight="400">법률 확인 목록</text><text x="48" y="1174" font-size="29" fill="#173d2b" font-weight="700">가상 예제로 읽어 보기</text><rect x="48" y="1195" width="704" height="272" rx="16" fill="#f8faf8" stroke="#d6e2d9"/><text x="70" y="1237" font-size="23" fill="#285942" font-weight="700">제공 자료</text><text x="70" y="1281" font-size="36" fill="#253d33" font-weight="400">가상 조항: 제3조 대금은</text><text x="70" y="1329" font-size="36" fill="#253d33" font-weight="400">300,000원. 지급 기한은 공란.</text><text x="70" y="1377" font-size="36" fill="#253d33" font-weight="400">제4조 결과물 수정 횟수는 협의.</text><text x="70" y="1425" font-size="36" fill="#253d33" font-weight="400">당사자와 관할은 미정.</text><rect x="48" y="1483" width="704" height="320" rx="16" fill="#f8faf8" stroke="#d6e2d9"/><text x="70" y="1525" font-size="23" fill="#285942" font-weight="700">예상 결과</text><text x="70" y="1569" font-size="36" fill="#253d33" font-weight="400">제3조의 지급 기한 공란과 제4조의</text><text x="70" y="1617" font-size="36" fill="#253d33" font-weight="400">수정 범위 미정을 쟁점으로</text><text x="70" y="1665" font-size="36" fill="#253d33" font-weight="400">적습니다. 조항 번호와 원문, 필요한</text><text x="70" y="1713" font-size="36" fill="#253d33" font-weight="400">합의 정보를 함께 표시합니다. 법적</text><text x="70" y="1761" font-size="36" fill="#253d33" font-weight="400">효력은 확정하지 않습니다.</text><rect x="48" y="1819" width="704" height="166" rx="16" fill="#fff8ec" stroke="#ead7b7"/><text x="70" y="1857" font-size="23" fill="#80520e" font-weight="700">주의할 혼동</text><text x="70" y="1899" font-size="32" fill="#67491c" font-weight="400">합의하지 않은 기한을 채우거나 관할을</text><text x="70" y="1943" font-size="32" fill="#67491c" font-weight="400">모른 채 적법하다고 결론 냅니다.</text><text x="48" y="2023" font-size="19" fill="#536f61" font-weight="400">본문을 요약한 개념도 · 실제 앱 화면이나 실행 결과가 아닙니다.</text></g></svg>
