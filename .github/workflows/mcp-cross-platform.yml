name: MCP cross-platform tests

on:
  pull_request:
    paths:
      - ".github/workflows/mcp-cross-platform.yml"
      - ".agents/plugins/marketplace.json"
      - ".claude-plugin/marketplace.json"
      - "plugins/_shared/mcp-launch/**"
      - "plugins/_shared/moai-mcp-core/**"
      - "plugins/*/mcp-launch/**"
      - "plugins/*/.claude-plugin/plugin.json"
      - "plugins/*/.codex-plugin/plugin.json"
      - "plugins/*/.mcp.json"
      - "plugins/*/mcp-servers/**"
      - "plugins/*/skills/**"
      - "plugins/*/plugin.json"
      - "plugins/*/mcp.json"
      - ".agents/skills/**"
      - "scripts/check-skill-contracts.py"
      - "scripts/check-mcp-annotations.py"
      - "scripts/sync-plugin-contracts.py"
      - "scripts/sync-skill-evals.py"
      - "scripts/skill-evals-index.json"
      - "plugins/*/evals/**"
      - "scripts/sync-dev-skills.py"
      - "scripts/schemas/**"
      - "scripts/check-plugin-runtimes.py"
      - "scripts/sync-mcp-core.py"
  push:
    paths:
      - ".github/workflows/mcp-cross-platform.yml"
      - ".agents/plugins/marketplace.json"
      - ".claude-plugin/marketplace.json"
      - "plugins/_shared/mcp-launch/**"
      - "plugins/_shared/moai-mcp-core/**"
      - "plugins/*/mcp-launch/**"
      - "plugins/*/.claude-plugin/plugin.json"
      - "plugins/*/.codex-plugin/plugin.json"
      - "plugins/*/.mcp.json"
      - "plugins/*/mcp-servers/**"
      - "plugins/*/skills/**"
      - "plugins/*/plugin.json"
      - "plugins/*/mcp.json"
      - ".agents/skills/**"
      - "scripts/check-skill-contracts.py"
      - "scripts/check-mcp-annotations.py"
      - "scripts/sync-plugin-contracts.py"
      - "scripts/sync-skill-evals.py"
      - "scripts/skill-evals-index.json"
      - "plugins/*/evals/**"
      - "scripts/sync-dev-skills.py"
      - "scripts/schemas/**"
      - "scripts/check-plugin-runtimes.py"
      - "scripts/sync-mcp-core.py"
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUTF8: "1"

jobs:
  plugin-wiring:
    name: ${{ matrix.os }} / plugin wiring
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.9.3"
      - name: Check plugin wiring and launcher copies
        run: uv run --python 3.11 python scripts/check-plugin-runtimes.py
      - name: Check common packages and skill contracts
        run: uv run --no-project --python 3.11 --with skills-ref==0.1.1 --with jsonschema==4.25.1 --with pyyaml==6.0.3 python scripts/check-skill-contracts.py
      - name: Check generated behavioral evals
        run: uv run --no-project --python 3.11 --with pyyaml==6.0.3 python scripts/sync-skill-evals.py --check
      - name: Check developer wrappers
        run: uv run --no-project --python 3.11 python scripts/sync-dev-skills.py --check
      - name: Check PM execution contracts
        run: uv run --no-project --python 3.11 python -m unittest discover -s plugins/moai-pm/skills/project/tests -q
      - name: Check shared core copies
        run: uv run --python 3.11 python scripts/sync-mcp-core.py --check

  core:
    name: ${{ matrix.os }} / MCP core
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.9.3"
      - name: Run shared core tests
        run: uv run --python 3.11 --directory plugins/_shared/moai-mcp-core --group dev pytest -q

  servers:
    name: ${{ matrix.os }} / ${{ matrix.server.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        server:
          - name: openai
            path: plugins/moai-media/mcp-servers/moai-mcp-openai
            dev: --group dev
          - name: ip
            path: plugins/moai-lawyer/mcp-servers/moai-mcp-ip
            dev: --group dev
          - name: threads-poster
            path: plugins/moai-threads-poster/mcp-servers/moai-mcp-threads-poster
            dev: --group dev
          - name: cafe24
            path: plugins/moai-seller/mcp-servers/moai-mcp-cafe24
            dev: --group dev
          - name: smartstore
            path: plugins/moai-seller/mcp-servers/moai-mcp-smartstore
            dev: --extra dev
          - name: imweb
            path: plugins/moai-seller/mcp-servers/moai-mcp-imweb
            dev: --group dev
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.9.3"
      - name: Check runtime tool annotations
        run: uv run --python 3.11 --directory ${{ matrix.server.path }} ${{ matrix.server.dev }} python "${{ github.workspace }}/scripts/check-mcp-annotations.py" --server "moai-mcp-${{ matrix.server.name }}"
      - name: Run server tests
        run: uv run --python 3.11 --directory ${{ matrix.server.path }} ${{ matrix.server.dev }} pytest -q

  launcher:
    name: ${{ matrix.os }} / MCP launcher
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.9.3"
      - name: Run launcher tests
        run: uv run --python 3.11 --with pytest pytest -q plugins/_shared/mcp-launch/test_mcp_launch.py

  writer-humanize:
    name: ${{ matrix.os }} / Korean humanize
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.9.3"
      - name: Run Korean humanize tests
        run: uv run --python 3.11 python -m unittest discover -s plugins/moai-writer/skills/korean-humanize/tests -p "test_*.py" -q
